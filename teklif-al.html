<!DOCTYPE html>
<html lang="tr" class="no-js">

<head>

<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Ücretsiz Teklif Al | Bahçelievler Forum</title>

<meta name="description" content="Bahçelievler ilçesinde aradığınız hizmet için ücretsiz teklif alın. Yerel ustalar ve servisler size ulaşsın.">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#2563eb">

<link rel="icon" href="/favicon.ico">

<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
/* =========================
🔥 RESET + BASE
========================= */

*,
*::before,
*::after{
box-sizing:border-box;
margin:0;
padding:0;
}

html{
-webkit-text-size-adjust:100%;
scroll-behavior:smooth;
}

body{
background:linear-gradient(180deg,#eef2ff,#f8fbff);
font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
-webkit-font-smoothing:antialiased;
text-rendering:optimizeLegibility;
}

/* =========================
🔥 WRAPPER
========================= */

.page-wrapper{
max-width:900px;
margin:auto;
padding-bottom:240px;
}

/* =========================
🔥 TITLE (CROSS BROWSER FIX)
========================= */

.page-title{
font-size:26px;
font-weight:900;
text-align:center;
margin:20px 0 10px;
background:linear-gradient(135deg,#2563eb,#4f46e5);

/* standard */
background-clip:text;

/* safari */
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

color:transparent;
}

/* =========================
🔥 INFO BOX
========================= */

.info-box{
background:linear-gradient(135deg,#eef4ff,#f4f7ff);
border-left:4px solid #2563eb;
padding:18px;
border-radius:16px;
margin:10px 16px 20px;
font-size:14px;
line-height:1.6;
box-shadow:0 12px 30px rgba(0,0,0,.06);
}

/* =========================
🔥 FORM LAYOUT
========================= */

.form-area{
padding:0 12px;
display:flex;
flex-direction:column;
gap:18px;
}

/* =========================
🔥 CARD SYSTEM (PREMIUM)
========================= */

.form-group{
background:#fff;
border-radius:18px;
padding:16px;
box-shadow:0 10px 30px rgba(0,0,0,.06);
transition:transform .2s ease, box-shadow .2s ease;
will-change:transform;
}

.form-group:focus-within{
transform:translateY(-2px);
box-shadow:0 15px 35px rgba(37,99,235,.15);
}

/* =========================
🔥 INPUT SYSTEM
========================= */

.form-control{
width:100%;
padding:14px;
border-radius:12px;
border:1px solid #e2e8f0;
font-size:14px;
background:#f9fafb;
transition:all .2s ease;
margin-top:8px;
}

/* focus */
.form-control:focus{
border-color:#2563eb;
background:#fff;
box-shadow:0 0 0 3px rgba(37,99,235,.12);
outline:none;
}

/* textarea */
textarea.form-control{
min-height:120px;
resize:vertical;
}

/* select fix (ios) */
select.form-control{
appearance:none;
-webkit-appearance:none;
}

/* =========================
🔥 FILE INFO
========================= */

.file-info{
font-size:12px;
color:#e11d48;
margin-top:6px;
}

/* =========================
🔥 BUTTON (APP LEVEL)
========================= */

.submit-wrap{
position:fixed;
left:0;
right:0;
bottom:calc(90px + env(safe-area-inset-bottom));
padding:12px 16px;
z-index:50;
pointer-events:none; /* 🔥 sadece iç buton aktif */
}

.submit-inner{
background:#fff;
border-radius:20px;
padding:10px;
box-shadow:0 10px 30px rgba(0,0,0,.12);
pointer-events:auto;
}

.submit-btn{
width:100%;
padding:16px;
border:none;
border-radius:16px;
background:linear-gradient(135deg,#2563eb,#1d4ed8);
color:#fff;
font-weight:800;
font-size:15px;
cursor:pointer;
transition:transform .15s ease, box-shadow .15s ease;
box-shadow:0 10px 25px rgba(37,99,235,.3);
}

/* hover desktop */
.submit-btn:hover{
transform:translateY(-1px);
}

/* active mobile */
.submit-btn:active{
transform:scale(.96);
}

/* loading */
.submit-btn.loading{
opacity:.7;
pointer-events:none;
}

/* =========================
🔥 MOBILE OPTIMIZATION
========================= */

@media(max-width:600px){

.page-title{
font-size:22px;
}

.form-control{
font-size:15px;
}

/* touch optimize */
.submit-btn{
min-height:52px;
}

}

/* =========================
🔥 PERFORMANCE OPTIMIZATION
========================= */

/* reduce motion */
@media (prefers-reduced-motion: reduce){
*{
animation:none !important;
transition:none !important;
}
}


/* =========================
🔥 TOAST SYSTEM
========================= */

#toastBox{
position:fixed;
top:20px;
right:16px;
display:flex;
flex-direction:column;
gap:10px;
z-index:9999;
}

.toast{
min-width:260px;
max-width:320px;
padding:14px 16px;
border-radius:14px;
color:#fff;
font-size:14px;
box-shadow:0 10px 30px rgba(0,0,0,.15);
animation:toastIn .3s ease, toastOut .3s ease 3.5s forwards;
}

/* türler */
.toast.success{background:#16a34a;}
.toast.error{background:#dc2626;}
.toast.info{background:#2563eb;}

@keyframes toastIn{
from{opacity:0; transform:translateX(40px);}
to{opacity:1; transform:translateX(0);}
}

@keyframes toastOut{
to{opacity:0; transform:translateX(40px);}
}

</style>

</head>

<body>

    <div id="toastBox"></div>

<div id="globalHeader"></div>

<div class="page-wrapper">

<main id="mainContent">

<div class="page-title">
📄 ÜCRETSİZ TEKLİF AL
</div>

<div class="info-box">
<strong>Talebinize Uygun Teklifleri Güvenle Alın</strong>
<br><br>
Bahçelievler Forum üzerinden ilettiğiniz talep ilgili hizmet sağlayıcılara aktarılır.
Size en uygun teklifler doğrudan tarafınıza iletilir.
</div>

<form class="form-area" id="offerForm" novalidate>

<div class="form-group">
<label>Hizmet Türü</label>
<select name="service" id="service" class="form-control" required>
<option value="">Seçiniz</option>
<option>Ürün & Eşya Onarımı</option>
<option>Ev & İşyeri Temizliği</option>
<option>Hasta Bakıcı & Bakım</option>
<option>Boya & Tadilat İşlemi</option>
<option>Bilgisayar Bakım & Onarım</option>
<option>Nakliye & Taşımacılık</option>
<option>Özel Ders & Eğitim</option>
<option>Diğer Hizmet</option>
</select>
</div>

<div class="form-group">
<label>Mahalle</label>
<select name="district" id="district" class="form-control" required>
<option value="">Seçiniz</option>
<option>Bahçelievler Mahallesi</option>
<option>Cumhuriyet Mahallesi</option>
<option>Çobançeşme Mahallesi</option>
<option>Fevzi Çakmak Mahallesi</option>
<option>Hürriyet Mahallesi</option>
<option>Kocasinan Merkez Mahallesi</option>
<option>Siyavuşpaşa Mahallesi</option>
<option>Soğanlı Mahallesi</option>
<option>Şirinevler Mahallesi</option>
<option>Yenibosna Merkez Mahallesi</option>
<option>Zafer Mahallesi</option>
</select>
</div>

<div class="form-group">
<label>İş Detayı</label>
<textarea name="desc" id="desc" class="form-control" placeholder="İşin detaylarını yazınız..." required></textarea>
</div>

<div class="form-group">
<label>Görsel</label>
<input type="file" name="image" id="image" class="form-control" accept="image/*">
<div class="file-info">Max 2MB</div>
</div>

<div class="form-group">
<label>Email</label>
<input type="email" name="email" id="email" class="form-control" placeholder="E-posta adresiniz" required>
</div>

</form>

</main>

</div>

<!-- SUBMIT -->
<div class="submit-wrap">
<div class="submit-inner">
<button class="submit-btn" id="submitBtn">
TEKLİF GÖNDER
</button>
</div>
</div>

<script>

const form = document.getElementById("offerForm");
const btn = document.getElementById("submitBtn");

/* =========================
🔥 TOAST FUNCTION
========================= */

function showToast(message,type="info"){

const box = document.getElementById("toastBox");

const toast = document.createElement("div");
toast.className = "toast " + type;
toast.innerText = message;

box.appendChild(toast);

setTimeout(()=>{
toast.remove();
},4000);

}

/* =========================
🔥 EMAIL REGEX (PRO)
========================= */

function isValidEmail(email){
return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

/* =========================
🔥 SUBMIT
========================= */

btn.addEventListener("click",(e)=>{
e.preventDefault();

/* DOUBLE CLICK ENGEL */
if(btn.classList.contains("loading")) return;

/* INPUT */
const service = document.getElementById("service").value;
const district = document.getElementById("district").value;
const desc = document.getElementById("desc").value.trim();
const email = document.getElementById("email").value.trim();
const file = document.getElementById("image").files[0];

/* VALIDATION */
if(!service) return showToast("Lütfen hizmet seçiniz","error");
if(!district) return showToast("Lütfen mahalle seçiniz","error");
if(desc.length < 10) return showToast("Açıklama çok kısa","error");
if(!isValidEmail(email)) return showToast("Geçerli e-posta giriniz","error");

if(file && file.size > 2 * 1024 * 1024){
return showToast("Görsel max 2MB olmalı","error");
}

/* LOADING */
btn.classList.add("loading");
btn.innerText="Gönderiliyor...";

/* FORM DATA */
const formData = new FormData(form);

/* API */
fetch("/api/teklif-ekle", {
method: "POST",
body: formData
})
.then(async res => {

/* 🔥 STATUS CHECK */
if(!res.ok){
return { ok:false, error:"Sunucu hatası ("+res.status+")" };
}

/* SAFE JSON */
try{
return await res.json();
}catch{
return { ok:false, error:"Sunucu yanıtı hatalı" };
}

})
.then(data => {

if(data.ok){

showToast(
"Talebiniz başarıyla alındı. En kısa sürede sizinle iletişime geçilecektir.",
"success"
);

form.reset();

}else{
showToast(data.error || "Bir hata oluştu","error");
}

})
.catch(()=>{
showToast("Bağlantı hatası, tekrar deneyin","error");
})
.finally(()=>{

btn.classList.remove("loading");
btn.innerText = "TEKLİF GÖNDER";

});

});

</script>

<script src="assets/js/core.js" defer></script>
<script src="assets/js/news.js" defer></script>
<script src="assets/js/footerLegal.js" defer></script>

<div id="globalFooter"></div>

</body>
</html>
