<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Ücretsiz Teklif Al | Bahçelievler Forum</title>

<meta name="description" content="Bahçelievler'de hizmet için ücretsiz teklif alın.">
<meta name="theme-color" content="#2563eb">

<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">

<style>

/* ===== GLOBAL ===== */
body{
margin:0;
font-family:system-ui,-apple-system;
background:#f4f7fb;
}

/* WRAPPER */
.container{
max-width:700px;
margin:auto;
padding:10px 16px 120px;
}

/* TITLE */
.title{
font-size:22px;
font-weight:800;
text-align:center;
margin:15px 0;
}

/* PROGRESS */
.progress{
height:6px;
background:#e5e7eb;
border-radius:10px;
overflow:hidden;
margin-bottom:20px;
}
.progress-bar{
height:100%;
width:25%;
background:linear-gradient(90deg,#2563eb,#4f46e5);
transition:.3s;
}

/* CARD */
.card{
background:white;
border-radius:18px;
padding:18px;
box-shadow:0 10px 30px rgba(0,0,0,.08);
margin-bottom:16px;
animation:fade .3s ease;
}

@keyframes fade{
from{opacity:0;transform:translateY(10px)}
to{opacity:1}
}

/* INPUT */
.input{
width:100%;
padding:14px;
border-radius:12px;
border:1px solid #ddd;
margin-top:10px;
}

/* BUTTON */
.cta{
position:fixed;
bottom:0;
left:0;
right:0;
padding:14px;
background:white;
box-shadow:0 -5px 20px rgba(0,0,0,.08);
}

.cta button{
width:100%;
padding:16px;
border:none;
border-radius:14px;
background:#2563eb;
color:white;
font-weight:700;
font-size:15px;
}

.cta button:disabled{
opacity:.5;
}

/* STEP HIDE */
.step{display:none;}
.step.active{display:block;}

</style>

</head>

<body>

<div id="globalHeader"></div>

<div class="container">

<div class="title">📄 Ücretsiz Teklif Al</div>

<div class="progress">
<div class="progress-bar" id="bar"></div>
</div>

<form id="form">

<!-- STEP 1 -->
<div class="step active">
<div class="card">
<strong>Hizmet Türü</strong>
<select id="service" class="input">
<option value="">Seçiniz</option>
<option>Temizlik</option>
<option>Bakım</option>
<option>Tadilat</option>
<option>Nakliye</option>
</select>
</div>
</div>

<!-- STEP 2 -->
<div class="step">
<div class="card">
<strong>Mahalle</strong>
<select id="district" class="input">
<option value="">Seçiniz</option>
<option>Şirinevler</option>
<option>Yenibosna</option>
<option>Soğanlı</option>
</select>
</div>
</div>

<!-- STEP 3 -->
<div class="step">
<div class="card">
<strong>Detay</strong>
<textarea id="desc" class="input" placeholder="Detay yaz"></textarea>
<input type="file" id="file" class="input">
</div>
</div>

<!-- STEP 4 -->
<div class="step">
<div class="card">
<strong>Email</strong>
<input type="email" id="email" class="input">
</div>
</div>

</form>

</div>

<div class="cta">
<button id="nextBtn">Devam Et</button>
</div>

<script>

let step = 0;
const steps = document.querySelectorAll(".step");
const btn = document.getElementById("nextBtn");
const bar = document.getElementById("bar");

function updateUI(){
steps.forEach(s=>s.classList.remove("active"));
steps[step].classList.add("active");
bar.style.width = ((step+1)*25)+"%";

if(step === steps.length-1){
btn.innerText="Gönder";
}else{
btn.innerText="Devam Et";
}
}

btn.onclick = ()=>{

if(step===0 && !service.value) return alert("Hizmet seç");
if(step===1 && !district.value) return alert("Mahalle seç");
if(step===2 && desc.value.length<5) return alert("Detay yaz");
if(step===3){
if(!email.value.includes("@")) return alert("Email gir");
alert("Talep gönderildi 🚀");
return;
}

step++;
updateUI();

};

</script>

<div id="globalFooter"></div>

</body>
</html>
