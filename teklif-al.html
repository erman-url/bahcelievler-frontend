<!DOCTYPE html>
<html lang="tr" class="no-js">

<head>

<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Ücretsiz Teklif Al | Bahçelievler Forum</title>

<meta name="description" content="Bahçelievler ilçesinde aradığınız hizmet için ücretsiz teklif alın.">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#2563eb">

<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">

<style>

/* ===== GLOBAL ===== */
body{
background:linear-gradient(180deg,#eef2ff,#f8fbff);
font-family:system-ui,-apple-system;
}

/* WRAPPER */
.page-wrapper{
max-width:900px;
margin:auto;
padding-bottom:260px; /* 🔥 footer + submit alan */
}

/* TITLE */
.page-title{
font-size:26px;
font-weight:900;
text-align:center;
margin:20px 0 10px;
background:linear-gradient(135deg,#2563eb,#4f46e5);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

/* INFO */
.info-box{
background:white;
border-radius:18px;
padding:18px;
margin:10px 16px 20px;
box-shadow:0 10px 30px rgba(0,0,0,.06);
}

/* FORM */
.form-area{
padding:0 12px;
display:flex;
flex-direction:column;
gap:18px;
}

/* CARD */
.form-group{
background:white;
border-radius:18px;
padding:16px;
box-shadow:0 10px 25px rgba(0,0,0,.05);
transition:.2s;
}

.form-group:focus-within{
transform:translateY(-2px);
box-shadow:0 15px 35px rgba(37,99,235,.15);
}

/* INPUT */
.form-control{
width:100%;
padding:14px;
border-radius:12px;
border:1px solid #e2e8f0;
background:#f9fafb;
margin-top:8px;
}

.form-control:focus{
border-color:#2563eb;
background:white;
outline:none;
}

/* SUBMIT BAR */
.submit-wrap{
position:fixed;
left:0;
right:0;
bottom:90px; /* 🔥 FOOTER ÜSTÜ */
padding:12px 16px;
z-index:90;
}

.submit-inner{
background:white;
border-radius:20px;
padding:10px;
box-shadow:0 10px 30px rgba(0,0,0,.12);
}

/* BUTTON */
.submit-btn{
width:100%;
padding:16px;
border:none;
border-radius:16px;
background:linear-gradient(135deg,#2563eb,#1d4ed8);
color:white;
font-weight:800;
font-size:15px;
}

.submit-btn:active{
transform:scale(.96);
}

.submit-btn.loading{
opacity:.7;
pointer-events:none;
}

/* MOBILE */
@media(max-width:600px){
.page-title{font-size:22px;}
}

</style>

</head>

<body>

<div id="globalHeader"></div>

<div class="page-wrapper">

<main>

<div class="page-title">📄 ÜCRETSİZ TEKLİF AL</div>

<div class="info-box">
<strong>Hızlı ve güvenli teklif alın</strong>
<br><br>
Talebiniz ilgili ustalara iletilir ve size geri dönüş yapılır.
</div>

<form class="form-area" id="offerForm">

<div class="form-group">
<label>Hizmet</label>
<select id="service" class="form-control">
<option value="">Seçiniz</option>
<option>Temizlik</option>
<option>Bakım</option>
<option>Tadilat</option>
</select>
</div>

<div class="form-group">
<label>Mahalle</label>
<select id="district" class="form-control">
<option value="">Seçiniz</option>
<option>Şirinevler</option>
<option>Yenibosna</option>
<option>Soğanlı</option>
</select>
</div>

<div class="form-group">
<label>Detay</label>
<textarea id="desc" class="form-control"></textarea>
</div>

<div class="form-group">
<label>Görsel</label>
<input type="file" id="image" class="form-control">
</div>

<div class="form-group">
<label>Email</label>
<input type="email" id="email" class="form-control">
</div>

</form>

</div>

<!-- SUBMIT -->
<div class="submit-wrap">
<div class="submit-inner">
<button id="submitBtn" class="submit-btn">
TEKLİF GÖNDER
</button>
</div>
</div>

<script>

const btn = document.getElementById("submitBtn");

btn.onclick = ()=>{

const service = document.getElementById("service").value;
const district = document.getElementById("district").value;
const desc = document.getElementById("desc").value.trim();
const email = document.getElementById("email").value.trim();
const file = document.getElementById("image").files[0];

if(!service) return alert("Hizmet seç");
if(!district) return alert("Mahalle seç");
if(desc.length < 10) return alert("Detay gir");
if(!email.includes("@")) return alert("Email gir");

if(file && file.size > 2*1024*1024){
return alert("Max 2MB");
}

btn.classList.add("loading");
btn.innerText="Gönderiliyor...";

setTimeout(()=>{
alert("Talep alındı 🚀");
btn.classList.remove("loading");
btn.innerText="TEKLİF GÖNDER";
document.getElementById("offerForm").reset();
},1200);

};

</script>

<div id="globalFooter"></div>

</body>
</html>
