<!DOCTYPE html>
<html lang="tr" class="no-js">

<head>

<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Ücretsiz Teklif Al | Bahçelievler Forum</title>

<meta name="description" content="Bahçelievler ilçesinde aradığınız hizmet için ücretsiz teklif alın. Yerel ustalar ve servisler size ulaşsın.">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#2563eb">

<link rel="icon" href="/favicon.ico">

<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* =========================
🔥 PREMIUM GLOBAL
========================= */

body{
background:linear-gradient(180deg,#eef2ff,#f8fbff);
padding-top:env(safe-area-inset-top);
font-family:system-ui,-apple-system,Segoe UI,Roboto;
-webkit-font-smoothing:antialiased;
}

/* WRAPPER */
.page-wrapper{
max-width:900px;
margin:auto;
padding-bottom:240px; /* 🔥 footer + submit alan */
}

/* HEADER FIX */
#globalHeader{
max-width:900px;
margin:auto;
}

/* =========================
🔥 TITLE PRO
========================= */

.page-title{
font-size:26px;
font-weight:900;
text-align:center;
margin:20px 0 10px;
background:linear-gradient(135deg,#2563eb,#4f46e5);

/* ✅ STANDART */
background-clip:text;

/* ✅ SAFARI / IOS */
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;

/* fallback */
color:transparent;
}

/* =========================
🔥 INFO BOX
========================= */

.info-box{
background:linear-gradient(135deg,#eef4ff,#f4f7ff);
border-left:4px solid #2563eb;
padding:18px;
border-radius:16px;
margin:10px 16px 20px;
font-size:14px;
line-height:1.6;
box-shadow:0 12px 30px rgba(0,0,0,.06);
}

/* =========================
🔥 FORM AREA
========================= */

.form-area{
padding:0 12px;
display:flex;
flex-direction:column;
gap:18px;
}

/* CARD */
.form-group{
background:white;
border-radius:18px;
padding:16px;
box-shadow:0 10px 30px rgba(0,0,0,.06);
transition:.2s;
}

.form-group:focus-within{
transform:translateY(-2px);
box-shadow:0 15px 35px rgba(37,99,235,.15);
}

/* INPUT */
.form-control{
width:100%;
padding:14px;
border-radius:12px;
border:1px solid #e2e8f0;
font-size:14px;
background:#f9fafb;
transition:.2s;
margin-top:8px;
}

.form-control:focus{
border-color:#2563eb;
background:white;
box-shadow:0 0 0 3px rgba(37,99,235,.12);
outline:none;
}

/* TEXTAREA */
textarea.form-control{
min-height:120px;
resize:vertical;
}

/* FILE INFO */
.file-info{
font-size:12px;
color:#e11d48;
padding-left:4px;
}

/* =========================
🔥 SUBMIT BAR (APP STYLE)
========================= */

.submit-wrap{
position:fixed;
left:0;
right:0;
bottom:calc(90px + env(safe-area-inset-bottom)); /* 🔥 footer üstü */
padding:12px 16px;
z-index:50;
}

.submit-inner{
background:white;
border-radius:20px;
padding:10px;
box-shadow:0 10px 30px rgba(0,0,0,.12);
}

.submit-btn{
width:100%;
background:linear-gradient(135deg,#2563eb,#1d4ed8);
border:none;
color:white;
padding:16px;
border-radius:16px;
font-weight:800;
font-size:15px;
cursor:pointer;
box-shadow:0 10px 25px rgba(37,99,235,.3);
transition:.2s;
}

.submit-btn:active{
transform:scale(.96);
}

/* =========================
🔥 MOBILE UX
========================= */

@media(max-width:600px){
.page-title{font-size:22px;}
.form-control{font-size:15px;}
}

/* =========================
🔥 LOADING
========================= */

.submit-btn.loading{
opacity:.7;
pointer-events:none;
}

</style>

</head>

<body>

<div id="globalHeader"></div>

<div class="page-wrapper">

<main id="mainContent">

<div class="page-title">
📄 ÜCRETSİZ TEKLİF AL
</div>

<div class="info-box">
<strong>Talebinize Uygun Teklifleri Güvenle Alın</strong>
<br><br>
Bahçelievler Forum üzerinden ilettiğiniz talep ilgili hizmet sağlayıcılara aktarılır.
Size en uygun teklifler doğrudan tarafınıza iletilir.
</div>

<form class="form-area" id="offerForm" novalidate>

<div class="form-group">
<label>Hizmet Türü</label>
<select name="service" id="service" class="form-control" required>
<option value="">Seçiniz</option>
<option>Ürün & Eşya Onarımı</option>
<option>Ev & İşyeri Temizliği</option>
<option>Hasta Bakıcı & Bakım</option>
<option>Boya & Tadilat İşlemi</option>
<option>Bilgisayar Bakım & Onarım</option>
<option>Nakliye & Taşımacılık</option>
<option>Özel Ders & Eğitim</option>
<option>Diğer Hizmet</option>
</select>
</div>

<div class="form-group">
<label>Mahalle</label>
<select name="district" id="district" class="form-control" required>
<option value="">Seçiniz</option>
<option>Bahçelievler Mahallesi</option>
<option>Cumhuriyet Mahallesi</option>
<option>Çobançeşme Mahallesi</option>
<option>Fevzi Çakmak Mahallesi</option>
<option>Hürriyet Mahallesi</option>
<option>Kocasinan Merkez Mahallesi</option>
<option>Siyavuşpaşa Mahallesi</option>
<option>Soğanlı Mahallesi</option>
<option>Şirinevler Mahallesi</option>
<option>Yenibosna Merkez Mahallesi</option>
<option>Zafer Mahallesi</option>
</select>
</div>

<div class="form-group">
<label>İş Detayı</label>
<textarea name="desc" id="desc" class="form-control" placeholder="İşin detaylarını yazınız..." required></textarea>
</div>

<div class="form-group">
<label>Görsel</label>
<input type="file" name="image" id="image" class="form-control" accept="image/*">
<div class="file-info">Max 2MB</div>
</div>

<div class="form-group">
<label>Email</label>
<input type="email" name="email" id="email" class="form-control" placeholder="E-posta adresiniz" required>
</div>

</form>

</main>

</div>

<!-- SUBMIT -->
<div class="submit-wrap">
<div class="submit-inner">
<button class="submit-btn" id="submitBtn">
TEKLİF GÖNDER
</button>
</div>
</div>

<script>

const btn = document.getElementById("submitBtn");

btn.addEventListener("click",(e)=>{
e.preventDefault();

const service = document.getElementById("service").value;
const district = document.getElementById("district").value;
const desc = document.getElementById("desc").value.trim();
const email = document.getElementById("email").value.trim();
const file = document.getElementById("image").files[0];

if(!service) return alert("Hizmet seçiniz");
if(!district) return alert("Mahalle seçiniz");
if(desc.length < 10) return alert("Detay giriniz");
if(!email.includes("@")) return alert("Geçerli email giriniz");

if(file && file.size > 2 * 1024 * 1024){
return alert("Max 2MB");
}

btn.classList.add("loading");
btn.innerText="Gönderiliyor...";

setTimeout(()=>{
alert("Talebiniz alındı 🚀");
btn.classList.remove("loading");
btn.innerText="TEKLİF GÖNDER";
document.getElementById("offerForm").reset();
},1200);

});

</script>

<script src="assets/js/core.js" defer></script>
<script src="assets/js/news.js" defer></script>
<script src="assets/js/footerLegal.js" defer></script>

<div id="globalFooter"></div>

</body>
</html>
