<!DOCTYPE html>
<html lang="tr" class="no-js">

<head>

<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Ücretsiz Teklif Al | Bahçelievler Forum</title>

<meta name="description" content="Bahçelievler ilçesinde aradığınız hizmet için ücretsiz teklif alın. Yerel ustalar ve servisler size ulaşsın.">

<meta name="robots" content="index, follow">

<meta name="theme-color" content="#2563eb">

<link rel="icon" href="/favicon.ico">


<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
background:#f3f6fb;
padding-top:env(safe-area-inset-top);
}

.page-wrapper{
max-width:900px;
margin:auto;
padding-bottom:120px;
}

#globalHeader{
max-width:900px;
margin:auto;
}

.page-title{
font-size:22px;
font-weight:800;
text-align:center;
margin:18px 0;
}

.info-box{
background:#e8f0fb;
border-left:4px solid #2563eb;
padding:16px;
border-radius:12px;
margin:10px 16px 18px;
font-size:14px;
line-height:1.5;
}

.form-area{
padding:0 16px;
display:flex;
flex-direction:column;
gap:14px;
}

.form-control{
width:100%;
padding:14px;
border-radius:12px;
border:1px solid #d7dce5;
font-size:14px;
background:white;
}

textarea.form-control{
min-height:110px;
resize:vertical;
}

.file-info{
font-size:12px;
color:#e11d48;
}

.submit-btn{
margin-top:6px;
background:linear-gradient(135deg,#2563eb,#1d4ed8);
border:none;
color:white;
padding:15px;
border-radius:12px;
font-weight:700;
font-size:15px;
cursor:pointer;
}

.submit-btn:active{
transform:scale(.97);
}

</style>

</head>

<body>

<div id="globalHeader"></div>

<div class="page-wrapper">

<main id="mainContent">

<div class="page-title">

📄 ÜCRETSİZ TEKLİF AL

</div>

<div class="info-box">

<strong>Talebinize Uygun Teklifleri Güvenle Alın</strong>

<br><br>

Bahçelievler Forum üzerinden ilettiğiniz talep ilgili hizmet sağlayıcılara aktarılır.

Size en uygun teklifler doğrudan tarafınıza iletilir.

</div>

<form class="form-area">

<select class="form-control" required>

<option value="">Hizmet Türünü Seçiniz (Zorunlu)</option>

<option>Ürün & Eşya Onarımı</option>
<option>Ev & İşyeri Temizliği</option>
<option>Hasta Bakıcı & Bakım</option>
<option>Boya & Tadilat İşlemi</option>
<option>Bilgisayar Bakım & Onarım</option>
<option>Nakliye & Taşımacılık</option>
<option>Özel Ders & Eğitim</option>
<option>Diğer Hizmet</option>

</select>

<select class="form-control" required>

<option value="">Mahalle Seçiniz (Zorunlu)</option>

<option>Bahçelievler Mahallesi</option>
<option>Cumhuriyet Mahallesi</option>
<option>Çobançeşme Mahallesi</option>
<option>Fevzi Çakmak Mahallesi</option>
<option>Hürriyet Mahallesi</option>
<option>Kocasinan Merkez Mahallesi</option>
<option>Siyavuşpaşa Mahallesi</option>
<option>Soğanlı Mahallesi</option>
<option>Şirinevler Mahallesi</option>
<option>Yenibosna Merkez Mahallesi</option>
<option>Zafer Mahallesi</option>

</select>

<div class="file-info">

📷 Talebin değerlendirilmesi için en az bir görsel yüklenmesi önerilir.

</div>

<input type="file" class="form-control">

<textarea class="form-control" placeholder="İşin detaylarını yazınız..." required></textarea>

<input type="email" class="form-control" placeholder="E-posta adresiniz (zorunlu)" required>

<button class="submit-btn">

TEKLİF TALEBİ GÖNDER

</button>

</form>

</main>

</div>

<script src="assets/js/core.js" defer></script>
<script src="assets/js/news.js" defer></script>
<script src="assets/js/footerLegal.js" defer></script>

<div id="globalFooter"></div>

</body>

</html>
