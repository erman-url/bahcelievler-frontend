<form class="form-area" id="offerForm" novalidate>

<div class="form-group">
<label>Hizmet Türü</label>
<select name="service" id="service" class="form-control" required>
<option value="">Seçiniz</option>
<option>Ürün & Eşya Onarımı</option>
<option>Ev & İşyeri Temizliği</option>

<option>Boya & Tadilat İşlemi</option>
<option>Bilgisayar Bakım & Onarım</option>

<option>Diğer Hizmet</option>
</select>
</div>

<option value="">Seçiniz</option>

<option>Fevzi Çakmak Mahallesi</option>

<option>Soğanlı Mahallesi</option>

<script>

const form = document.getElementById("offerForm");
const btn = document.getElementById("submitBtn");

/* =========================
🔥 TOAST FUNCTION
========================= */

function showToast(message,type="info"){

const box = document.getElementById("toastBox");

const toast = document.createElement("div");
toast.className = "toast " + type;
toast.innerText = message;

box.appendChild(toast);

setTimeout(()=>{
toast.remove();
},4000);

}

/* =========================
🔥 EMAIL REGEX (PRO)
========================= */

function isValidEmail(email){
return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

/* =========================
🔥 SUBMIT
========================= */

btn.addEventListener("click",(e)=>{
e.preventDefault();

/* DOUBLE CLICK ENGEL */
if(btn.classList.contains("loading")) return;

/* INPUT */
const service = document.getElementById("service").value;
const district = document.getElementById("district").value;
const desc = document.getElementById("desc").value.trim();
const email = document.getElementById("email").value.trim();
const file = document.getElementById("image").files[0];

/* VALIDATION */
if(!service) return showToast("Lütfen hizmet seçiniz","error");
if(!district) return showToast("Lütfen mahalle seçiniz","error");
if(desc.length < 10) return showToast("Açıklama çok kısa","error");
if(!isValidEmail(email)) return showToast("Geçerli e-posta giriniz","error");

if(file && file.size > 2 * 1024 * 1024){
return showToast("Görsel max 2MB olmalı","error");
}

/* LOADING */
btn.classList.add("loading");
btn.innerText="Gönderiliyor...";
/* FORM DATA */
const formData = new FormData(form);

/* API */
fetch("https://bahcelievler-api.erman-urel.workers.dev/api/teklif-ekle", {
method: "POST",
body: formData,
headers: {
"Accept": "application/json"
}
})
.then(async (res) => {

/* 🔥 STATUS CHECK */
if (!res.ok) {

/* 429 özel yakala (rate limit) */
if (res.status === 429) {
return { ok:false, error:"Çok hızlı işlem yaptınız, lütfen bekleyin." };
}

/* 500 vs */
return { ok:false, error:"Sunucu hatası (" + res.status + ")" };

}

/* 🔥 SAFE JSON PARSE */
let data;

try {
data = await res.json();
} catch {
return { ok:false, error:"Sunucu yanıtı okunamadı" };
}

/* 🔥 RESPONSE VALIDATION */
if (typeof data !== "object" || data === null) {
return { ok:false, error:"Geçersiz sunucu yanıtı" };
}

return data;

})
.then((data) => {

/* SUCCESS */
if (data.ok) {

showToast(
"Talebiniz başarıyla alındı. En kısa sürede sizinle iletişime geçilecektir.",
"success"
);

/* form reset */
form.reset();

/* UX BONUS (scroll top) */
window.scrollTo({ top: 0, behavior: "smooth" });

} else {

/* API ERROR */
showToast(data.error || "Bir hata oluştu", "error");

}

})
.catch((err) => {

/* NETWORK ERROR */
console.error("API ERROR:", err);

showToast("Bağlantı hatası, internetinizi kontrol edin", "error");

})
.finally(() => {

/* BUTTON RESET */
btn.classList.remove("loading");
btn.innerText = "TEKLİF GÖNDER";

});
});
</script>
