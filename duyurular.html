<!DOCTYPE html>

<html lang="tr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Duyurular | Bahçelievler Forum</title>


<!-- CSS -->
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
padding-top: env(safe-area-inset-top);
}

.page-wrapper{
max-width:1000px;
margin:0 auto;
padding-bottom: calc(120px + env(safe-area-inset-bottom));
}

.page-title{
font-size:20px;
font-weight:700;
margin:20px;
}

.duyuru-list{
padding:16px;
display:flex;
flex-direction:column;
gap:14px;
}

.duyuru-card{

background:white;
border-radius:16px;
padding:16px;

box-shadow:0 6px 18px rgba(0,0,0,0.06);

transition:.18s;

}

@media(min-width:900px){

.duyuru-card:hover{
transform:translateY(-2px);
box-shadow:0 10px 26px rgba(0,0,0,0.1);
}

}

.duyuru-title{
font-weight:700;
font-size:15px;
margin-bottom:6px;
}

.duyuru-text{
font-size:13px;
color:#555;
line-height:1.5;
}

.duyuru-meta{

display:flex;
justify-content:space-between;

margin-top:10px;

font-size:11px;

color:#888;

}

.duyuru-badge{

background:#2563eb;

color:white;

padding:3px 8px;

border-radius:999px;

font-size:10px;

}

.empty-box{

text-align:center;

padding:60px 20px;

color:#777;

}

.duyuru-image{

width:100%;
height:160px;

object-fit:cover;

border-radius:12px;

margin-bottom:10px;

}


/* ===============================
PREMIUM HEADER (HİZMET STİLİ)
=============================== */

.premium-header{
margin:16px;
padding:18px;
border-radius:20px;

background:
linear-gradient(135deg,#2b7be4,#0e4fa8),
radial-gradient(circle at top right, rgba(255,255,255,.12), transparent);

box-shadow:
0 12px 30px rgba(0,0,0,.18),
inset 0 1px 0 rgba(255,255,255,.25);

color:#fff;
}

.header-content{
display:flex;
justify-content:space-between;
align-items:center;
}

.header-text .title{
font-size:22px;
font-weight:900;
text-shadow:0 2px 8px rgba(0,0,0,.25);
}

.header-text .sub{
font-size:13px;
opacity:.9;
margin-top:4px;
}

.header-icon{
width:48px;
height:48px;
display:flex;
align-items:center;
justify-content:center;
border-radius:14px;
background:rgba(255,255,255,.2);
font-size:20px;
}

</style>

</head>

<body>

<div id="globalHeader"></div>

<div class="page-wrapper">

<div class="premium-header">

  <div class="header-content">

    <div class="header-text">
      <div class="title">Duyurular</div>
      <div class="sub">Bahçelievler resmi ve önemli gelişmeler</div>
    </div>

    <div class="header-icon">
      <i class="fa-solid fa-bullhorn"></i>
    </div>

  </div>

</div>

<div id="duyuruList" class="duyuru-list">

<div class="empty-box">Duyurular yükleniyor...</div>

</div>

</div>


<script>

/* ===============================
UTIL
=============================== */

function escapeHTML(str){
  if(!str) return "";
  return str.replace(/[&<>"']/g, m => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[m]));
}

function timeAgo(dateString){
  if(!dateString) return "";
  const d = new Date(dateString);
  if(isNaN(d)) return "";
  const diff = Math.floor((Date.now()-d)/1000);

  if(diff < 60) return "Az önce";
  if(diff < 3600) return Math.floor(diff/60)+" dk";
  if(diff < 86400) return Math.floor(diff/3600)+" sa";
  return Math.floor(diff/86400)+" gün";
}

function safeImage(url){
  if(!url) return "";
  if(typeof url !== "string") return "";
  if(url.startsWith("http")) return url;
  return "";
}


async function loadDuyurular(){

  const box = document.getElementById("duyuruList");
  if(!box) return;

  try{

    // 🔥 İKİ API AYNI ANDA
    const [dbRes, bedasRes] = await Promise.all([
      fetch("https://bahcelievler-api.erman-urel.workers.dev/api/duyurular"),
      fetch("https://bahcelievler-api.erman-urel.workers.dev/api/bedas-duyurular")
    ]);

    if(!dbRes.ok || !bedasRes.ok){
      throw "API error";
    }

    const dbData = await dbRes.json();
    const bedasData = await bedasRes.json();

    // 🔥 BİRLEŞTİR
    const data = [...bedasData, ...dbData].sort(
  (a,b) => new Date(b.created_at) - new Date(a.created_at)
);

    if(!Array.isArray(data) || data.length === 0){
      box.innerHTML = `<div class="empty-box">Duyuru yok</div>`;
      return;
    }

    let html = "";

    data.forEach(d=>{

      const img = safeImage(d.image_url);

      html += `
      <div class="duyuru-card">

        ${img ? `<img src="${img}" class="duyuru-image" alt="${escapeHTML(d.title)}">` : ""}

        <div class="duyuru-title">
          ${d.source === "bedas" ? "⚡ " : ""}
          ${escapeHTML(d.title)}
        </div>

        <div class="duyuru-text">
          ${escapeHTML(d.content)}
        </div>

        <div class="duyuru-meta">
          <span>${timeAgo(d.created_at)}</span>
          ${d.priority === "onemli" ? `<span class="duyuru-badge">ÖNEMLİ</span>` : ""}
        </div>

      </div>`;
    });

    box.innerHTML = html;

  }catch(e){

    console.log("DUYURU ERROR:", e);

    box.innerHTML = `
      <div class="empty-box">
        Duyurular yüklenemedi
      </div>
    `;
  }

}

document.addEventListener("DOMContentLoaded", loadDuyurular);



</script>


<script src="assets/js/core.js" defer></script>
<script src="assets/js/footerLegal.js" defer></script>

<div id="globalFooter"></div>

</body>
</html>
