<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Puzzle Pro Infinite</title>

<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="description" content="Sonsuz seviyeli mobil puzzle oyunu.">
<meta name="keywords" content="puzzle, mobil oyun, infinite game">

<style>

/* RESET */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

html,body{
  margin:0;height:100%;overflow:hidden;
  background:#0f172a;font-family:system-ui;
  touch-action:none;overscroll-behavior:none;
}

/* LAYOUT */
.game{position:fixed;inset:0;display:flex;flex-direction:column;}

/* TOPBAR */
.topbar{
  display:flex;justify-content:space-between;align-items:center;
  padding:env(safe-area-inset-top) 16px 10px;
  background:rgba(15,23,42,0.95);
  color:#fff;font-weight:600;
}

.back-btn{
  background:rgba(255,255,255,0.1);
  border:none;color:#fff;padding:8px 12px;border-radius:10px;
}

/* GRID */
.grid{
  flex:1;margin:10px;padding:10px;
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:4px;
  background:#1e293b;border-radius:20px;
}

.cell{
  aspect-ratio:1;
  background:#334155;
  border-radius:10px;
  position:relative;
}

.cell.filled::before{
  content:"";
  position:absolute;inset:0;
  background:linear-gradient(270deg,#2b5ed7,#7a3fd1,#2b5ed7);
  background-size:300% 300%;
  animation:flow 2s linear infinite;
}

.node{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:70%;height:70%;
  background:#000;color:#fff;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
}

/* BUTTON */
.controls{padding:10px;}
button{
  width:100%;padding:14px;border:none;
  border-radius:20px;background:#1d4ed8;color:#fff;
}

/* ANIM */
@keyframes flow{
  0%{background-position:0%}
  100%{background-position:100%}
}

</style>
</head>

<body>

<div class="game">

<div class="topbar">
  <button class="back-btn" onclick="goBack()">← Geri</button>
  <div>Puzzle Infinite</div>
  <div></div>
</div>

<div id="grid" class="grid"></div>

<div class="controls">
  <button onclick="newLevel()">Yeni Level</button>
</div>

</div>

<script>

/* STATE */
const size = 7;
const grid = document.getElementById("grid");

let nodes = {};
let path=[];
let isDrawing=false;
let currentNumber=1;

let rafPending=false;
let lastEvent=null;

/* =========================
LEVEL GENERATOR
========================= */

function generateLevel(){

  nodes={};

  let x=Math.floor(Math.random()*size);
  let y=Math.floor(Math.random()*size);

  let steps=10 + Math.floor(Math.random()*10);

  nodes[1]=[y,x];

  for(let i=2;i<=steps;i++){

    let dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    let valid=dirs.filter(d=>{
      let nx=x+d[0], ny=y+d[1];
      return nx>=0 && nx<size && ny>=0 && ny<size &&
        !Object.values(nodes).some(([yy,xx])=>yy===ny && xx===nx);
    });

    if(valid.length===0) break;

    let [dx,dy]=valid[Math.floor(Math.random()*valid.length)];

    x+=dx; y+=dy;

    nodes[i]=[y,x];
  }

}

/* INIT */
function init(){

  grid.innerHTML="";
  path=[];
  currentNumber=1;

  for(let y=0;y<size;y++){
    for(let x=0;x<size;x++){

      const cell=document.createElement("div");
      cell.className="cell";
      cell.dataset.x=x;
      cell.dataset.y=y;

      for(let key in nodes){
        let [ny,nx]=nodes[key];
        if(ny==y && nx==x){
          const n=document.createElement("div");
          n.className="node";
          n.innerText=key;
          cell.appendChild(n);
        }
      }

      grid.appendChild(cell);
    }
  }
}

/* =========================
POINTER SYSTEM
========================= */

grid.addEventListener("pointerdown",start,{passive:false});
grid.addEventListener("pointermove",move,{passive:false});
document.addEventListener("pointerup",()=>isDrawing=false);

function start(e){

  e.preventDefault();

  const cell=e.target.closest(".cell");
  if(!cell) return;

  const x=+cell.dataset.x;
  const y=+cell.dataset.y;

  if(nodes[1][0]!==y || nodes[1][1]!==x) return;

  grid.setPointerCapture(e.pointerId);

  isDrawing=true;
  path=[];
  currentNumber=1;

  fill(cell,x,y);
}

function move(e){

  if(!isDrawing) return;

  lastEvent=e;

  if(!rafPending){
    rafPending=true;
    requestAnimationFrame(processMove);
  }
}

function processMove(){

  rafPending=false;

  const e=lastEvent;

  const el=document.elementFromPoint(e.clientX,e.clientY);
  const cell=el?.closest(".cell");
  if(!cell) return;

  const x=+cell.dataset.x;
  const y=+cell.dataset.y;

  if(path.some(p=>p.x===x && p.y===y)) return;

  if(path.length>0){
    const last=path[path.length-1];
    if(Math.abs(last.x-x)+Math.abs(last.y-y)!==1) return;
  }

  let next=currentNumber+1;

  if(nodes[next]){
    let [ny,nx]=nodes[next];
    if(ny===y && nx===x){
      currentNumber++;
    }
  }

  for(let key in nodes){
    let [ny,nx]=nodes[key];
    if(ny===y && nx===x && key!=next){
      return;
    }
  }

  fill(cell,x,y);

  if(currentNumber === Object.keys(nodes).length){
    setTimeout(()=>{
      alert("🎉 Level Tamamlandı");
      newLevel();
    },200);
  }
}

/* FILL */
function fill(cell,x,y){
  cell.classList.add("filled");
  path.push({x,y});
}

/* =========================
LEVEL CONTROL
========================= */

function newLevel(){
  generateLevel();
  init();
}

/* =========================
RESET
========================= */

function resetGame(){
  path=[];
  currentNumber=1;
  document.querySelectorAll(".cell").forEach(c=>c.classList.remove("filled"));
}

/* =========================
BACK FIX
========================= */

function goBack(){
  if(history.length > 1){
    history.back();
  }else{
    location.href="/";
  }
}

/* START */
newLevel();

</script>

</body>
</html>
