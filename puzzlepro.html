<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Puzzle Pro</title>

<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>

/* =========================
GLOBAL RESET
========================= */
html,body{
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#0f172a;
  font-family:system-ui;
}

/* =========================
APP LAYOUT
========================= */
.game{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
}

/* =========================
TOP BAR
========================= */
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:14px 16px;
  background:rgba(15,23,42,0.95);
  color:#fff;
  font-weight:600;
  backdrop-filter:blur(10px);
  box-shadow:0 4px 20px rgba(0,0,0,0.4);
}

.back-btn{
  background:rgba(255,255,255,0.1);
  border:none;
  color:#fff;
  padding:8px 14px;
  border-radius:10px;
  font-size:14px;
}

/* =========================
GRID
========================= */
.grid{
  flex:1;
  margin:10px;
  padding:10px;
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:3px;
  background:#1e293b;
  border-radius:20px;
}

/* CELL */
.cell{
  aspect-ratio:1;
  background:#334155;
  border-radius:8px;
  position:relative;
  overflow:hidden;
}

/* PATH */
.cell.filled::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(270deg,#2b5ed7,#7a3fd1,#2b5ed7);
  background-size:300% 300%;
  animation:flow 2s linear infinite;
}

/* NODE */
.node{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:70%;
  height:70%;
  background:#000;
  color:#fff;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  z-index:2;
}

/* CONTROLS */
.controls{
  display:flex;
  gap:10px;
  padding:10px;
}

button{
  flex:1;
  padding:14px;
  border:none;
  border-radius:20px;
  background:#1d4ed8;
  color:#fff;
  font-weight:600;
}

/* ANIMATION */
@keyframes flow{
  0%{background-position:0%}
  100%{background-position:100%}
}

</style>
</head>

<body>

<div class="game">

  <div class="topbar">
    <button class="back-btn" onclick="goBack()">← Geri</button>
    <div>Puzzle Pro</div>
    <div></div>
  </div>

  <div id="grid" class="grid"></div>

  <div class="controls">
    <button onclick="resetGame()">Sıfırla</button>
  </div>

</div>

<script>

/* =========================
STATE
========================= */

const size = 7;
const grid = document.getElementById("grid");

let path = [];
let isDrawing = false;
let currentNumber = 1;

/* NODE MAP */
const nodes = {
  1:[0,0],
  2:[6,6],
  3:[1,5],
  4:[1,1],
  5:[3,3],
  6:[3,2],
  7:[5,1],
  8:[5,4],
  9:[3,4],
  10:[3,3]
};

/* =========================
INIT
========================= */

function init(){

  grid.innerHTML="";
  path=[];
  currentNumber=1;

  for(let y=0;y<size;y++){
    for(let x=0;x<size;x++){

      const cell=document.createElement("div");
      cell.className="cell";
      cell.dataset.x=x;
      cell.dataset.y=y;

      for(let key in nodes){
        let [ny,nx]=nodes[key];
        if(ny==y && nx==x){
          const n=document.createElement("div");
          n.className="node";
          n.innerText=key;
          cell.appendChild(n);
        }
      }

      grid.appendChild(cell);
    }
  }
}

init();

/* =========================
TOUCH SYSTEM
========================= */

grid.addEventListener("pointerdown",start);
grid.addEventListener("pointermove",move);
document.addEventListener("pointerup",()=>isDrawing=false);

function start(e){

  const cell=e.target.closest(".cell");
  if(!cell) return;

  const x=+cell.dataset.x;
  const y=+cell.dataset.y;

  if(nodes[1][0]!==y || nodes[1][1]!==x) return;

  navigator.vibrate?.(10);

  isDrawing=true;
  path=[];
  currentNumber=1;

  fill(cell,x,y);
}

function move(e){

  if(!isDrawing) return;

  const el=document.elementFromPoint(e.clientX,e.clientY);
  const cell=el?.closest(".cell");
  if(!cell) return;

  const x=+cell.dataset.x;
  const y=+cell.dataset.y;

  if(path.some(p=>p.x===x && p.y===y)) return;

  if(path.length>0){
    const last=path[path.length-1];
    if(Math.abs(last.x-x)+Math.abs(last.y-y)!==1) return;
  }

  let next=currentNumber+1;

  if(nodes[next]){
    let [ny,nx]=nodes[next];
    if(ny===y && nx===x){
      currentNumber++;
      navigator.vibrate?.(15);
    }
  }

  for(let key in nodes){
    let [ny,nx]=nodes[key];
    if(ny===y && nx===x && key!=next){
      return;
    }
  }

  fill(cell,x,y);

  if(currentNumber===Object.keys(nodes).length && path.length===size*size){
    navigator.vibrate?.([30,50,30]);
    setTimeout(()=>alert("🎉 Tebrikler!"),200);
  }
}

/* =========================
FILL
========================= */

function fill(cell,x,y){
  cell.classList.add("filled");
  path.push({x,y});
}

/* =========================
RESET
========================= */

function resetGame(){
  document.querySelectorAll(".cell").forEach(c=>{
    c.classList.remove("filled");
  });
  path=[];
  currentNumber=1;
}

/* =========================
NAV
========================= */

function goBack(){
  window.history.back();
}

</script>

</body>
</html>
