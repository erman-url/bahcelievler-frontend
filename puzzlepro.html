<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flow Puzzle </title>

<style>
:root{
  --bg:#f0f2f5;
  --panel:#b9c8e8;
  --cell:#e3ebfb;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);
  font-family:Arial,Helvetica,sans-serif;
  display:flex;justify-content:center;
}
.app{width:95vw;max-width:430px}

.header{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 10px;font-weight:700
}
.badge{background:#fff;padding:6px 10px;border-radius:14px}

.wrapper{
  background:var(--panel);padding:12px;border-radius:28px;
  box-shadow:0 10px 30px rgba(0,0,0,.08) inset;
}
.grid{display:grid;gap:5px}
.cell{
  aspect-ratio:1;background:var(--cell);
  border-radius:12px;position:relative;overflow:hidden;
  touch-action:none;
}

/* PATH BASE (smooth-ish) */
.cell.filled::before{
  content:"";position:absolute;inset:0;border-radius:12px;
  background-size:300% 300%;
  animation:flow 1.8s linear infinite;
  opacity:.95;
}

/* COLORS */
.cell[data-color="1"]::before{background:linear-gradient(270deg,#ff5f6d,#ffc371,#ff5f6d)}
.cell[data-color="2"]::before{background:linear-gradient(270deg,#36d1dc,#5b86e5,#36d1dc)}
.cell[data-color="3"]::before{background:linear-gradient(270deg,#c471f5,#fa71cd,#c471f5)}
.cell[data-color="4"]::before{background:linear-gradient(270deg,#11998e,#38ef7d,#11998e)}
.cell[data-color="5"]::before{background:linear-gradient(270deg,#f7971e,#ffd200,#f7971e)}
.cell[data-color="6"]::before{background:linear-gradient(270deg,#00c6ff,#0072ff,#00c6ff)}
.cell[data-color="7"]::before{background:linear-gradient(270deg,#ff9966,#ff5e62,#ff9966)}
.cell[data-color="8"]::before{background:linear-gradient(270deg,#7f7fd5,#86a8e7,#7f7fd5)}

.node{
  position:absolute;top:50%;left:50%;
  transform:translate(-50%,-50%);
  width:68%;height:68%;
  background:#000;color:#fff;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;z-index:2;
}

.controls{display:flex;gap:10px;margin-top:14px}
button{
  flex:1;padding:14px;border:0;border-radius:22px;
  background:#e1e1e1;font-weight:600
}

.modal{
  position:fixed;inset:0;background:rgba(0,0,0,.6);
  display:flex;align-items:center;justify-content:center;z-index:10
}
.modal-box{
  background:#fff;padding:24px;border-radius:18px;text-align:center;
  width:85%;max-width:320px
}
.hidden{display:none}

@keyframes flow{0%{background-position:0%}100%{background-position:100%}}
</style>
</head>

<body>
<div class="app">
  <div class="header">
    <div>LEVEL <span id="lv">1</span></div>
    <div class="badge">⏱ <span id="time">90</span>s</div>
  </div>

  <div class="wrapper">
    <div id="grid" class="grid"></div>
  </div>

  <div class="controls">
    <button onclick="resetBoard()">Sıfırla</button>
    <button onclick="alert('İpucu: Önce uzun hatları çöz')">İpucu</button>
  </div>
</div>

<div id="modal" class="modal hidden">
  <div class="modal-box">
    <h2 id="modalText"></h2>
    <p id="scoreText"></p>
    <button onclick="nextLevel()">Devam</button>
  </div>
</div>

<script>

/* =========================
CORE STATE
========================= */

const size = 7;
const grid = document.getElementById("grid");

let cells = [];
let path = [];
let isDrawing = false;
let currentNumber = 1;

/* NODE LAYOUT */
const nodes = {
  1:[0,0],
  2:[6,6],
  3:[1,5],
  4:[1,1],
  5:[3,3],
  6:[3,2],
  7:[5,1],
  8:[5,4],
  9:[3,4],
  10:[3,3]
};

/* =========================
GRID CREATE
========================= */

function initGrid(){

  grid.innerHTML="";
  cells=[];
  path=[];
  currentNumber=1;

  grid.style.gridTemplateColumns=`repeat(${size},1fr)`;

  for(let y=0;y<size;y++){
    for(let x=0;x<size;x++){

      const div=document.createElement("div");
      div.className="cell";
      div.dataset.x=x;
      div.dataset.y=y;

      /* NODE */
      for(let key in nodes){
        let [ny,nx]=nodes[key];
        if(ny==y && nx==x){
          const n=document.createElement("div");
          n.className="node";
          n.innerText=key;
          div.appendChild(n);
        }
      }

      grid.appendChild(div);
      cells.push(div);
    }
  }
}

initGrid();

/* =========================
TOUCH ENGINE (CRITICAL FIX)
========================= */

grid.addEventListener("pointerdown",startDraw);
grid.addEventListener("pointermove",moveDraw);
document.addEventListener("pointerup",endDraw);

function startDraw(e){

  const cell = e.target.closest(".cell");
  if(!cell) return;

  const x = +cell.dataset.x;
  const y = +cell.dataset.y;

  /* SADECE 1'DEN BAŞLA */
  if(nodes[1][0] !== y || nodes[1][1] !== x) return;

  isDrawing = true;
  path = [];
  currentNumber = 1;

  fillCell(cell,x,y);
}

function moveDraw(e){
  if(!isDrawing) return;

  const el = document.elementFromPoint(e.clientX, e.clientY);
  const cell = el?.closest(".cell");
  if(!cell) return;

  processCell(cell);
}

function endDraw(){
  isDrawing=false;
}

/* =========================
GAME LOGIC
========================= */

function processCell(cell){

  const x = +cell.dataset.x;
  const y = +cell.dataset.y;

  /* tekrar geçemez */
  if(path.some(p=>p.x===x && p.y===y)) return;

  /* adjacency */
  if(path.length>0){
    const last = path[path.length-1];
    const dx = Math.abs(last.x-x);
    const dy = Math.abs(last.y-y);
    if(dx+dy!==1) return;
  }

  /* doğru sayı mı */
  const nextNumber = currentNumber + 1;

  if(nodes[nextNumber]){
    const [ny,nx] = nodes[nextNumber];

    if(ny===y && nx===x){
      currentNumber++;
    }
  }

  /* yanlış node’a girme */
  for(let key in nodes){
    const [ny,nx]=nodes[key];
    if(ny===y && nx===x && key != nextNumber){
      return;
    }
  }

  fillCell(cell,x,y);

  checkWin();
}

/* =========================
FILL
========================= */

function fillCell(cell,x,y){
  cell.classList.add("filled");
  path.push({x,y});
}

/* =========================
WIN CONTROL
========================= */

function checkWin(){

  if(currentNumber !== Object.keys(nodes).length) return;

  if(path.length !== size*size) return;

  alert("🎉 Doğru çözüm!");
}

/* =========================
RESET
========================= */

function resetGame(){
  document.querySelectorAll(".cell").forEach(c=>{
    c.classList.remove("filled");
  });

  path=[];
  currentNumber=1;
}

</script>
</body>
</html>
