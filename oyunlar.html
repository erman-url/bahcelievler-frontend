<!DOCTYPE html>
<html lang="tr" class="no-js">
<head>

    
<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Oyunlar | Bahçelievler Forum</title>

<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* SAFE AREA */
body{
padding-top:env(safe-area-inset-top);
}

/* PAGE */
.page-wrapper{
max-width:900px;
margin:0 auto;
padding-bottom:calc(120px + env(safe-area-inset-bottom));
}

/* TITLE */
.page-title{
font-size:22px;
font-weight:700;
padding:20px 16px 10px;
}

/* GRID */
.game-grid{
display:grid;
grid-template-columns:1fr;
gap:14px;
padding:16px;
}

/* CARD */
.game-card{
background:#fff;
border-radius:16px;
padding:20px;
box-shadow:0 8px 18px rgba(0,0,0,0.05);
display:flex;
align-items:center;
justify-content:space-between;
cursor:pointer;
transition:.2s;
}

.game-card:hover{
transform:translateY(-3px);
}

/* ICON */
.game-icon{
font-size:26px;
color:#2563eb;
}

.game-info{
flex:1;
margin-left:14px;
}

.game-title{
font-weight:700;
font-size:16px;
}

.game-desc{
font-size:13px;
color:#666;
margin-top:4px;
}

.arrow{
font-size:18px;
color:#999;
}

</style>
</head>

<body>

<div id="globalHeader"></div>

<div class="page-wrapper">

<div class="page-title">🎮 Oyunlar</div>

<div class="game-grid">

<div class="game-card" onclick="location.href='online-oyunlar.html'">
<div class="game-icon">
<i class="fa-solid fa-gamepad"></i>
</div>

<div class="game-info">
<div class="game-title">Online Oyunlar</div>
<div class="game-desc">Tarayıcıdan oynanan hızlı oyunlar</div>
</div>

<div class="arrow">
<i class="fa-solid fa-chevron-right"></i>
</div>
</div>

<div class="game-card" onclick="location.href='odullu-oyun.html'">
<div class="game-icon">
<i class="fa-solid fa-trophy"></i>
</div>

<div class="game-info">
<div class="game-title">Ödüllü Oyun</div>
<div class="game-desc">Görevi çöz ödülü kazan</div>
</div>

<div class="arrow">
<i class="fa-solid fa-chevron-right"></i>
</div>
</div>

</div>

</div>

<script src="assets/js/core.js" defer></script>
<script src="assets/js/dashboard.js" defer></script>
<script src="assets/js/news.js" defer></script>
<script src="assets/js/countdown.js" defer></script>
<script src="assets/js/footerLegal.js" defer></script>

<div id="globalFooter"></div>


</body>
</html>
