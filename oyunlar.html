<!DOCTYPE html>
<html lang="tr" class="no-js">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mühürlü Geçit | Bahçelievler Forum</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">

<style>

/* SAFE AREA */
body{
  padding-top: env(safe-area-inset-top);
}

/* Oyun alanı */
.game-wrapper{
  position:relative;
  height:calc(100vh - 90px);
  padding-bottom: env(safe-area-inset-bottom);
  overflow:hidden;
}

/* Scene */
.scene{
  width:100%;
  height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  background:#070a12;
  font-family:"Cinzel",serif;
}

/* Door */
.door{
  position:relative;
  max-width:90vw;
  transition:transform .2s ease;
}

.door img{
  width:100%;
  border-radius:20px;
  display:block;
  box-shadow:
    0 0 120px rgba(0,0,0,.9),
    0 0 200px rgba(0,120,255,.15);
}

/* LOCK */
.lock{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:320px;
  max-width:65%;
}

.lock img{width:100%;display:block;}

.code-ring{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:150px;
  height:150px;
  border-radius:50%;
  background:radial-gradient(circle,#000 0%,#111 60%,#000 100%);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#e8c36a;
  font-size:30px;
  letter-spacing:12px;
  text-shadow:0 0 15px rgba(255,200,100,.6);
}

/* Metal shine */
.lock::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:50%;
  background:radial-gradient(circle at var(--x,50%) var(--y,50%),
    rgba(255,230,150,.6),
    transparent 60%);
  opacity:0;
  transition:.2s;
}
.lock:hover::after{opacity:.6;}

/* Mobile Pad */
.mobile-pad{
  position:absolute;
  bottom:0;
  left:0;
  width:100%;
  background:#0c0f18;
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  padding:20px;
  transform:translateY(100%);
  transition:.3s ease;
  border-top-left-radius:20px;
  border-top-right-radius:20px;
}
.mobile-pad.open{transform:translateY(0);}
.mobile-pad div{
  background:#111;
  color:#e8c36a;
  font-size:22px;
  padding:15px;
  text-align:center;
  border-radius:8px;
}

canvas{
  position:absolute;
  inset:0;
  pointer-events:none;
}

</style>
</head>

<body>

<div id="globalHeader"></div>


<div class="game-wrapper">
<div class="scene">

<canvas id="orbs"></canvas>

<div class="door" id="door">
  <img src="assets/images/door.jpg">
  <div class="lock" id="lock">
    <img src="assets/images/lock.png">
    <div class="code-ring" id="display">----</div>
  </div>
</div>

<div class="mobile-pad" id="mobilePad">
  <div>1</div><div>2</div><div>3</div>
  <div>4</div><div>5</div><div>6</div>
  <div>7</div><div>8</div><div>9</div>
  <div>C</div><div>0</div><div>OK</div>
</div>

</div>
</div>


<script src="assets/js/layout.js"></script>
<script src="assets/js/footerNav.js"></script>
<script src="assets/js/footerLegal.js"></script>
<script src="assets/js/menu.js"></script>

<script>

/* AUDIO */
let mainSound=new Audio("assets/audio/main_sound.mp3");
let basSound=new Audio("assets/audio/bas_sound.mp3");
let wrongSound=new Audio("assets/audio/wrongsound.mp3");

mainSound.loop=true;
mainSound.volume=0.6;

let audioStarted=false;
function initAudio(){
  if(audioStarted) return;
  mainSound.play();
  audioStarted=true;
}
document.addEventListener("click",initAudio);
document.addEventListener("touchstart",initAudio);

/* CODE SYSTEM */
let input="";
const correctCode="4729";
const display=document.getElementById("display");

function update(){ display.textContent=input.padEnd(4,"-"); }

function check(){
  wrongSound.currentTime=0;
  wrongSound.play();
  display.style.color="#ff6a6a";
  setTimeout(()=>{
    display.style.color="#e8c36a";
    input="";
    update();
  },800);
}

/* MOBILE PAD */
document.querySelectorAll("#mobilePad div").forEach(btn=>{
  btn.addEventListener("click",()=>{
    let val=btn.textContent;
    if(val==="C"){input="";}
    else if(val==="OK"){check();return;}
    else if(input.length<4){
      basSound.currentTime=0;
      basSound.play();
      input+=val;
    }
    update();
  });
});

/* Metal shine follow */
const lock=document.getElementById("lock");
lock.addEventListener("mousemove",(e)=>{
  const rect=lock.getBoundingClientRect();
  const x=((e.clientX-rect.left)/rect.width)*100;
  const y=((e.clientY-rect.top)/rect.height)*100;
  lock.style.setProperty("--x",x+"%");
  lock.style.setProperty("--y",y+"%");
});

/* Door push effect */
setInterval(()=>{
  if(Math.random()>0.6){
    const door=document.getElementById("door");
    door.style.transform="translateX(-4px)";
    setTimeout(()=>{
      door.style.transform="translateX(4px)";
      setTimeout(()=>{door.style.transform="translateX(0)";},120);
    },120);
  }
},5000);

/* Floating orbs */
const canvas=document.getElementById("orbs");
const ctx=canvas.getContext("2d");
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;

let particles=[];
for(let i=0;i<30;i++){
  particles.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    r:Math.random()*6+2,
    dx:(Math.random()-.5)*0.3,
    dy:(Math.random()-.5)*0.3
  });
}

function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  particles.forEach(p=>{
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fillStyle="rgba(255,220,120,.15)";
    ctx.fill();
    p.x+=p.dx;
    p.y+=p.dy;
    if(p.x<0||p.x>canvas.width)p.dx*=-1;
    if(p.y<0||p.y>canvas.height)p.dy*=-1;
  });
  requestAnimationFrame(animate);
}
animate();

</script>

<script src="assets/js/layout.js"></script>
<script src="assets/js/menu.js"></script>
<script src="assets/js/core.js" defer></script>
<script src="assets/js/footerNav.js"></script>

<div id="globalFooter"></div>

</body>
</html>
