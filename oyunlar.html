<style>

/* ======================
BASE
====================== */
body{
  padding-top:env(safe-area-inset-top);
  background:#f3f6fb;
}

.page-wrapper{
  max-width:1000px;
  margin:0 auto;
  padding-bottom:calc(120px + env(safe-area-inset-bottom));
}

/* ======================
HERO (PREMIUM)
====================== */
.games-hero{
  padding:20px 16px 10px;
}

.games-title{
  font-size:24px;
  font-weight:800;
}

.games-sub{
  font-size:13px;
  color:#6b7280;
  margin-top:4px;
}

/* ======================
GRID
====================== */
.game-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
  padding:16px;
}

/* MOBILE */
@media(max-width:600px){
  .game-grid{
    grid-template-columns:1fr;
  }
}

/* ======================
CARD (PRO)
====================== */
.game-card{
  position:relative;
  background:linear-gradient(145deg,#ffffff,#eef2ff);
  border-radius:20px;
  padding:18px;

  display:flex;
  flex-direction:column;
  gap:10px;

  cursor:pointer;

  border:1px solid rgba(0,0,0,0.04);

  box-shadow:
    0 10px 24px rgba(0,0,0,0.06),
    inset 0 1px 0 rgba(255,255,255,0.7);

  transition:.25s ease;
}

.game-card:hover{
  transform:translateY(-4px);
  box-shadow:0 16px 34px rgba(0,0,0,0.12);
}

.game-card:active{
  transform:scale(.97);
}

/* ======================
BADGE
====================== */
.game-badge{
  position:absolute;
  top:10px;
  right:10px;

  font-size:11px;
  font-weight:700;

  padding:4px 8px;
  border-radius:8px;

  background:#2563eb;
  color:#fff;
}

/* ======================
ICON
====================== */
.game-icon{
  width:46px;
  height:46px;

  border-radius:14px;

  display:flex;
  align-items:center;
  justify-content:center;

  background:linear-gradient(135deg,#2563eb,#1d4ed8);
  color:#fff;

  font-size:20px;

  box-shadow:0 6px 16px rgba(37,99,235,0.35);
}

/* ======================
TEXT
====================== */
.game-title{
  font-size:15px;
  font-weight:700;
}

.game-desc{
  font-size:12px;
  color:#6b7280;
}

/* ======================
FOOTER ARROW
====================== */
.game-footer{
  margin-top:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;

  font-size:12px;
  color:#64748b;
}

.game-footer i{
  font-size:14px;
}

/* ======================
HEADER FIX
====================== */
#globalHeader{
  max-width:1000px;
  margin:0 auto;
}
