<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>Bubble Pop Oyunu | Bahçelievler Forum</title>

<meta name="description" content="Bubble Pop oyununu hemen oyna. Baloncukları patlat, süreye karşı yarış ve skor yap. Bahçelievler Forum ücretsiz mobil oyun.">
<meta name="keywords" content="bubble pop oyunu, balon patlatma oyunu, mobil oyun, online oyun, bahçelievler oyun">

<link rel="canonical" href="https://bahcelievlerforum.com/bubble-pop.html">

<meta property="og:title" content="Bubble Pop Oyunu">
<meta property="og:description" content="Baloncukları patlat, süreye karşı yarış!">
<meta property="og:image" content="https://bahcelievlerforum.com/assets/images/oyunlar-cover.jpg">
<meta property="og:type" content="game">

<meta name="robots" content="index,follow">
<meta name="theme-color" content="#1abc9c">

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

html,body{
width:100%;
height:100%;
overflow:hidden;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
background:#1abc9c;
padding-top:env(safe-area-inset-top);
}

/* CANVAS */
canvas{
position:absolute;
top:0;
left:0;
z-index:1;
}

/* TOP UI */
#ui{
position:fixed;
top:0;
left:0;
width:100%;
height:60px;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 15px;
color:#fff;
background:linear-gradient(to bottom,rgba(0,0,0,0.35),transparent);
z-index:10;
font-weight:600;
}

/* OVERLAY */
.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:linear-gradient(#1abc9c,#16a085);
z-index:9999;
text-align:center;
}

/* TITLE */
.title{
font-size:48px;
font-weight:900;
color:#fff;
letter-spacing:2px;
text-shadow:
0 5px 15px rgba(0,0,0,0.3),
0 0 10px rgba(255,255,255,0.6);
margin-bottom:10px;
}

/* BUTTON */
.btn{
padding:14px 30px;
font-size:18px;
border:none;
border-radius:30px;
background:#fff;
color:#16a085;
font-weight:bold;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
cursor:pointer;
transition:0.2s;
}
.btn:active{transform:scale(0.95);}

#gameOver{display:none;}

.stat{
color:#fff;
font-size:20px;
margin:10px 0;
}
</style>
</head>

<body>

<div id="ui">
<div onclick="goBack()">←</div>
<div id="score">0</div>
<div id="lives">❤️❤️❤️❤️❤️</div>
<div id="time">300s</div>
</div>

<div id="startScreen" class="overlay">
<div class="title">Bubble Pop</div>
<div style="color:white;opacity:.8;margin-bottom:20px">
Bahçelievler Forum
</div>
<button class="btn" onclick="startGame()">OYNA</button>
</div>

<div id="gameOver" class="overlay">
<div class="title" id="endTitle">Bitti!</div>
<div class="stat" id="finalScore"></div>
<button class="btn" onclick="restartGame()">Tekrar Oyna</button>
</div>

<canvas id="game"></canvas>


<script>


function startGame(){
  let start=document.getElementById("startScreen");
  let over=document.getElementById("gameOver");

  if(start) start.style.display="none";
  if(over) over.style.display="none";

  score=0;
  lives=5;
  time=300;
  balloons=[];
  running=true;

  updateUI();
  startTimer();
  loop();
}

/* =========================
STATE
========================= */

const size = 7;
const grid = document.getElementById("grid");

let path = [];
let isDrawing = false;
let currentNumber = 1;
let score = 0;
let combo = 0;

/* NODE MAP (DAHA ZOR LAYOUT) */
const nodes = {
  1:[0,0],
  2:[6,6],
  3:[0,6],
  4:[6,0],
  5:[3,3],
  6:[2,4],
  7:[4,2],
  8:[1,5],
  9:[5,1],
  10:[3,5]
};

/* =========================
SOUND SYSTEM (ULTRA LIGHT)
========================= */

const AudioCtx = window.AudioContext || window.webkitAudioContext;
const audioCtx = new AudioCtx();

function play(freq, duration=0.1){
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();

  osc.frequency.value = freq;
  osc.type = "sine";

  osc.connect(gain);
  gain.connect(audioCtx.destination);

  gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);

  osc.start();
  osc.stop(audioCtx.currentTime + duration);
}

/* =========================
INIT
========================= */

function init(){
  grid.innerHTML="";
  path=[];
  currentNumber=1;
  score=0;
  combo=0;

  for(let y=0;y<size;y++){
    for(let x=0;x<size;x++){

      const cell=document.createElement("div");
      cell.className="cell";
      cell.dataset.x=x;
      cell.dataset.y=y;

      for(let key in nodes){
        let [ny,nx]=nodes[key];
        if(ny==y && nx==x){
          const n=document.createElement("div");
          n.className="node";
          n.innerText=key;
          cell.appendChild(n);
        }
      }

      grid.appendChild(cell);
    }
  }
}

init();

/* =========================
TOUCH SYSTEM (IMPROVED)
========================= */

grid.addEventListener("pointerdown",start);
grid.addEventListener("pointermove",move);
document.addEventListener("pointerup",()=>isDrawing=false);

function start(e){

  const cell=e.target.closest(".cell");
  if(!cell) return;

  const x=+cell.dataset.x;
  const y=+cell.dataset.y;

  if(nodes[1][0]!==y || nodes[1][1]!==x) return;

  navigator.vibrate?.(15);
  play(200);

  isDrawing=true;
  path=[];
  currentNumber=1;
  combo=0;

  fill(cell,x,y);
}

function move(e){

  if(!isDrawing) return;

  const el=document.elementFromPoint(e.clientX,e.clientY);
  const cell=el?.closest(".cell");
  if(!cell) return;

  const x=+cell.dataset.x;
  const y=+cell.dataset.y;

  if(path.some(p=>p.x===x && p.y===y)) return;

  if(path.length>0){
    const last=path[path.length-1];
    if(Math.abs(last.x-x)+Math.abs(last.y-y)!==1) return;
  }

  let next=currentNumber+1;

  /* DOĞRU HAMLE */
  if(nodes[next]){
    let [ny,nx]=nodes[next];

    if(ny===y && nx===x){
      currentNumber++;
      combo++;

      navigator.vibrate?.(10);
      play(300 + combo*40);

      score += 10 * combo;
    }
  }

  /* YANLIŞ NODE */
  for(let key in nodes){
    let [ny,nx]=nodes[key];
    if(ny===y && nx===x && key!=next){
      play(120);
      navigator.vibrate?.(50);
      return;
    }
  }

  fill(cell,x,y);

  /* WIN */
  if(currentNumber===Object.keys(nodes).length && path.length===size*size){

    play(800,0.3);
    navigator.vibrate?.([50,50,50]);

    setTimeout(()=>{
      alert("🎉 Süper! Skor: "+score);
    },150);
  }
}

/* =========================
FILL (VISUAL BOOST)
========================= */

function fill(cell,x,y){
  cell.classList.add("filled");

  /* glow effect */
  cell.style.boxShadow="0 0 12px rgba(99,102,241,0.6)";

  path.push({x,y});
}

/* =========================
RESET
========================= */

function resetGame(){
  document.querySelectorAll(".cell").forEach(c=>{
    c.classList.remove("filled");
    c.style.boxShadow="none";
  });

  path=[];
  currentNumber=1;
  score=0;
  combo=0;
}

/* =========================
NAV
========================= */

function goBack(){
  window.history.back();
}

</script>


</body>
</html>
