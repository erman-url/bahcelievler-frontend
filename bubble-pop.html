<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Bubble Pop Pro+</title>

<meta name="description" content="Gerçekçi balon patlatma oyunu. Havuz sistemi ile zorlu ve akıcı mobil deneyim.">
<meta name="robots" content="index, follow">

<meta name="theme-color" content="#1abc9c">

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

html,body{
width:100%;
height:100%;
overflow:hidden;
font-family:-apple-system,system-ui;
background:#1abc9c;
}

canvas{position:absolute;top:0;left:0;}

#ui{
position:fixed;
top:0;
left:0;
width:100%;
padding:10px;
color:#fff;
z-index:10;
}

/* 🔥 HAVUZ BAR */
.pool{
height:8px;
background:rgba(255,255,255,0.2);
border-radius:10px;
overflow:hidden;
margin-bottom:8px;
}

.poolFill{
height:100%;
width:0%;
background:linear-gradient(90deg,#00ff9d,#ff4757);
transition:width .2s;
}

/* HUD */
.row{
display:flex;
justify-content:space-between;
align-items:center;
font-weight:700;
}

.overlay{
position:fixed;
inset:0;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:linear-gradient(#1abc9c,#16a085);
z-index:9999;
}

.title{
font-size:48px;
font-weight:900;
color:#fff;
margin-bottom:10px;
}

.btn{
padding:14px 30px;
border:none;
border-radius:30px;
background:#fff;
color:#16a085;
font-weight:bold;
}

#gameOver{display:none;}
</style>
</head>

<body>

<div id="ui">

<div class="pool">
<div id="poolFill" class="poolFill"></div>
</div>

<div class="row">
<div onclick="goBack()">←</div>
<div id="score">0</div>
<div id="lives">❤️❤️❤️❤️❤️</div>
<div id="time">120s</div>
</div>

</div>

<div id="startScreen" class="overlay">
<div class="title">Bubble Pop</div>
<button class="btn" onclick="startGame()">OYNA</button>
</div>

<div id="gameOver" class="overlay">
<div class="title" id="endTitle">Bitti</div>
<div id="finalScore"></div>
<button class="btn" onclick="startGame()">Tekrar</button>
</div>

<canvas id="game"></canvas>

<script>

/* AUDIO */
const ctxAudio = new (window.AudioContext || window.webkitAudioContext)();
function popSound(freq){
const o=ctxAudio.createOscillator();
const g=ctxAudio.createGain();
o.connect(g); g.connect(ctxAudio.destination);
o.frequency.value=freq;
g.gain.value=0.08;
o.start();
o.stop(ctxAudio.currentTime+0.08);
}

/* CANVAS */
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W,H;
function resize(){
W=canvas.width=innerWidth;
H=canvas.height=innerHeight;
}
resize();
addEventListener("resize",resize);

/* STATE */
let balloons=[],particles=[];
let score=0,lives=5,time=120;
let running=false,speed=1,combo=0;

/* 🔥 HAVUZ STATE */
let pool=0; // 0-100

/* BALLOON */
class Balloon{
constructor(x,y,r,s){
this.x=x; this.y=y;
this.r=r; this.s=s;
this.offset=Math.random()*100;
}
draw(){
let grad=ctx.createRadialGradient(
this.x-this.r/3,this.y-this.r/3,this.r*0.2,
this.x,this.y,this.r
);
grad.addColorStop(0,"#fff");
grad.addColorStop(1,"#3498db");

ctx.fillStyle=grad;
ctx.beginPath();
ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
ctx.fill();
}
update(){
this.y+=this.s*speed;
this.x+=Math.sin((this.y+this.offset)*0.02)*0.5;
}
}

/* PARTICLE */
function explode(x,y){
for(let i=0;i<10;i++){
particles.push({
x,y,
vx:(Math.random()-0.5)*4,
vy:(Math.random()-0.5)*4,
life:20
});
}
}

/* SPAWN */
function spawn(){
if(balloons.length>6) return;
let r=20+Math.random()*10;
let x=Math.random()*(W-2*r)+r;
let s=1.2+Math.random()*1.2;
balloons.push(new Balloon(x,-r,r,s));
}

/* HIT */
function hit(x,y){
for(let i=balloons.length-1;i>=0;i--){
let b=balloons[i];
let dx=x-b.x, dy=y-b.y;

if(dx*dx+dy*dy<b.r*b.r){

popSound(300+combo*30);
explode(b.x,b.y);

score+=1+Math.floor(combo*0.2);
combo++;

balloons.splice(i,1);
updateUI();
return;
}
}
combo=0;
}

/* LOOP */
function loop(){
if(!running)return;

ctx.clearRect(0,0,W,H);

for(let i=balloons.length-1;i>=0;i--){
let b=balloons[i];
b.update();
b.draw();

if(b.y>H){
balloons.splice(i,1);

/* 🔥 HAVUZ ARTIŞ */
pool+=10;
if(pool>100) pool=100;

updateUI();

/* GAME OVER HAVUZ */
if(pool>=100){
endGame("Havuz doldu");
return;
}

/* CAN SİSTEMİ DEVAM */
lives--;
if(lives<=0){
endGame("Can bitti");
}
}
}

/* particles */
particles.forEach((p,i)=>{
p.x+=p.vx;
p.y+=p.vy;
p.life--;
ctx.fillRect(p.x,p.y,2,2);
if(p.life<=0) particles.splice(i,1);
});

spawn();
requestAnimationFrame(loop);
}

/* TIMER */
let tInt;
function startTimer(){
clearInterval(tInt);
tInt=setInterval(()=>{
time--;
updateUI();

if(time<60) speed=1.2;
if(time<30) speed=1.5;

if(time<=0) endGame("Süre doldu");
},1000);
}

/* UI */
const scoreEl=document.getElementById("score");
const livesEl=document.getElementById("lives");
const timeEl=document.getElementById("time");
const poolEl=document.getElementById("poolFill");

function updateUI(){
scoreEl.innerText=score;
livesEl.innerText="❤️".repeat(lives);
timeEl.innerText=time+"s";
poolEl.style.width=pool+"%";
}

/* START */
function startGame(){
document.getElementById("startScreen").style.display="none";
document.getElementById("gameOver").style.display="none";

score=0;lives=5;time=120;
balloons=[];particles=[];
running=true;speed=1;combo=0;
pool=0;

updateUI();
startTimer();
loop();
}

/* END */
function endGame(txt){
running=false;
clearInterval(tInt);

document.getElementById("gameOver").style.display="flex";
document.getElementById("endTitle").innerText=txt;
document.getElementById("finalScore").innerText="Skor: "+score;
}

/* INPUT */
canvas.addEventListener("touchstart",e=>{
if(!running)return;
let r=canvas.getBoundingClientRect();
hit(e.touches[0].clientX-r.left,e.touches[0].clientY-r.top);
},{passive:true});

canvas.addEventListener("mousedown",e=>{
if(!running)return;
let r=canvas.getBoundingClientRect();
hit(e.clientX-r.left,e.clientY-r.top);
});

/* NAV */
function goBack(){
history.back();
}

</script>

</body>
</html>
