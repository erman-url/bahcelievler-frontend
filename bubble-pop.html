<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>Bubble Pop Pro | Bahçelievler Forum</title>

<meta name="theme-color" content="#1abc9c">

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

html,body{
width:100%;
height:100%;
overflow:hidden;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
background:#1abc9c;
}

/* CANVAS */
canvas{
position:absolute;
top:0;
left:0;
}

/* UI */
#ui{
position:fixed;
top:0;
left:0;
width:100%;
height:60px;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 15px;
color:#fff;
background:linear-gradient(to bottom,rgba(0,0,0,0.4),transparent);
z-index:10;
font-weight:600;
}

/* OVERLAY */
.overlay{
position:fixed;
inset:0;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:linear-gradient(#1abc9c,#16a085);
z-index:9999;
}

/* TITLE */
.title{
font-size:48px;
font-weight:900;
color:#fff;
text-shadow:0 5px 20px rgba(0,0,0,.3);
margin-bottom:10px;
}

/* BUTTON */
.btn{
padding:14px 30px;
border:none;
border-radius:30px;
background:#fff;
color:#16a085;
font-weight:bold;
cursor:pointer;
}

#gameOver{display:none;}
</style>
</head>

<body>

<div id="ui">
<div onclick="goBack()">←</div>
<div id="score">0</div>
<div id="lives">❤️❤️❤️❤️❤️</div>
<div id="time">120s</div>
</div>

<div id="startScreen" class="overlay">
<div class="title">Bubble Pop</div>
<button class="btn" onclick="startGame()">OYNA</button>
</div>

<div id="gameOver" class="overlay">
<div class="title" id="endTitle">Bitti</div>
<div id="finalScore"></div>
<button class="btn" onclick="startGame()">Tekrar</button>
</div>

<canvas id="game"></canvas>

<script>

/* =========================
AUDIO
========================= */
const ctxAudio = new (window.AudioContext || window.webkitAudioContext)();

function beep(freq){
const o=ctxAudio.createOscillator();
const g=ctxAudio.createGain();
o.connect(g); g.connect(ctxAudio.destination);
o.frequency.value=freq;
g.gain.value=0.1;
o.start();
o.stop(ctxAudio.currentTime+0.1);
}

/* =========================
CANVAS
========================= */
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W,H;
function resize(){
W=canvas.width=innerWidth;
H=canvas.height=innerHeight;
}
resize();
addEventListener("resize",resize);

/* =========================
STATE
========================= */
let balloons=[];
let score=0;
let lives=5;
let time=120;
let running=false;
let speed=1;
let combo=0;

/* =========================
BALLOON
========================= */
class Balloon{
constructor(x,y,r,s,type=1){
this.x=x; this.y=y;
this.r=r; this.s=s;
this.type=type;
}
draw(){
ctx.beginPath();
ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
ctx.fillStyle=this.type==1?"#fff":"#ff7675";
ctx.fill();
}
update(){
this.y+=this.s*speed;
}
}

/* =========================
SPAWN
========================= */
function spawn(){
if(balloons.length>6) return;

let r=25;
let x=Math.random()*(W-2*r)+r;
let s=1.5+Math.random();

balloons.push(new Balloon(x,-r,r,s,1));
}

/* =========================
HIT
========================= */
function hit(x,y){
for(let i=balloons.length-1;i>=0;i--){
let b=balloons[i];
let dx=x-b.x, dy=y-b.y;

if(Math.sqrt(dx*dx+dy*dy)<b.r){

beep(300+combo*50);
navigator.vibrate?.(10);

if(b.type==1){
balloons.push(new Balloon(b.x,b.y,15,2,2));
score+=2;
}else{
score+=1;
}

combo++;
balloons.splice(i,1);
updateUI();
return;
}
}
combo=0;
}

/* INPUT */
canvas.addEventListener("touchstart",(e)=>{
if(!running)return;
let rect=canvas.getBoundingClientRect();
hit(e.touches[0].clientX-rect.left,e.touches[0].clientY-rect.top);
});

canvas.addEventListener("mousedown",(e)=>{
if(!running)return;
let rect=canvas.getBoundingClientRect();
hit(e.clientX-rect.left,e.clientY-rect.top);
});

/* =========================
LOOP
========================= */
function loop(){
if(!running)return;

ctx.clearRect(0,0,W,H);

for(let i=balloons.length-1;i>=0;i--){
let b=balloons[i];
b.update();
b.draw();

if(b.y>H){
balloons.splice(i,1);
lives--;
updateUI();

if(lives<=0) endGame("Can bitti");
}
}

spawn();
requestAnimationFrame(loop);
}

/* =========================
TIMER
========================= */
let tInt;
function startTimer(){
clearInterval(tInt);
tInt=setInterval(()=>{
time--;
updateUI();

if(time==60) speed=1.5;
if(time==30) speed=2;

if(time<=0) endGame("Süre doldu");
},1000);
}

/* =========================
UI
========================= */
function updateUI(){
scoreEl.innerText=score;
livesEl.innerText="❤️".repeat(lives);
timeEl.innerText=time+"s";
}

const scoreEl=document.getElementById("score");
const livesEl=document.getElementById("lives");
const timeEl=document.getElementById("time");

/* =========================
START
========================= */
function startGame(){
document.getElementById("startScreen").style.display="none";
document.getElementById("gameOver").style.display="none";

score=0; lives=5; time=120;
balloons=[]; running=true; speed=1; combo=0;

updateUI();
startTimer();
loop();
}

/* =========================
END
========================= */
function endGame(txt){
running=false;
clearInterval(tInt);

document.getElementById("gameOver").style.display="flex";
document.getElementById("endTitle").innerText=txt;
document.getElementById("finalScore").innerText="Skor: "+score;
}

/* NAV */
function goBack(){
location.href="online-oyunlar.html";
}

</script>

</body>
</html>
