<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>Bubble Pop Oyunu | Bahçelievler Forum</title>

<meta name="description" content="Bubble Pop oyununu hemen oyna. Baloncukları patlat, süreye karşı yarış ve skor yap. Bahçelievler Forum ücretsiz mobil oyun.">
<meta name="keywords" content="bubble pop oyunu, balon patlatma oyunu, mobil oyun, online oyun, bahçelievler oyun">

<link rel="canonical" href="https://bahcelievlerforum.com/bubble-pop.html">

<meta property="og:title" content="Bubble Pop Oyunu">
<meta property="og:description" content="Baloncukları patlat, süreye karşı yarış!">
<meta property="og:image" content="https://bahcelievlerforum.com/assets/images/oyunlar-cover.jpg">
<meta property="og:type" content="game">

<meta name="robots" content="index,follow">
<meta name="theme-color" content="#1abc9c">

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

html,body{
width:100%;
height:100%;
overflow:hidden;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
background:#1abc9c;
padding-top:env(safe-area-inset-top);
}

/* CANVAS */
canvas{
position:absolute;
top:0;
left:0;
z-index:1;
}

/* TOP UI */
#ui{
position:fixed;
top:0;
left:0;
width:100%;
height:60px;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 15px;
color:#fff;
background:linear-gradient(to bottom,rgba(0,0,0,0.35),transparent);
z-index:10;
font-weight:600;
}

/* OVERLAY */
.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:linear-gradient(#1abc9c,#16a085);
z-index:9999;
text-align:center;
}

/* TITLE */
.title{
font-size:48px;
font-weight:900;
color:#fff;
letter-spacing:2px;
text-shadow:
0 5px 15px rgba(0,0,0,0.3),
0 0 10px rgba(255,255,255,0.6);
margin-bottom:10px;
}

/* BUTTON */
.btn{
padding:14px 30px;
font-size:18px;
border:none;
border-radius:30px;
background:#fff;
color:#16a085;
font-weight:bold;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
cursor:pointer;
transition:0.2s;
}
.btn:active{transform:scale(0.95);}

#gameOver{display:none;}

.stat{
color:#fff;
font-size:20px;
margin:10px 0;
}
</style>
</head>

<body>

<div id="ui">
<div onclick="goBack()">←</div>
<div id="score">0</div>
<div id="lives">❤️❤️❤️❤️❤️</div>
<div id="time">300s</div>
</div>

<div id="startScreen" class="overlay">
<div class="title">Bubble Pop</div>
<div style="color:white;opacity:.8;margin-bottom:20px">
Bahçelievler Forum
</div>
<button class="btn" onclick="startGame()">OYNA</button>
</div>

<div id="gameOver" class="overlay">
<div class="title" id="endTitle">Bitti!</div>
<div class="stat" id="finalScore"></div>
<button class="btn" onclick="restartGame()">Tekrar Oyna</button>
</div>

<canvas id="game"></canvas>

<script>

/* DOM FIX */
document.addEventListener("DOMContentLoaded",()=>{
let start=document.getElementById("startScreen");
if(start) start.style.display="flex";
});

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W,H;
function resize(){
W = canvas.width = window.innerWidth;
H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

const SKY="#1abc9c";

let balloons=[];
let score=0;
let lives=5;
let time=300;
let running=false;
let spawnTick=0;
let speedMultiplier=1;

/* BALLOON */
class Balloon{
constructor(x,y,r,s,level=1){
this.x=x;
this.y=y;
this.r=r;
this.s=s;
this.level=level;
}
draw(){
ctx.beginPath();
ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
ctx.fillStyle=this.level===1?"rgba(255,255,255,0.7)":"rgba(255,150,150,0.9)";
ctx.fill();
}
update(){
this.y+=this.s*speedMultiplier;
}
}

/* SPAWN */
function spawn(){
if(balloons.length>=3) return;

let r=30;
let x=Math.random()*(W-2*r)+r;
let s=1.5;

balloons.push(new Balloon(x,-r,r,s,1));
}

/* SPLIT */
function split(b){

if(b.level===1){

for(let i=0;i<2;i++){
balloons.push(new Balloon(
b.x+(Math.random()-0.5)*30,
b.y,
b.r*0.6,
b.s+0.5,
2
));
}

score+=2;

}else{
score+=1;
}

updateUI();
}

/* HIT */
function hit(x,y){
for(let i=balloons.length-1;i>=0;i--){
let b=balloons[i];
let dx=x-b.x;
let dy=y-b.y;

if(Math.sqrt(dx*dx+dy*dy)<b.r){
split(b);
balloons.splice(i,1);
return;
}
}
}

/* INPUT */
canvas.addEventListener("mousedown",(e)=>{
if(!running)return;
let rect=canvas.getBoundingClientRect();
hit(e.clientX-rect.left,e.clientY-rect.top);
});

canvas.addEventListener("touchstart",(e)=>{
if(!running)return;
let rect=canvas.getBoundingClientRect();
hit(e.touches[0].clientX-rect.left,e.touches[0].clientY-rect.top);
});

/* UI */
function updateUI(){
document.getElementById("score").innerText=score;
document.getElementById("lives").innerText="❤️".repeat(lives);
document.getElementById("time").innerText=time+"s";
}

/* LOOP */
function loop(){
if(!running)return;

ctx.clearRect(0,0,W,H);

ctx.fillStyle=SKY;
ctx.fillRect(0,0,W,H);

for(let i=balloons.length-1;i>=0;i--){
let b=balloons[i];
b.update();
b.draw();

if(b.y>H-70){
balloons.splice(i,1);

// SADECE KÜÇÜK BALON HASAR
if(b.level===2){
lives--;
updateUI();
}

if(lives<=0){
endGame("Can bitti");
}
}
}

spawnTick++;
if(spawnTick>80){
spawn();
spawnTick=0;
}

requestAnimationFrame(loop);
}

/* TIMER */
let timerInterval;

function startTimer(){
clearInterval(timerInterval);

timerInterval=setInterval(()=>{
time--;
updateUI();

// 2. dakika sonrası hızlanma
if(time===180){
speedMultiplier=1.2;
}

// süre bitince
if(time<=0){
endGame("Süre doldu");
}

},1000);
}

let gameEnded=false;

/* START */
function startGame(){

let start=document.getElementById("startScreen");
let over=document.getElementById("gameOver");

if(start) start.style.display="none";
if(over) over.style.display="none";

gameEnded=false;
clearInterval(timerInterval);

score=0;
lives=5;
time=300;
balloons=[];
running=true;
speedMultiplier=1;

updateUI();
startTimer();
loop();
}

/* RESTART */
function restartGame(){
gameEnded=false;
clearInterval(timerInterval);
startGame();
}

/* BACK */
function goBack(){
window.location.href="online-oyunlar.html";
}

/* END */
function endGame(reason){
if(gameEnded) return;
gameEnded=true;

running=false;
clearInterval(timerInterval);

let over=document.getElementById("gameOver");
let scoreText=document.getElementById("finalScore");
let title=document.getElementById("endTitle");

if(over) over.style.display="flex";
if(scoreText) scoreText.innerText="Skor: "+score;
if(title) title.innerText=reason;
}

</script>

</body>
</html>
