<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>Bubble Pop Oyunu | Bahçelievler Forum</title>

<meta name="description" content="Bubble Pop oyununu hemen oyna. Baloncukları patlat, süreye karşı yarış ve skor yap. Bahçelievler Forum ücretsiz mobil oyun.">
<meta name="keywords" content="bubble pop oyunu, balon patlatma oyunu, mobil oyun, online oyun, bahçelievler oyun">

<link rel="canonical" href="https://bahcelievlerforum.com/bubble-pop.html">

<meta property="og:title" content="Bubble Pop Oyunu">
<meta property="og:description" content="Baloncukları patlat, süreye karşı yarış!">
<meta property="og:image" content="https://bahcelievlerforum.com/assets/images/oyunlar-cover.jpg">
<meta property="og:type" content="game">

<meta name="robots" content="index,follow">
<meta name="theme-color" content="#1abc9c">

<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

html,body{
width:100%;
height:100%;
overflow:hidden;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto;
background:#1abc9c;
padding-top:env(safe-area-inset-top);
}

canvas{
position:absolute;
top:0;
left:0;
z-index:1;
}

#ui{
position:fixed;
top:0;
left:0;
width:100%;
height:60px;
display:flex;
justify-content:space-between;
align-items:center;
padding:0 15px;
color:#fff;
background:linear-gradient(to bottom,rgba(0,0,0,0.35),transparent);
z-index:10;
font-weight:600;
}

.overlay{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
background:linear-gradient(#1abc9c,#16a085);
z-index:9999;
text-align:center;
}

.title{
font-size:48px;
font-weight:900;
color:#fff;
letter-spacing:2px;
text-shadow:
0 5px 15px rgba(0,0,0,0.3),
0 0 10px rgba(255,255,255,0.6);
margin-bottom:10px;
}

.btn{
padding:14px 30px;
font-size:18px;
border:none;
border-radius:30px;
background:#fff;
color:#16a085;
font-weight:bold;
box-shadow:0 5px 15px rgba(0,0,0,0.2);
cursor:pointer;
}

#gameOver{display:none;}

.stat{
color:#fff;
font-size:20px;
margin:10px 0;
}
</style>
</head>

<body>

<div id="globalHeader"></div>

<div id="ui">
<div onclick="goBack()">←</div>
<div id="score">0</div>
<div id="lives">❤️❤️❤️❤️❤️</div>
<div id="time">30s</div>
</div>

<div id="startScreen" class="overlay">
<div class="title">Bubble Pop</div>
<div style="opacity:.8;margin-bottom:20px">Bahçelievler Forum</div>
<button class="btn" onclick="startGame()">OYNA</button>
</div>

<div id="gameOver" class="overlay">
<div class="title">Bitti!</div>
<div class="stat" id="finalScore"></div>
<button class="btn" onclick="restartGame()">Tekrar Oyna</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W,H;
function resize(){
W = canvas.width = window.innerWidth;
H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener("resize",resize);

let balloons=[];
let score=0;
let lives=5;
let time=30;
let running=false;
let spawnTick=0;

class Balloon{
constructor(x,y,r,s,level){
this.x=x;
this.y=y;
this.r=r;
this.s=s;
this.level=level;
}
draw(){
ctx.beginPath();
ctx.arc(this.x,this.y,this.r,0,Math.PI*2);
ctx.fillStyle=this.level===1 ? "white" : "pink";
ctx.fill();
}
update(){
this.y+=this.s;
}
}

function spawn(){
if(balloons.length>=3) return;

let r=30;
let x=Math.random()*(W-2*r)+r;
balloons.push(new Balloon(x,-r,r,1.5,1));
}

function split(b){
if(b.level===1){
for(let i=0;i<2;i++){
balloons.push(new Balloon(
b.x+(Math.random()-0.5)*30,
b.y,
b.r*0.6,
b.s+0.5,
2
));
}
score+=2;
}else{
score+=1;
}
updateUI();
}

function hit(x,y){
for(let i=balloons.length-1;i>=0;i--){
let b=balloons[i];
let dx=x-b.x;
let dy=y-b.y;

if(Math.sqrt(dx*dx+dy*dy)<b.r){
split(b);
balloons.splice(i,1);
return;
}
}
}

canvas.addEventListener("mousedown",(e)=>{
if(!running)return;
let rect=canvas.getBoundingClientRect();
hit(e.clientX-rect.left,e.clientY-rect.top);
});

canvas.addEventListener("touchstart",(e)=>{
if(!running)return;
let rect=canvas.getBoundingClientRect();
hit(e.touches[0].clientX-rect.left,e.touches[0].clientY-rect.top);
});

function updateUI(){
document.getElementById("score").innerText=score;
document.getElementById("lives").innerText="❤️".repeat(lives);
document.getElementById("time").innerText=time+"s";
}

function loop(){
if(!running)return;

ctx.clearRect(0,0,W,H);

for(let i=balloons.length-1;i>=0;i--){
let b=balloons[i];
b.update();
b.draw();

if(b.y>H-70){
balloons.splice(i,1);

if(b.level===2){
lives--;
updateUI();
}

if(lives<=0) endGame();
}
}

spawnTick++;
if(spawnTick>80){
spawn();
spawnTick=0;
}

requestAnimationFrame(loop);
}

let timerInterval;

function startTimer(){
clearInterval(timerInterval);
timerInterval=setInterval(()=>{
time--;
updateUI();
if(time<=0) endGame();
},1000);
}

let gameEnded=false;

function startGame(){
document.getElementById("startScreen").style.display="none";
document.getElementById("gameOver").style.display="none";

score=0;
lives=5;
time=30;
balloons=[];
running=true;
gameEnded=false;

updateUI();
startTimer();
loop();
}

function restartGame(){
clearInterval(timerInterval);
startGame();
}

function goBack(){
window.location.href="online-oyunlar.html";
}

function endGame(){
if(gameEnded) return;
gameEnded=true;

running=false;
clearInterval(timerInterval);

document.getElementById("gameOver").style.display="flex";
document.getElementById("finalScore").innerText="Skor: "+score;
}
</script>


<script src="assets/js/footerLegal.js" defer></script>

</body>
</html>
