<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>Fiyat Dedektifi | Bahçelievler Forum</title>

<meta name="keywords" content="bahçelievler fiyat, market fiyatları, semt enflasyonu, fiyat karşılaştırma">

<link rel="canonical" href="https://bahcelievler.forum/fiyat-dedektifi">

<link rel="stylesheet" href="assets/css/components.css">

<!-- Barkod -->

<!-- OCR -->

<style>

/* ✅ EKLENDİ - GLOBAL BODY FIX */
body{
background:#f3f6fb;
padding-top:env(safe-area-inset-top);
}

/* ✅ EKLENDİ - WRAPPER FIX */
.page-wrapper{
max-width:900px;
margin:auto;
padding-bottom:120px;
margin-top:10px;
}

.page-container{
max-width:720px;
margin:auto;
padding-bottom:calc(120px + env(safe-area-inset-bottom));
}

/* 🔁 REVIZE EDİLDİ - DOUBLE HEADER FIX */
.fd-header{
background:#eef3fb;
color:#1f2937;
padding:14px 16px;
border-radius:14px;
margin:12px;
}

.fd-header h1{
font-size:18px;
font-weight:700;
}

/* --- ORİJİNAL CSS DEVAM EDİYOR --- */

.fd-card{
background:white;
border-radius:18px;
padding:18px;
margin:16px 12px;
box-shadow:0 8px 22px rgba(0,0,0,.06);
}

.fd-graph{
height:170px;
border-radius:14px;
background:linear-gradient(180deg,#ffd2e7,#fff);
display:flex;
align-items:center;
justify-content:center;
color:#777;
}

.fd-product{
display:flex;
justify-content:space-between;
align-items:center;
padding:16px 0;
border-bottom:1px solid #eee;
}

.fd-product:last-child{
border-bottom:none;
}

.fd-meta{
font-size:12px;
color:#777;
}

.fd-date{
font-size:11px;
color:#999;
}

.fd-verified{
font-size:11px;
color:#18a558;
font-weight:600;
}

.fd-price{
background:#ff006a;
color:white;
padding:7px 14px;
border-radius:20px;
font-size:13px;
font-weight:600;
}

.fd-add-btn{
margin:18px 12px;
background:#1657b7;
color:white;
padding:16px;
border-radius:14px;
text-align:center;
font-weight:600;
cursor:pointer;
}

/* 🔁 Z-INDEX FIX */
.fd-modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.45);
display:none;
align-items:center;
justify-content:center;
z-index:9999;
-webkit-overflow-scrolling:touch;
}

/* 🔁 SCROLL FIX */
.fd-modal-content{
position:relative;
background:white;
width:95%;
max-width:500px;
border-radius:18px;
padding:20px;
padding-bottom:120px;
max-height:calc(100vh - 120px);
overflow-y:auto;
overscroll-behavior:contain;
-webkit-overflow-scrolling:touch;
}

/* ✅ EKLENDİ */
body.modal-open{
overflow:hidden;
}

.fd-input{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid #ddd;
margin-top:8px;
font-size:14px;
}

.fd-label{
font-size:13px;
font-weight:600;
margin-top:12px;
display:block;
}

.fd-camera{
border:2px dashed #ddd;
padding:26px;
border-radius:12px;
text-align:center;
margin-top:8px;
background:#fafafa;
}

.fd-submit{
background:#ff006a;
color:white;
border:none;
width:100%;
padding:14px;
border-radius:12px;
margin-top:16px;
font-weight:600;
cursor:pointer;
}

.fd-close{
position:absolute;
top:18px;
right:22px;
font-size:18px;
cursor:pointer;
}

#scanner{
width:100%;
height:260px;
border-radius:12px;
overflow:hidden;
will-change:transform;
}

#scanner video{
width:100%!important;
height:100%!important;
object-fit:cover;
}

#priceChart{
width:100% !important;
height:150px !important;
}

</style>

</head>

<body>

<div id="globalHeader"></div>
<div id="sideMenu"></div>

<div class="page-wrapper">
<div class="page-container">

<!-- 🔁 ORİJİNAL HEADER KORUNDU -->
<div class="fd-header">
<h1><i class="fa-solid fa-magnifying-glass"></i> Fiyat Dedektifi</h1>
<p>Semt fiyat endeksi</p>
</div>

<div class="fd-card">

<h3><i class="fa-solid fa-chart-line"></i> Semt Fiyat Endeksi</h3>

<div class="fd-graph">
<canvas id="priceChart"></canvas>
</div>

<p style="font-size:11px;margin-top:8px;color:#777">
Grafik komşuların girdiği gerçek fiyatlardan hesaplanır
</p>

</div>

<div class="fd-card" id="lastPrices">

<h3>Son Eklenen Fiyatlar</h3>

<!-- ✅ ORİJİNAL STATIC DATA KORUNDU -->
<div class="fd-product">
<div>
<strong>Güzel Pınar Su</strong>
<div class="fd-meta">ŞOK • Bahçelievler</div>
<div class="fd-date">18 Mart 2026</div>
<div class="fd-verified">✔ Etiket doğrulandı</div>
</div>
<div class="fd-price">4.75 TL</div>
</div>

</div>

<div class="fd-add-btn" onclick="openModal()">
<i class="fa-solid fa-plus"></i> Radar / Fiyat Ekle
</div>

</div>

<div class="fd-modal" id="priceModal">

<div class="fd-modal-content">

<div class="fd-close" onclick="closeModal()">
<i class="fa-solid fa-xmark"></i>
</div>

<h3>Fiyat Bildir</h3>

<label class="fd-label">📷 Ürün Etiket Fotoğrafı</label>

<div class="fd-camera">

<input
id="imageInput"
type="file"
accept="image/*"
capture="environment"
onchange="if(this.files.length){runOCR(this.files[0])}"
>

<p style="font-size:12px;color:#888">
Etiket fotoğrafı zorunludur
</p>

</div>

<label class="fd-label">Barkod</label>

<div style="display:flex;gap:6px">

<input
id="barcodeInput"
class="fd-input"
inputmode="numeric"
pattern="[0-9]*"
placeholder="869XXXXXXXXXXXX"
onblur="getProductByBarcode()"
>

<button type="button" onclick="startScanner()" style="width:60px;height:46px;border-radius:10px">
<i class="fa-solid fa-barcode"></i>
</button>

</div>

<div id="scannerArea" style="display:none;margin-top:10px">

<div id="scanner"></div>

<button type="button" onclick="stopScanner()" class="fd-submit" style="margin-top:8px">
Kamerayı Kapat
</button>

</div>

<label class="fd-label">Ürün Adı</label>
<input id="urunInput" class="fd-input" placeholder="Örn: Sütaş Süt 200ml">

<label class="fd-label">Fiyat (TL)</label>
<input id="priceInput" class="fd-input" inputmode="decimal" pattern="[0-9]*[.,]?[0-9]*" placeholder="17.45" required>

<label class="fd-label">Market</label>

<select id="marketSelect" class="fd-input">
<option>A101</option>
<option>BİM</option>
<option>ŞOK</option>
<option>ONUR</option>
<option>ÇAĞRI</option>
<option>Migros</option>
<option>CarrefourSA</option>
<option>Tarım Kredi</option>
<option>Mağazacılık</option>
<option>Yerel Esnaf/Pazar</option>
</select>

<label class="fd-label">Mahalle</label>

<select id="districtSelect" class="fd-input">
<option>Bahçelievler Mahallesi</option>
<option>Cumhuriyet Mahallesi</option>
<option>Çobançeşme Mahallesi</option>
<option>Fevzi Çakmak Mahallesi</option>
<option>Hürriyet Mahallesi</option>
<option>Kocasinan Merkez Mahallesi</option>
<option>Siyavuşpaşa Mahallesi</option>
<option>Soğanlı Mahallesi</option>
<option>Şirinevler Mahallesi</option>
<option>Yenibosna Merkez Mahallesi</option>
<option>Zafer Mahallesi</option>
</select>

<label class="fd-label">Doğrulama</label>
<input id="captchaInput" class="fd-input" inputmode="numeric" placeholder="3 + 2 = ?">

<button onclick="submitPrice(event)" class="fd-submit">
RADARA EKLE
</button>

</div>

</div>

<div id="globalFooter"></div>

<script src="assets/js/priceList.js"></script>

<script>

/* ✅ DEBUG GUARD */
document.addEventListener("DOMContentLoaded",function(){
if(!document.getElementById("globalHeader")) console.error("globalHeader eksik")
if(!document.getElementById("sideMenu")) console.error("sideMenu eksik")
})

function openModal(){
const modal=document.getElementById("priceModal")
modal.style.display="flex"
document.body.classList.add("modal-open")
}

function closeModal(){
const modal=document.getElementById("priceModal")
modal.style.display="none"
document.body.classList.remove("modal-open")
}

document.getElementById("priceModal").addEventListener("click",function(e){
if(e.target===this){
closeModal()
}
})

document.addEventListener("DOMContentLoaded", () => {
if (typeof loadLastPrices === "function") {
loadLastPrices()
} else {
console.error("loadLastPrices bulunamadı")
}
loadSemtChart()
})

window.refreshPrices = function(){
if (typeof loadLastPrices === "function") {
loadLastPrices()
}
if (typeof loadSemtChart === "function") {
loadSemtChart()
}
}

async function loadSemtChart(){
try{
const res = await fetch("/api/semt-endeks")
const data = await res.json()

if(!data || !data.length){
console.warn("grafik veri yok")
return
}

const ctx = document.getElementById("priceChart").getContext("2d")

if(window.priceChartInstance instanceof Chart){
window.priceChartInstance.destroy()
}

window.priceChartInstance = new Chart(ctx, {
type: "line",
data: {
labels: data.map(i => i.gun),
datasets: [{
data: data.map(i => i.ortalama),
tension: 0.3
}]
},
options: {
plugins:{ legend:{ display:false } }
}
})

}catch(e){
console.error("grafik hata", e)
}
}

</script>

<script src="./assets/js/layout.js"></script>
<script src="./assets/js/menu.js"></script>
<script src="./assets/js/core.js" defer></script>
<script src="./assets/js/footerNav.js"></script>
<script src="assets/js/footerLegal.js"></script>

<div id="globalFooter"></div>

</body>
</html>
