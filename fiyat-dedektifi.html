<script src="assets/js/priceList.js"></script>

<script>

function openModal(){
const modal=document.getElementById("priceModal")
modal.style.display="flex"
document.body.style.overflow="hidden"
}

function closeModal(){
const modal=document.getElementById("priceModal")
modal.style.display="none"
document.body.style.overflow="auto"
}

document.getElementById("priceModal").addEventListener("click",function(e){
if(e.target===this){
closeModal()
}
})

/* ✅ SAYFA AÇILINCA VERİ ÇEK */
document.addEventListener("DOMContentLoaded", () => {
  if (typeof loadLastPrices === "function") {
    loadLastPrices()
  } else {
    console.error("loadLastPrices bulunamadı")
  }

   
 loadSemtChart()

})

/* ✅ GLOBAL YENİLEME (submit sonrası için hook) */
window.refreshPrices = function(){
  if (typeof loadLastPrices === "function") {
    loadLastPrices()
  }

  if (typeof loadSemtChart === "function") {
    loadSemtChart()
  }
}

async function loadChart(urun){

try{

const res = await fetch(`/api/fiyat-grafik?urun=${encodeURIComponent(urun)}`)
const data = await res.json()

if(!data.length){
  console.log("Grafik veri yok")
  return
}

const labels = data.map(i => {
  const d = new Date(i.created_at)
  return d.toLocaleDateString("tr-TR")
})

const prices = data.map(i => i.fiyat)

const ctx = document.getElementById("priceChart").getContext("2d")

// eski chart varsa temizle
if(window.priceChartInstance){
  window.priceChartInstance.destroy()
}

window.priceChartInstance = new Chart(ctx, {
  type: "line",
  data: {
    labels,
    datasets: [{
      data: prices,
      tension: 0.3
    }]
  },
  options: {
    responsive: true,
    plugins:{
      legend:{ display:false }
    }
  }
})

}catch(e){
console.error("grafik hata", e)
}

}

async function loadSemtChart(){

const res = await fetch("/api/semt-endeks")
const data = await res.json()

const labels = data.map(i => i.gun)
const prices = data.map(i => i.ortalama)

const ctx = document.getElementById("priceChart").getContext("2d")

if(window.priceChartInstance){
  window.priceChartInstance.destroy()
}

window.priceChartInstance = new Chart(ctx, {
  type: "line",
  data: {
    labels,
    datasets: [{
      data: prices,
      tension: 0.3
    }]
  },
  options: {
    plugins:{ legend:{ display:false } }
  }
})

}

</script>
