<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Yıldız Oluştur PRO+</title>
<style>

/* =========================
BASE
========================= */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,Segoe UI,Roboto;
}

body{
background:#020617;
color:#fff;
overflow:hidden;
-webkit-tap-highlight-color:transparent;
}

/* =========================
CANVAS BG
========================= */
canvas{
position:fixed;
top:0;
left:0;
z-index:0;
}

/* =========================
INTRO
========================= */
#introScreen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#020617;
z-index:999;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
padding:20px;
}


/* =========================
LAYOUT
========================= */
.game{
position:relative;
z-index:1;
height:100vh;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* HEADER */
.header{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(12px);
border-bottom:1px solid rgba(255,255,255,0.06);
}

/* SCORE */
.score{
position:absolute;
top:58px;
right:12px;
font-size:12px;
opacity:0.7;
}

/* =========================
PLAY
========================= */
.play{
flex:1;
display:flex;
flex-direction:column;
align-items:center;
justify-content:flex-start;
gap:10px;
overflow-y:auto;
padding-bottom:110px;
}

/* =========================
CORE (UPGRADE)
========================= */
.core{
width:180px;
height:180px;
border-radius:50%;
background:radial-gradient(circle,#0f172a,#000);
display:flex;
align-items:center;
justify-content:center;
margin-top:12px;
font-size:14px;
box-shadow:
0 0 80px rgba(255,204,0,0.15),
inset 0 0 50px rgba(0,0,0,0.9);
transition:0.3s;
}

.core.fusion{
background:radial-gradient(circle,#ffcc00,#ff6600);
box-shadow:0 0 120px #ff9900;
animation:pulse 0.5s infinite alternate;
}

@keyframes pulse{
from{transform:scale(1);}
to{transform:scale(1.15);}
}

/* =========================
BARS
========================= */
.bars{width:92%;}
.bar{
height:8px;
background:#111;
border-radius:10px;
overflow:hidden;
margin:5px 0;
}
.fill{
height:100%;
width:0%;
background:linear-gradient(90deg,#22c55e,#4ade80);
transition:0.25s;
}

/* =========================
ELEMENT GRID
========================= */
.elements{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
padding:25px 10px 0;
width:100%;
max-width:420px;
}

.element{
background:#111827;
border-radius:12px;
padding:10px;
text-align:center;
font-size:12px;
transition:0.2s;
touch-action:none;
}

.element span{
font-size:18px;
display:block;
margin-bottom:4px;
}

.element:active{transform:scale(0.95);}

.dragging{
opacity:0.5;
transform:scale(1.1);
}

/* =========================
FOOTER
========================= */
.footer{
position:fixed;
bottom:0;
left:0;
width:100%;
display:flex;
gap:6px;
padding:8px;
padding-bottom:calc(8px + env(safe-area-inset-bottom));
background:rgba(0,0,0,0.35);
backdrop-filter:blur(14px);
z-index:10;
}

/* =========================
BUTTONS (UPGRADE)
========================= */
button{
flex:1;
padding:10px 8px;
border-radius:999px;
font-weight:600;
font-size:12px;
color:#fff;
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.15);
}

/* =========================
LANDSCAPE
========================= */
@media (orientation:landscape){
.play{flex-direction:row;}
.elements{grid-template-columns:repeat(5,1fr);}
}

/* =========================
SCROLLBAR HIDE
========================= */
.play::-webkit-scrollbar{display:none;}
/* =========================
START BUTTON (SUN FIX)
========================= */
.startBtn{
  width:100px;
  height:100px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;
  position:relative;
  overflow:hidden;

  font-size:13px;
  font-weight:800;
  letter-spacing:1px;
  color:#5c4500;

  /* GÜNEŞ MERKEZİ */
  background:radial-gradient(circle at center,
    #fff7b0 0%,
    #f9e27d 30%,
    #f4c430 60%,
    #d4af37 100%
  );

  /* GÜNEŞ IŞIĞI */
  box-shadow:
    0 0 30px rgba(255,215,0,.7),
    0 0 70px rgba(255,215,0,.45),
    0 0 120px rgba(255,215,0,.25);

  border:none;
  cursor:pointer;

  transition:transform .2s ease;
}

/* PULSE (güneş nefesi) */
.startBtn{
  animation:sunPulse 2.5s ease-in-out infinite;
}

/* CLICK */
.startBtn:active{
  transform:scale(.92);
}

/* IŞIK DALGASI */
.startBtn::before{
  content:"";
  position:absolute;
  inset:-25px;
  border-radius:50%;
  background:radial-gradient(circle,
    rgba(255,215,0,.35),
    transparent 70%
  );
  animation:sunWave 3s linear infinite;
}

/* KEYFRAMES */
@keyframes sunPulse{
  0%{transform:scale(1);}
  50%{transform:scale(1.06);}
  100%{transform:scale(1);}
}

@keyframes sunWave{
  0%{transform:scale(1);opacity:.6;}
  100%{transform:scale(1.6);opacity:0;}
}

canvas{
  pointer-events:none;
}

.startBtn::before{
  pointer-events:none;
}

</style>
</head>

<body>

<canvas id="bg"></canvas>

<div id="introScreen">
<h1>☀️ Yıldız Oluştur</h1>
<p>Hidrojen + Helyum kullanarak yıldız oluştur</p>
<button class="startBtn" onclick="startGame()">Başla</button>
</div>

<div class="game">

<div class="header">
<div onclick="goBack()">← Geri</div>
<div>PRO</div>
</div>

<div class="score">Skor: <span id="score">0</span></div>

<div class="play">

<div id="core" class="core">Çekirdek</div>

<div class="bars">
<div>Basınç</div>
<div class="bar"><div id="pressure" class="fill"></div></div>
<div>Sıcaklık</div>
<div class="bar"><div id="temp" class="fill"></div></div>
</div>

<div class="elements">
<div class="element" data="H"><span>⚪</span>Hidrojen</div>
<div class="element" data="He"><span>🟡</span>Helyum</div>
<div class="element" data="O"><span>🔵</span>Oksijen</div>
<div class="element" data="C"><span>⚫</span>Karbon</div>
<div class="element" data="Fe"><span>🟤</span>Demir</div>
<div class="element" data="N"><span>🟢</span>Azot</div>
<div class="element" data="Au"><span>🟠</span>Altın</div>
<div class="element" data="Hg"><span>⚙️</span>Cıva</div>
<div class="element" data="Cl"><span>🧪</span>Klor</div>
</div>

</div>

<div class="footer">
<button class="fusionBtn" onclick="fusion()">Füzyon</button>
<button class="resetBtn" onclick="resetGame()">Temizle</button>
<button class="hintBtn" onclick="useHint()">İpucu</button>
</div>

</div>

<script>

/* =========================
INTRO
========================= */
function startGame(){
  document.getElementById("introScreen").style.display = "none";
}

/* =========================
BG
========================= */
const c = document.getElementById("bg");
const ctx = c.getContext("2d");

/* RESIZE FIX */
function resizeCanvas(){
  c.width = innerWidth;
  c.height = innerHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

/* STAR SYSTEM */
let stars = Array.from({length:250}, () => ({
  x: Math.random()*c.width,
  y: Math.random()*c.height,
  r: Math.random()*1.5,
  speed: Math.random()*0.4
}));

function draw(){
  ctx.fillStyle = "#020617";
  ctx.fillRect(0,0,c.width,c.height);

  stars.forEach(s=>{
    s.y += s.speed;
    if(s.y > c.height) s.y = 0;

    ctx.globalAlpha = 0.6;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    ctx.fillStyle = "#fff";
    ctx.fill();
  });

  requestAnimationFrame(draw);
}
draw();

/* =========================
STATE
========================= */
let selected = new Set();
let hintUsed = false;


/* =========================
SOUND (FIX: memory leak yok)
========================= */
let audioCtx;

function sound(f){
  if(!audioCtx){
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  let o = audioCtx.createOscillator();
  o.frequency.value = f;
  o.connect(audioCtx.destination);
  o.start();
  setTimeout(()=>o.stop(),100);
}

/* =========================
DRAG FIX (MOBİL + DESKTOP TEK SİSTEM)
========================= */
document.querySelectorAll(".element").forEach(el=>{

  el.addEventListener("pointerdown",(e)=>{
    e.preventDefault();

    const val = el.getAttribute("data");

    selected.add(val);
    sound(500);

    // küçük feedback
    el.style.transform="scale(0.9)";
    setTimeout(()=>el.style.transform="",120);
  });

});

function handleDrop(e){
  if(!dragItem) return;

  let core = document.getElementById("core");
  let rect = core.getBoundingClientRect();

  let x = e.clientX;
  let y = e.clientY;

  if(
    x > rect.left &&
    x < rect.right &&
    y > rect.top &&
    y < rect.bottom
  ){
    selected.add(dragItem);
    sound(500);
  }

  dragItem = null;
}

/* =========================
FUSION
========================= */
function fusion(){
  let core = document.getElementById("core");

  if(selected.has("H") && selected.has("He")){
    core.classList.add("fusion");
    core.innerHTML = "☀️ Yıldız!";
  }else{
    core.classList.remove("fusion");
    core.innerHTML = "💥 Çöküş";
  }
}

/* =========================
RESET
========================= */
function resetGame(){
  selected.clear();
  let core = document.getElementById("core");
  core.classList.remove("fusion");
  core.innerHTML = "Çekirdek";
}

/* =========================
HINT
========================= */
function useHint(){
  if(hintUsed) return alert("İpucu bitti");
  hintUsed = true;
  alert("Hidrojen + Helyum");
}

/* =========================
BACK
========================= */
function goBack(){
  if(history.length > 1){
    history.back();
  }else{
    window.location.href = "online-oyunlar.html";
  }
}

</script>

</body>
</html>
