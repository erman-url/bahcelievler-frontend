<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Yıldız Oluştur PRO+</title>
<style>

/* =========================
BASE
========================= */
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:-apple-system,Segoe UI,Roboto;
}

body{
background:#020617;
color:#fff;
overflow:hidden;
-webkit-tap-highlight-color:transparent;
}

/* =========================
CANVAS BG
========================= */
canvas{
position:fixed;
top:0;
left:0;
z-index:0;
}

/* =========================
INTRO
========================= */
#introScreen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#020617;
z-index:999;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
text-align:center;
padding:20px;
}


.startBtn{
  width:110px;
  height:110px;

  display:flex;
  align-items:center;
  justify-content:center;

  border-radius:50%;

  background:radial-gradient(circle at center,
    #fff6b0 0%,
    #f9e27d 35%,
    #f4c430 65%,
    #d4af37 100%
  );

  color:#5c4500;
  font-weight:800;
  font-size:13px;
  letter-spacing:1px;

  border:none;
  cursor:pointer;

  position:relative;

  box-shadow:
    0 0 25px rgba(255,215,0,.6),
    0 0 50px rgba(255,215,0,.4),
    0 0 80px rgba(255,215,0,.2);

  transition:.25s;
}

/* HAFİF PARLAMA */
.startBtn:hover{
  transform:scale(1.05);
  box-shadow:
    0 0 35px rgba(255,215,0,.8),
    0 0 70px rgba(255,215,0,.5);
}

/* BASMA */
.startBtn:active{
  transform:scale(.95);
}

/* =========================
LAYOUT
========================= */
.game{
position:relative;
z-index:1;
height:100vh;
display:flex;
flex-direction:column;
overflow:hidden;
}

/* HEADER */
.header{
display:flex;
justify-content:space-between;
align-items:center;
padding:12px;
background:rgba(255,255,255,0.05);
backdrop-filter:blur(12px);
border-bottom:1px solid rgba(255,255,255,0.06);
}

/* SCORE */
.score{
position:absolute;
top:58px;
right:12px;
font-size:12px;
opacity:0.7;
}

/* =========================
PLAY
========================= */
.play{
flex:1;
display:flex;
flex-direction:column;
align-items:center;
justify-content:flex-start;
gap:10px;
overflow-y:auto;
padding-bottom:110px;
}

/* =========================
CORE (UPGRADE)
========================= */
.core{
width:180px;
height:180px;
border-radius:50%;
background:radial-gradient(circle,#0f172a,#000);
display:flex;
align-items:center;
justify-content:center;
margin-top:12px;
font-size:14px;
box-shadow:
0 0 80px rgba(255,204,0,0.15),
inset 0 0 50px rgba(0,0,0,0.9);
transition:0.3s;
}

.core.fusion{
background:radial-gradient(circle,#ffcc00,#ff6600);
box-shadow:0 0 120px #ff9900;
animation:pulse 0.5s infinite alternate;
}

@keyframes pulse{
from{transform:scale(1);}
to{transform:scale(1.15);}
}

/* =========================
BARS
========================= */
.bars{width:92%;}
.bar{
height:8px;
background:#111;
border-radius:10px;
overflow:hidden;
margin:5px 0;
}
.fill{
height:100%;
width:0%;
background:linear-gradient(90deg,#22c55e,#4ade80);
transition:0.25s;
}

/* =========================
ELEMENT GRID
========================= */
.elements{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
padding:25px 10px 0;
width:100%;
max-width:420px;
}

.element{
background:#111827;
border-radius:12px;
padding:10px;
text-align:center;
font-size:12px;
transition:0.2s;
touch-action:none;
}

.element span{
font-size:18px;
display:block;
margin-bottom:4px;
}

.element:active{transform:scale(0.95);}

.dragging{
opacity:0.5;
transform:scale(1.1);
}

/* =========================
FOOTER
========================= */
.footer{
position:fixed;
bottom:0;
left:0;
width:100%;
display:flex;
gap:6px;
padding:8px;
padding-bottom:calc(8px + env(safe-area-inset-bottom));
background:rgba(0,0,0,0.35);
backdrop-filter:blur(14px);
z-index:10;
}

/* =========================
BUTTONS (UPGRADE)
========================= */
button{
flex:1;
padding:10px 8px;
border-radius:999px;
font-weight:600;
font-size:12px;
color:#fff;
background:rgba(255,255,255,0.08);
border:1px solid rgba(255,255,255,0.15);
}

/* =========================
LANDSCAPE
========================= */
@media (orientation:landscape){
.play{flex-direction:row;}
.elements{grid-template-columns:repeat(5,1fr);}
}

/* =========================
SCROLLBAR HIDE
========================= */
.play::-webkit-scrollbar{display:none;}

/* =========================
FUTURISTIC START BUTTON
========================= */
.startBtn{
width:120px;
height:120px;
border-radius:50%;
background:radial-gradient(circle at 30% 30%,#22c55e,#15803d);
display:flex;
align-items:center;
justify-content:center;
font-size:14px;
font-weight:700;
color:#fff;
margin-top:30px;

/* glow */
box-shadow:
0 0 20px rgba(34,197,94,0.6),
0 0 60px rgba(34,197,94,0.4),
inset 0 0 20px rgba(255,255,255,0.2);

/* animasyon */
animation:pulseGlow 2s infinite ease-in-out;
transition:0.3s;
}

.startBtn:active{
transform:scale(0.9);
}

/* dış halka efekti */
.startBtn::before{
content:"";
position:absolute;
width:160px;
height:160px;
border-radius:50%;
border:2px solid rgba(34,197,94,0.3);
animation:rotateRing 6s linear infinite;
}

@keyframes pulseGlow{
0%{box-shadow:0 0 10px rgba(34,197,94,0.4);}
50%{box-shadow:0 0 40px rgba(34,197,94,0.9);}
100%{box-shadow:0 0 10px rgba(34,197,94,0.4);}
}

@keyframes rotateRing{
from{transform:rotate(0deg);}
to{transform:rotate(360deg);}
}

</style>
</head>

<body>

<canvas id="bg"></canvas>

<div id="introScreen">
<h1>☀️ Yıldız Oluştur</h1>
<p>Hidrojen + Helyum kullanarak yıldız oluştur</p>
<button class="startBtn" onclick="startGame()">Başla</button>
</div>

<div class="game">

<div class="header">
<div onclick="goBack()">← Geri</div>
<div>PRO</div>
</div>

<div class="score">Skor: <span id="score">0</span></div>

<div class="play">

<div id="core" class="core">Çekirdek</div>

<div class="bars">
<div>Basınç</div>
<div class="bar"><div id="pressure" class="fill"></div></div>
<div>Sıcaklık</div>
<div class="bar"><div id="temp" class="fill"></div></div>
</div>

<div class="elements">
<div class="element" data="H"><span>⚪</span>Hidrojen</div>
<div class="element" data="He"><span>🟡</span>Helyum</div>
<div class="element" data="O"><span>🔵</span>Oksijen</div>
<div class="element" data="C"><span>⚫</span>Karbon</div>
<div class="element" data="Fe"><span>🟤</span>Demir</div>
<div class="element" data="N"><span>🟢</span>Azot</div>
<div class="element" data="Au"><span>🟠</span>Altın</div>
<div class="element" data="Hg"><span>⚙️</span>Cıva</div>
<div class="element" data="Cl"><span>🧪</span>Klor</div>
</div>

</div>

<div class="footer">
<button class="fusionBtn" onclick="fusion()">Füzyon</button>
<button class="resetBtn" onclick="resetGame()">Temizle</button>
<button class="hintBtn" onclick="useHint()">İpucu</button>
</div>

</div>

<script>

/* INTRO */
function startGame(){
document.getElementById("introScreen").style.display="none";
}

/* BG */
const c=document.getElementById("bg");
const ctx=c.getContext("2d");
c.width=innerWidth;c.height=innerHeight;

let stars=Array.from({length:250},()=>({
x:Math.random()*c.width,
y:Math.random()*c.height,
r:Math.random()*1.5,
speed:Math.random()*0.4
}));

function draw(){
ctx.fillStyle="#020617";
ctx.fillRect(0,0,c.width,c.height);

stars.forEach(s=>{
s.y+=s.speed;
if(s.y>c.height)s.y=0;

ctx.globalAlpha=0.5+Math.random()*0.5;
ctx.beginPath();
ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
ctx.fillStyle="#fff";
ctx.fill();
});

requestAnimationFrame(draw);
}
draw();

/* STATE */
let selected=new Set();
let hintUsed=false;
let dragItem=null;

/* SOUND */
function sound(f){
let a=new (window.AudioContext||window.webkitAudioContext)();
let o=a.createOscillator();
o.frequency.value=f;
o.connect(a.destination);
o.start();
setTimeout(()=>o.stop(),100);
}

/* DRAG FIX */
document.querySelectorAll(".element").forEach(el=>{
el.addEventListener("touchstart",()=>{dragItem=el.getAttribute("data");});
el.addEventListener("mousedown",()=>{dragItem=el.getAttribute("data");});
});

document.addEventListener("touchend",handleDrop);
document.addEventListener("mouseup",handleDrop);

function handleDrop(e){
if(!dragItem)return;

let core=document.getElementById("core");
let rect=core.getBoundingClientRect();

let x=e.changedTouches?e.changedTouches[0].clientX:e.clientX;
let y=e.changedTouches?e.changedTouches[0].clientY:e.clientY;

if(x>rect.left && x<rect.right && y>rect.top && y<rect.bottom){
selected.add(dragItem);
sound(500);
}

dragItem=null;
}

/* FUSION */
function fusion(){
let core=document.getElementById("core");
if(selected.has("H")&&selected.has("He")){
core.classList.add("fusion");
core.innerHTML="☀️ Yıldız!";
}else{
core.innerHTML="💥 Çöküş";
}
}

/* RESET */
function resetGame(){
selected.clear();
document.getElementById("core").innerHTML="Çekirdek";
}

/* HINT */
function useHint(){
if(hintUsed)return alert("İpucu bitti");
hintUsed=true;
alert("Hidrojen + Helyum");
}

function goBack(){
if(history.length > 1){
history.back();
}else{
window.location.href = "online-oyunlar.html"; // fallback
}
}



</script>

</body>
</html>
