<!DOCTYPE html>
<html lang="tr" class="no-js">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>İlanlar | Bahçelievler Forum</title>

<!-- SEO -->
<meta name="description" content="Bahçelievler Forum ilanlar sayfası. 2. el, emlak, vasıta ve elektronik ilanları keşfedin.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://site.com/ilanlar">
<meta name="theme-color" content="#ffffff">

<!-- Open Graph -->
<meta property="og:title" content="Bahçelievler Forum İlanlar">
<meta property="og:description" content="Bahçelievler bölgesindeki ilanları incele ve ilan ver.">
<meta property="og:type" content="website">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/ilanlar.css">

</head>

<body>

<div id="globalHeader"></div> 

<div class="page-wrapper">

<main id="mainContent">

<section class="quick-grid">
  <div class="quick-card"><i class="fas fa-layer-group"></i><span>Kategori</span></div>
  <div class="quick-card"><i class="fas fa-location-dot"></i><span>Mahalle</span></div>
  <div class="quick-card"><i class="fas fa-filter"></i><span>Filtre</span></div>
</section>

<section style="margin:var(--space-md); text-align:center;">
  <button id="openAdModal" class="quick-card" style="width:100%; font-size:15px;">
    <i class="fas fa-plus"></i><span>İlan Ver</span>
  </button>
</section>

<section>
<div class="ads-grid" id="adsGrid"></div>
</section>

</main>
</div>

<div id="adModal" class="ad-modal">
  <div class="ad-modal-content">

    <div class="ad-modal-header">
      <span id="closeAdModal">✕</span>
      <span>Yeni İlan</span>
    </div>

    <input type="text" id="adTitle" placeholder="İlan Başlığı (min 3 - max 50)">
    <input type="text" id="adPrice" inputmode="numeric" placeholder="Fiyat (TL)">

    <select id="adCategory">
      <option value="">Kategori</option>
      <option>Elektronik</option>
      <option>Vasıta</option>
      <option>Emlak</option>
    </select>

    <select id="adDistrict">
      <option value="">Mahalle</option>
      <option>Zafer Mah.</option>
      <option>Şirinevler</option>
    </select>

    <select id="adCondition">
      <option value="">Durum</option>
      <option>2. El</option>
      <option>Yeni</option>
    </select>

    <textarea id="adDesc" placeholder="Açıklama (max 500 karakter)"></textarea>

    <input type="file" id="adImages" multiple>

    <input type="text" id="adContact" placeholder="İletişim">

    <input type="password" id="deleteCode" placeholder="Silme Şifresi">

    <button id="submitAdBtn" class="submit-btn">İLANI YAYINLA</button>

  </div>
</div>

<script>

/* SECURITY */
function escapeHTML(str){
  if(!str) return "";
  return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function safeImage(url){
  if(!url) return "https://picsum.photos/300";
  if(url.startsWith("data:")) return url;
  if(url.startsWith("http://") || url.startsWith("https://")) return url;
  return "https://picsum.photos/300";
}

function goDetail(id){
  window.location.href = "ilan_detay.html?id=" + encodeURIComponent(id);
}

/* TIME */
function timeAgo(dateString){
  if(!dateString) return "";
  const d=new Date(dateString);
  if(isNaN(d)) return "";
  const diff=Math.floor((Date.now()-d)/1000);
  if(diff<60) return "Az önce";
  if(diff<3600) return Math.floor(diff/60)+" dk";
  if(diff<86400) return Math.floor(diff/3600)+" sa";
  return Math.floor(diff/86400)+" gün";
}

/* FETCH */
async function fetchWithTimeout(url,opt={},t=8000){
  const c=new AbortController();
  const id=setTimeout(()=>c.abort(),t);
  try{
    const r=await fetch(url,{...opt,signal:c.signal});
    clearTimeout(id);
    return r;
  }catch(e){clearTimeout(id);throw e;}
}
/* LOAD ADS */
async function loadAds(){
  try{
    const res = await fetchWithTimeout(
      "https://bahcelievler-api.erman-urel.workers.dev/api/ilanlar",
      { cache:"no-store" }
    );

    if(!res || !res.ok) return;

    const data = await res.json();
    const grid = document.getElementById("adsGrid");

    if(!grid) return;

    if(!Array.isArray(data) || data.length === 0){
      grid.innerHTML = "<p style='padding:20px'>Henüz ilan yok</p>";
      return;
    }

    let html = "";

    data.slice(0,50).forEach(ad => {

      if(!ad) return;

      let img = safeImage(
        ad.image_url || ad.image_url_2 || ad.image_url_3
      );

      html += `
      <div class="ad-card" onclick="goDetail(${JSON.stringify(ad.id)})">
        <div class="ad-image">
          <img src="${img}" loading="lazy">
          <div class="price-badge">${escapeHTML(String(ad.price || ""))} TL</div>
        </div>
        <div class="ad-body">
          <div class="ad-title">${escapeHTML(ad.title || "")}</div>
          <div class="ad-meta">
            <span>${escapeHTML(ad.district || "")}</span>
            <span>${timeAgo(ad.created_at)}</span>
          </div>
        </div>
      </div>`;
    });

    grid.innerHTML = html;

  }catch(e){
    console.log("LOAD ADS ERROR:", e);
  }
}


/* INIT */
document.addEventListener("DOMContentLoaded",()=>{

  loadAds();

  const modal = document.getElementById("adModal");
  const btn = document.getElementById("submitAdBtn");

  const openBtn = document.getElementById("openAdModal");
  const closeBtn = document.getElementById("closeAdModal");

  if(openBtn && modal){
    openBtn.onclick = ()=> modal.classList.add("active");
  }

  if(closeBtn && modal){
    closeBtn.onclick = ()=> modal.classList.remove("active");
  }

  window.addEventListener("click",(e)=>{
    if(e.target === modal){
      modal.classList.remove("active");
    }
  });

  if(!btn) return;

  btn.onclick = async ()=>{

    if(btn.disabled) return;

    const titleEl = document.getElementById("adTitle");
    const descEl = document.getElementById("adDesc");
    const priceEl = document.getElementById("adPrice");

    if(!titleEl || !descEl || !priceEl){
      alert("Form elemanları eksik");
      return;
    }

    const title = titleEl.value.trim();
    const desc = descEl.value;

    /* 🔥 FİYAT NORMALİZASYON (EN KRİTİK FIX) */
    let rawPrice = priceEl.value.trim();

    rawPrice = rawPrice
      .replace(/\s/g,"")   // boşluk sil
      .replace(/\./g,"")   // 50.000 → 50000
      .replace(",", ".");  // 50,5 → 50.5

    const price = Number(rawPrice);

    /* VALIDATION */
    if(title.length < 3){
      alert("Başlık çok kısa (min 3 karakter)");
      return;
    }

    if(title.length > 50){
      alert("Başlık max 50 karakter");
      return;
    }

    if(!rawPrice || isNaN(price) || price < 50){
      alert("Geçerli fiyat gir (min 50 TL)");
      return;
    }

    if(price > 25000000){
      alert("Fiyat maksimum 25.000.000 TL olabilir");
      return;
    }

    if(desc.length > 500){
      alert("Açıklama çok uzun (max 500 karakter)");
      return;
    }

    const category = document.getElementById("adCategory")?.value;
    const district = document.getElementById("adDistrict")?.value;
    const condition = document.getElementById("adCondition")?.value;
    const contact = document.getElementById("adContact")?.value.trim();
    const deleteCode = document.getElementById("deleteCode")?.value;

    if(!category){
      alert("Kategori seçmelisin");
      return;
    }

    if(!district){
      alert("Mahalle seçmelisin");
      return;
    }

    if(!deleteCode || deleteCode.length < 3){
      alert("Silme şifresi en az 3 karakter olmalı");
      return;
    }

    /* BUTTON STATE */
    btn.disabled = true;
    btn.innerText = "Gönderiliyor...";

    const payload = {
      title,
      price,
      category,
      district,
      condition,
      content: desc.trim(),
      contact,
      delete_token: deleteCode,
      image_url:"",
      image_url_2:"",
      image_url_3:""
    };

    let res;

    try{
      res = await fetchWithTimeout(
        "https://bahcelievler-api.erman-urel.workers.dev/api/ilan-ekle",
        {
          method:"POST",
          headers:{ "Content-Type":"application/json" },
          body: JSON.stringify(payload)
        }
      );
    }catch(e){
      alert("Sunucuya ulaşılamıyor");
      btn.disabled = false;
      btn.innerText = "İLANI YAYINLA";
      return;
    }

    let result;

    try{
      result = await res.json();
    }catch(e){
      alert("Sunucu cevap vermedi");
      btn.disabled = false;
      btn.innerText = "İLANI YAYINLA";
      return;
    }

    if(!res.ok || !result?.ok){
      alert(result?.error || "İlan eklenemedi");
      btn.disabled = false;
      btn.innerText = "İLANI YAYINLA";
      return;
    }

    alert("İlan başarıyla eklendi");
    location.reload();
  };

});

</script>

<script src="assets/js/core.js" defer></script>
<script src="assets/js/news.js" defer></script>
<script src="assets/js/footerLegal.js" defer></script>

<div id="globalFooter"></div>

</body>
</html>
