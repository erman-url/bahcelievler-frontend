<script>

/* ===============================
SECURITY
=============================== */
function escapeHTML(str){
  if(!str) return "";
  return str.replace(/[&<>"']/g, m => ({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[m]));
}

/* 🔥 FIXED IMAGE SYSTEM */
function safeImage(url){

  if(!url) return "";

  if(typeof url !== "string") return "";

  if(url.startsWith("data:")) return url;

  if(url.startsWith("http")) return url;

  return "";
}

function goDetail(id){
  if(!id) return;
  window.location.href = "ilan_detay.html?id=" + encodeURIComponent(id);
}

/* ===============================
TIME
=============================== */
function timeAgo(dateString){
  if(!dateString) return "";
  const d = new Date(dateString);
  if(isNaN(d)) return "";
  const diff = Math.floor((Date.now()-d)/1000);

  if(diff < 60) return "Az önce";
  if(diff < 3600) return Math.floor(diff/60)+" dk";
  if(diff < 86400) return Math.floor(diff/3600)+" sa";
  return Math.floor(diff/86400)+" gün";
}

/* ===============================
FETCH SAFE
=============================== */
async function fetchWithTimeout(url,opt={},t=8000){
  const c = new AbortController();
  const id = setTimeout(()=>c.abort(),t);

  try{
    const r = await fetch(url,{...opt,signal:c.signal});
    clearTimeout(id);
    return r;
  }catch(e){
    clearTimeout(id);
    throw e;
  }
}

/* ===============================
LOAD ADS
=============================== */

let ALL_ADS = [];

async function loadAds(){
  try{
    const res = await fetchWithTimeout(
      "https://bahcelievler-api.erman-urel.workers.dev/api/ilanlar",
      { cache:"no-store" }
    );

    if(!res || !res.ok) return;

    const data = await res.json();
    const grid = document.getElementById("adsGrid");

    if(!grid) return;

    ALL_ADS = Array.isArray(data) ? data : [];

    if(!Array.isArray(data) || data.length === 0){
      grid.innerHTML = "<p style='padding:20px'>Henüz ilan yok</p>";
      return;
    }

    renderAds(data);

  }catch(e){
    console.log("LOAD ADS ERROR:", e);
  }
}

/* ===============================
RENDER (TEK MERKEZ)
=============================== */

function renderAds(data){

  const grid = document.getElementById("adsGrid");
  if(!grid) return;

  if(!Array.isArray(data) || data.length === 0){
    grid.innerHTML = "<p style='padding:20px'>Sonuç bulunamadı</p>";
    return;
  }

  let html = "";

  data.slice(0,50).forEach(ad=>{

    if(!ad) return;

    const img = safeImage(
      ad.image_url || ad.image_url_2 || ad.image_url_3
    );

    console.log("DB IMAGE:", ad.image_url?.slice?.(0,50));

    const premium = Number(ad.price) > 500000 ? 
    `<div style="
      position:absolute;
      top:8px;
      right:8px;
      background:#2563eb;
      color:#fff;
      font-size:10px;
      padding:4px 6px;
      border-radius:6px;
    ">ÖNE ÇIKAN</div>` : "";

    html += `
    <div class="ad-card" onclick="goDetail(${JSON.stringify(ad.id)})">

      <div class="ad-image">
        <img src="${img || 'assets/images/no-image.jpg'}" loading="lazy">

        ${premium}

        <div class="price-badge">
          ${escapeHTML(String(ad.price||""))} TL
        </div>
      </div>

      <div class="ad-body">

        <div class="ad-title">
          ${escapeHTML(ad.title||"")}
        </div>

        <div class="ad-meta">
          <span>${escapeHTML(ad.district||"")}</span>
          <span>${timeAgo(ad.created_at)}</span>
        </div>

      </div>

    </div>`;
  });

  grid.innerHTML = html;
}

/* ===============================
INIT
=============================== */
document.addEventListener("DOMContentLoaded",()=>{

  loadAds();

  const modal = document.getElementById("adModal");
  const btn = document.getElementById("submitAdBtn");

  const openBtn = document.getElementById("openAdModal");
  const closeBtn = document.getElementById("closeAdModal");

  if(openBtn && modal){
    openBtn.onclick = ()=> modal.classList.add("active");
  }

  if(closeBtn && modal){
    closeBtn.onclick = ()=> modal.classList.remove("active");
  }

  window.addEventListener("click",(e)=>{
    if(e.target === modal){
      modal.classList.remove("active");
    }
  });

  if(!btn) return;

/* ===============================
SUBMIT (FULL FIX)
=============================== */
btn.onclick = async ()=>{

  if(btn.disabled) return;

  try{

    const title = document.getElementById("adTitle")?.value.trim();
    const desc = document.getElementById("adDesc")?.value || "";
    const rawInput = document.getElementById("adPrice")?.value || "";

    const category = document.getElementById("adCategory")?.value;
    const district = document.getElementById("adDistrict")?.value;
    const condition = document.getElementById("adCondition")?.value;
    const contact = document.getElementById("adContact")?.value.trim();
    const delete_token = document.getElementById("deleteCode")?.value;

    let rawPrice = rawInput.trim()
      .replace(/\s/g,"")
      .replace(/\./g,"")
      .replace(",", ".");

    const price = Number(rawPrice);

    if(!title || title.length < 3) throw "Başlık kısa";
    if(title.length > 50) throw "Başlık çok uzun";

    if(!rawPrice || isNaN(price) || price < 50)
      throw "Geçerli fiyat gir";

    if(price > 25000000)
      throw "Fiyat çok yüksek";

    if(desc.length > 500)
      throw "Açıklama çok uzun";

    if(!category) throw "Kategori seç";
    if(!district) throw "Mahalle seç";

    if(!delete_token || delete_token.length < 3)
      throw "Şifre min 3 karakter";

    /* 🔥 IMAGE BASE64 + DEBUG */
    const files = document.getElementById("adImages")?.files || [];

    const toBase64 = file => new Promise(res=>{
      if(!file) return res("");

      if(file.size > 2*1024*1024){
        alert("Max 2MB");
        return res("");
      }

      const r = new FileReader();
      r.onload = ()=>res(r.result||"");
      r.onerror = ()=>res("");
      r.readAsDataURL(file);
    });

    let image_url="",image_url_2="",image_url_3="";

    if(files[0]){
      image_url = await toBase64(files[0]);
      console.log("UPLOAD IMG1:", image_url?.slice(0,50));
    }

    if(files[1]){
      image_url_2 = await toBase64(files[1]);
    }

    if(files[2]){
      image_url_3 = await toBase64(files[2]);
    }

    const payload = {
      title,
      price,
      category,
      district,
      condition,
      content: desc.trim(),
      contact,
      delete_token,
      image_url,
      image_url_2,
      image_url_3
    };

    console.log("PAYLOAD:", payload);

    btn.disabled = true;
    btn.innerText = "Gönderiliyor...";

    const res = await fetch(
      "https://bahcelievler-api.erman-urel.workers.dev/api/ilan-ekle",
      {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify(payload)
      }
    );

    const result = await res.json();

    if(!res.ok || !result?.ok){
      throw result?.error || "İlan eklenemedi";
    }

    alert("İlan eklendi");
    location.reload();

  }catch(err){
    console.log("SUBMIT ERROR:", err);
    alert(err);
    btn.disabled = false;
    btn.innerText = "İLANI YAYINLA";
  }

};

});

/* ===============================
FILTER SYSTEM
=============================== */

function toggleFilter(){
  const panel = document.getElementById("filterPanel");
  if(!panel) return;

  panel.style.display =
    panel.style.display === "none" ? "grid" : "none";
}

document.addEventListener("change",(e)=>{
  if(
    e.target.id === "filterCategory" ||
    e.target.id === "filterDistrict"
  ){
    applyFilter();
  }
});

function applyFilter(){

  if(!Array.isArray(ALL_ADS)) return;

  let filtered = [...ALL_ADS];

  const cat = document.getElementById("filterCategory")?.value;
  const dist = document.getElementById("filterDistrict")?.value;

  if(cat){
    filtered = filtered.filter(a => a.category === cat);
  }

  if(dist){
    filtered = filtered.filter(a => a.district === dist);
  }

  renderAds(filtered);
}

function resetFilter(){

  const cat = document.getElementById("filterCategory");
  const dist = document.getElementById("filterDistrict");

  if(cat) cat.value = "";
  if(dist) dist.value = "";

  renderAds(ALL_ADS);
}

</script>
