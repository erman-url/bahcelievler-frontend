<!DOCTYPE html>
<html lang="tr" class="no-js">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>İlanlar | Bahçelievler Forum</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">

<style>

/* SAFE AREA */
body{
  padding-top: env(safe-area-inset-top);
}

/* CONTENT ALT BOŞLUK */
.page-wrapper{
  padding-bottom: calc(120px + env(safe-area-inset-bottom));
}

/* FOOTER SAFE */
#globalFooter{
  padding-bottom: env(safe-area-inset-bottom);
}

/* GRID */
.ads-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:14px;
  padding:var(--space-md);
}

.ad-card{
  background:#fff;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 6px 18px rgba(0,0,0,.06);
  transition:.2s ease;
  cursor:pointer;
}

.ad-card:hover{
  transform:translateY(-4px);
}

.ad-image{
  position:relative;
  width:100%;
  aspect-ratio:1/1;
  overflow:hidden;
}

.ad-image img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.price-badge{
  position:absolute;
  bottom:8px;
  left:8px;
  background:#111827;
  color:white;
  padding:6px 10px;
  border-radius:8px;
  font-size:0.8rem;
  font-weight:700;
}

.ad-body{
  padding:10px;
}

.ad-title{
  font-size:0.85rem;
  font-weight:600;
  margin-bottom:6px;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.ad-meta{
  font-size:0.7rem;
  color:#6b7280;
  display:flex;
  justify-content:space-between;
}

@media(min-width:768px){
  .ads-grid{
    grid-template-columns:repeat(4,1fr);
  }
}

/* ===============================
AD MODAL
=============================== */

.ad-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.5);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.ad-modal.active{
  display:flex;
}

.ad-modal-content{
  width:95%;
  max-width:500px;
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:18px;
  padding:16px;
}

.ad-modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
  font-weight:700;
}

#adModal input,
#adModal select,
#adModal textarea{
  width:100%;
  padding:12px;
  margin-bottom:10px;
  border-radius:10px;
  border:1px solid #ddd;
  font-size:14px;
}

.submit-btn{
  width:100%;
  background:#2563eb;
  color:white;
  border:none;
  padding:14px;
  border-radius:12px;
  font-weight:700;
}

</style>

</head>

<body>

<div id="globalHeader"></div> 

<div class="page-wrapper">

<main id="mainContent">

<!-- FİLTRE -->
<section class="quick-grid">
  <div class="quick-card">
    <i class="fas fa-layer-group"></i>
    <span>Kategori</span>
  </div>

  <div class="quick-card">
    <i class="fas fa-location-dot"></i>
    <span>Mahalle</span>
  </div>

  <div class="quick-card">
    <i class="fas fa-filter"></i>
    <span>Filtre</span>
  </div>
</section>

<!-- İLAN VER -->
<section style="margin:var(--space-md); text-align:center;">
  <button id="openAdModal" class="quick-card" style="width:100%; font-size:15px;">
    <i class="fas fa-plus"></i>
    <span>İlan Ver</span>
  </button>
</section>

<!-- VİTRİN -->
<section>
<div class="ads-grid" id="adsGrid">

  <!-- STATİKLER DURUYOR (SİLMEDİM) -->

</div>
</section>

</main>
</div>

<!-- MODAL -->
<div id="adModal" class="ad-modal">
  <div class="ad-modal-content">

    <div class="ad-modal-header">
      <span id="closeAdModal">✕</span>
      <span>Yeni İlan</span>
    </div>

    <input type="text" id="adTitle" placeholder="İlan Başlığı (max 20)">
    <input type="number" id="adPrice" placeholder="Fiyat (TL)">

    <select id="adCategory">
      <option value="">Kategori</option>
      <option>Elektronik</option>
      <option>Vasıta</option>
      <option>Emlak</option>
    </select>

    <select id="adDistrict">
      <option value="">Mahalle</option>
      <option>Zafer Mah.</option>
      <option>Şirinevler</option>
    </select>

    <select id="adCondition">
      <option value="">Durum</option>
      <option>2. El</option>
      <option>Yeni</option>
    </select>

    <textarea id="adDesc" placeholder="Açıklama"></textarea>

    <input type="file" id="adImages" multiple>

    <input type="text" id="adContact" placeholder="İletişim">

    <input type="password" id="deleteCode" placeholder="Silme Şifresi">

    <button id="submitAdBtn" class="submit-btn">İLANI YAYINLA</button>

  </div>
</div>

<script>
function goDetail(id){
  window.location.href = "ilan_detay.html?id=" + id;
}

/* ===============================
SECURITY
=============================== */
function escapeHTML(str){
  if(!str) return "";
  return str.replace(/[&<>"']/g, function(m){
    return {
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[m];
  });
}

/* ===============================
TIME FORMAT
=============================== */
function timeAgo(dateString){
  if(!dateString) return "";

  const date = new Date(dateString);
  if(isNaN(date)) return "";

  const diff = Math.floor((Date.now() - date) / 1000);

  if(diff < 60) return "Az önce";
  if(diff < 3600) return Math.floor(diff/60) + " dk";
  if(diff < 86400) return Math.floor(diff/3600) + " sa";
  return Math.floor(diff/86400) + " gün";
}

/* ===============================
FETCH WITH TIMEOUT
=============================== */
async function fetchWithTimeout(url, options = {}, timeout = 8000){
  const controller = new AbortController();
  const id = setTimeout(() => controller.abort(), timeout);

  try{
    const res = await fetch(url, {
      ...options,
      signal: controller.signal
    });
    clearTimeout(id);
    return res;
  }catch(e){
    clearTimeout(id);
    throw e;
  }
}

/* ===============================
İLANLARI ÇEK + BAS
=============================== */
async function loadAds(){

  try{

    const res = await fetchWithTimeout(
      "https://bahcelievler-api.erman-urel.workers.dev/api/ilanlar",
      { cache:"no-store" }
    );

    if(!res.ok){
      console.log("API hata:", res.status);
      return;
    }

    const data = await res.json();

    const grid = document.getElementById("adsGrid");

    if(!grid){
      console.log("adsGrid bulunamadı");
      return;
    }

    if(!data || data.length === 0){
      grid.innerHTML = "<p style='padding:20px'>Henüz ilan yok</p>";
      return;
    }

    let html = "";

    data.forEach(ad => {

      let img = ad.image_url || ad.image_url_2 || ad.image_url_3;

      if(!img){
        img = "https://picsum.photos/300";
      }else if(!img.startsWith("data:")){
        img = img + "?v=" + ad.id;
      }

      html += `
        <div class="ad-card" onclick="goDetail('${ad.id}')">
          <div class="ad-image">
            <img src="${img}">
            <div class="price-badge">${escapeHTML(String(ad.price || ""))} TL</div>
          </div>
          <div class="ad-body">
            <div class="ad-title">${escapeHTML(ad.title)}</div>
            <div class="ad-meta">
              <span>${escapeHTML(ad.district || '')}</span>
              <span>${timeAgo(ad.created_at)}</span>
            </div>
          </div>
        </div>
      `;
    });

    grid.innerHTML = html;

  }catch(e){
    console.log("İlan yükleme hatası", e);
  }

}

/* ===============================
INIT
=============================== */
document.addEventListener("DOMContentLoaded", () => {

  loadAds();

  const modal = document.getElementById("adModal");
  const openBtn = document.getElementById("openAdModal");
  const closeBtn = document.getElementById("closeAdModal");
  const submitBtn = document.getElementById("submitAdBtn");

  if(openBtn){
    openBtn.onclick = () => modal.classList.add("active");
  }

  if(closeBtn){
    closeBtn.onclick = () => modal.classList.remove("active");
  }

  window.addEventListener("click", (e)=>{
    if(e.target.closest(".ad-modal-content") === null){
      modal.classList.remove("active");
    }
  });

  if(submitBtn){
    submitBtn.onclick = async () => {

      const files = document.getElementById("adImages").files;

      let image_url = "";
      let image_url_2 = "";
      let image_url_3 = "";

      const toBase64 = (file) => new Promise((res, rej)=>{
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = ()=> res(reader.result);
        reader.onerror = rej;
      });

      // SIZE CHECK
      for(let i=0;i<files.length;i++){
        if(files[i].size > 2 * 1024 * 1024){
          alert("Görseller max 2MB olmalı");
          return;
        }
      }

      if(files[0]) image_url = await toBase64(files[0]);
      if(files[1]) image_url_2 = await toBase64(files[1]);
      if(files[2]) image_url_3 = await toBase64(files[2]);

      const title = document.getElementById("adTitle").value.trim();
      const priceRaw = document.getElementById("adPrice").value;
      const price = Number(priceRaw);

      if(!title){
        alert("Başlık zorunlu");
        return;
      }

      if(!price || isNaN(price)){
        alert("Geçerli fiyat gir");
        return;
      }

      const payload = {
        title,
        price,
        category: document.getElementById("adCategory").value,
        district: document.getElementById("adDistrict").value,
        condition: document.getElementById("adCondition").value,
        content: document.getElementById("adDesc").value.trim(),
        contact: document.getElementById("adContact").value.trim(),
        delete_token: document.getElementById("deleteCode").value,
        image_url,
        image_url_2,
        image_url_3
      };

      let res;

      try{
        res = await fetchWithTimeout(
          "https://bahcelievler-api.erman-urel.workers.dev/api/ilan-ekle",
          {
            method:"POST",
            headers:{ "Content-Type":"application/json" },
            body: JSON.stringify(payload)
          }
        );
      }catch(e){
        alert("Sunucuya ulaşılamıyor");
        return;
      }

      let result = null;

      try{
        result = await res.json();
      }catch(e){
        alert("Sunucu cevap vermedi");
        return;
      }

      if(!res.ok){
        alert("İlan eklenemedi (API hata)");
        return;
      }

      if(!result || result.ok !== true){
        alert(result?.error || "İlan kaydedilemedi");
        return;
      }

      alert("İlan başarıyla eklendi");

      location.reload();
    };
  }

});

</script>


<script src="assets/js/core.js" defer></script>
<script src="assets/js/countdown.js" defer></script>
<script src="assets/js/footerLegal.js" defer></script>

<div id="globalFooter"></div>

</body>
</html>
