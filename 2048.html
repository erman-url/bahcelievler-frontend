<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>2048 Oyna | Bahçelievler Forum</title>

<meta name="description" content="2048 oyununu mobilde premium deneyimle oyna. Hızlı, akıcı ve ücretsiz.">
<meta name="robots" content="index, follow">

<!-- OPEN GRAPH -->
<meta property="og:title" content="2048 Oyna">
<meta property="og:description" content="Mobil uyumlu 2048 oyunu">
<meta property="og:type" content="website">

<!-- TWITTER -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="2048 Oyna">
<meta name="twitter:description" content="Mobil uyumlu premium 2048 oyunu">

<style>

/* =========================
ROOT
========================= */
:root{
--bg:#0f172a;
--card:rgba(255,255,255,0.06);
--primary:#2563eb;
--radius:18px;
}

/* =========================
BASE
========================= */
*{box-sizing:border-box;}

body{
margin:0;
font-family:-apple-system,system-ui;
background:linear-gradient(180deg,#0f172a,#020617);
color:white;
height:100vh;
display:flex;
flex-direction:column;
}

/* =========================
HEADER (APP STYLE)
========================= */
.header{
display:flex;
align-items:center;
justify-content:space-between;
padding:14px;
padding-top:calc(14px + env(safe-area-inset-top));
background:rgba(255,255,255,0.05);
backdrop-filter:blur(12px);
font-weight:700;
}

.back{
background:var(--card);
border:none;
color:white;
padding:8px 12px;
border-radius:10px;
}

/* =========================
CONTAINER
========================= */
.container{
flex:1;
display:flex;
flex-direction:column;
max-width:420px;
width:100%;
margin:auto;
padding:14px;
}

/* =========================
SCORE
========================= */
.score-box{
display:flex;
justify-content:space-between;
margin-bottom:12px;
}

.score{
background:var(--card);
padding:10px 14px;
border-radius:12px;
font-weight:700;
backdrop-filter:blur(10px);
}

/* =========================
GRID
========================= */
.grid{
flex:1;
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
padding:10px;
background:var(--card);
border-radius:20px;
backdrop-filter:blur(12px);
}

/* =========================
TILE
========================= */
.tile{
aspect-ratio:1;
display:flex;
align-items:center;
justify-content:center;
font-weight:800;
font-size:22px;
border-radius:14px;
background:rgba(255,255,255,0.08);
transition:.2s;
}

/* COLORS */
.t2{background:#fef3c7;color:#000;}
.t4{background:#fde68a;}
.t8{background:#fbbf24;}
.t16{background:#f59e0b;}
.t32{background:#f97316;}
.t64{background:#ef4444;}
.t128{background:#60a5fa;}
.t256{background:#3b82f6;}
.t512{background:#2563eb;}
.t1024{background:#1d4ed8;}
.t2048{background:#000;}

/* =========================
BUTTON
========================= */
.btn{
margin-top:12px;
padding:14px;
border:none;
border-radius:14px;
background:linear-gradient(135deg,#2563eb,#1d4ed8);
color:white;
font-weight:700;
}

/* =========================
OVERLAY
========================= */
.overlay{
position:fixed;
inset:0;
display:none;
background:rgba(0,0,0,.7);
align-items:center;
justify-content:center;
}

.box{
background:#020617;
padding:24px;
border-radius:20px;
text-align:center;
}

</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
<button class="back" onclick="goBack()">←</button>
<div>2048</div>
<div></div>
</div>

<div class="container">

<div class="score-box">
<div class="score" id="score">0</div>
</div>

<div class="grid" id="grid"></div>

<button class="btn" onclick="init()">Yeniden Başlat</button>

</div>

<div class="overlay" id="over">
<div class="box">
<h3>Oyun Bitti</h3>
<p id="final"></p>
<button class="btn" onclick="init()">Tekrar</button>
</div>
</div>

<script>

/* =========================
STATE
========================= */
let grid = [];
let score = 0;

/* =========================
INIT
========================= */
function init(){
grid = Array(4).fill().map(()=>Array(4).fill(0));
score = 0;
spawn(); spawn();
draw();
document.getElementById("over").style.display="none";
}

/* =========================
SPAWN
========================= */
function spawn(){
let empty=[];
grid.forEach((r,i)=>r.forEach((c,j)=>{if(!c) empty.push([i,j])}));

if(empty.length===0){gameOver();return;}

let [i,j]=empty[Math.floor(Math.random()*empty.length)];
grid[i][j]=Math.random()<0.9?2:4;
}

/* =========================
DRAW
========================= */
function draw(){
const g=document.getElementById("grid");
g.innerHTML="";

grid.forEach(r=>{
r.forEach(c=>{
let d=document.createElement("div");
d.className="tile "+(c?"t"+c:"");
d.textContent=c||"";
g.appendChild(d);
});
});

document.getElementById("score").innerText=score;
}

/* =========================
MOVE
========================= */
function move(dir){

let moved=false;

function slide(row){
let arr=row.filter(v=>v);

for(let i=0;i<arr.length-1;i++){
if(arr[i]===arr[i+1]){
arr[i]*=2;
score+=arr[i];
arr[i+1]=0;
}
}

arr=arr.filter(v=>v);
while(arr.length<4) arr.push(0);
return arr;
}

function rotate(){
grid=grid[0].map((_,i)=>grid.map(r=>r[i]).reverse());
}

if(dir==="up"){rotate();}
if(dir==="right"){rotate();rotate();}
if(dir==="down"){rotate();rotate();rotate();}

for(let i=0;i<4;i++){
let newRow=slide(grid[i]);
if(JSON.stringify(grid[i])!==JSON.stringify(newRow)) moved=true;
grid[i]=newRow;
}

if(dir==="up"){rotate();rotate();rotate();}
if(dir==="right"){rotate();rotate();}
if(dir==="down"){rotate();}

if(moved){
spawn();
draw();
}

}

/* =========================
GAME OVER
========================= */
function gameOver(){
document.getElementById("final").innerText="Skor: "+score;
document.getElementById("over").style.display="flex";
}

/* =========================
INPUT
========================= */
document.addEventListener("keydown",e=>{
if(e.key==="ArrowUp") move("up");
if(e.key==="ArrowDown") move("down");
if(e.key==="ArrowLeft") move("left");
if(e.key==="ArrowRight") move("right");
});

/* =========================
TOUCH (OPTIMIZED)
========================= */
let sx=0,sy=0;

document.addEventListener("touchstart",e=>{
sx=e.touches[0].clientX;
sy=e.touches[0].clientY;
});

document.addEventListener("touchend",e=>{
let dx=e.changedTouches[0].clientX-sx;
let dy=e.changedTouches[0].clientY-sy;

let threshold=40;

if(Math.abs(dx)>Math.abs(dy)){
if(dx>threshold) move("right");
if(dx<-threshold) move("left");
}else{
if(dy>threshold) move("down");
if(dy<-threshold) move("up");
}
});

/* =========================
BACK
========================= */
function goBack(){
if(confirm("Çıkmak istiyor musun?")){
history.back();
}
}

/* START */
init();

</script>

</body>
</html>
