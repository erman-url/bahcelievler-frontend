<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>2048 PRO Oyna | Mobil Uyumlu</title>

<meta name="description" content="2048 oyununu mobilde akıcı ve hızlı şekilde oyna. Seviye sistemi, animasyon ve premium deneyim.">
<meta name="robots" content="index, follow">

<style>
:root{
--bg:#0f172a;
--card:rgba(255,255,255,0.06);
}

*{box-sizing:border-box;}

body{
margin:0;
font-family:-apple-system,system-ui;
background:linear-gradient(180deg,#0f172a,#020617);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
touch-action:none;
}

.app{
width:100%;
max-width:420px;
height:100vh;
max-height:820px;
display:flex;
flex-direction:column;
}

.header{
display:flex;
justify-content:space-between;
padding:12px;
background:rgba(255,255,255,0.05);
}

.container{
flex:1;
display:flex;
flex-direction:column;
padding:12px;
gap:10px;
}

.score{
background:var(--card);
padding:10px;
border-radius:12px;
text-align:center;
}

.grid{
aspect-ratio:1;
display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
padding:8px;
background:var(--card);
border-radius:16px;
position:relative;
overflow:hidden;
}

.tile{
display:flex;
align-items:center;
justify-content:center;
font-weight:800;
font-size:clamp(16px,4vw,22px);
border-radius:10px;
background:rgba(255,255,255,0.08);

/* 🔥 ANİMASYON */
transition:transform .15s ease, opacity .15s ease;
}

.t2{background:#fef3c7;color:#000;}
.t4{background:#fde68a;}
.t8{background:#fbbf24;}
.t16{background:#f59e0b;}
.t32{background:#f97316;}
.t64{background:#ef4444;}
.t128{background:#60a5fa;}
.t256{background:#3b82f6;}
.t512{background:#2563eb;}
.t1024{background:#1d4ed8;}
.t2048{background:#000;}

.btn{
padding:12px;
border:none;
border-radius:12px;
background:linear-gradient(135deg,#2563eb,#1d4ed8);
color:white;
font-weight:700;
}

.overlay{
position:fixed;
inset:0;
display:none;
background:rgba(0,0,0,.7);
align-items:center;
justify-content:center;
}
</style>
</head>

<body>

<!-- 🎧 AUDIO -->
<audio id="bgm" src="assets/audio/touch-clouds.mp3" loop></audio>

<div class="app">

<div class="header">
<button onclick="goBack()">←</button>
<div id="level">Seviye 1</div>
<button onclick="undo()">↩️</button>
</div>

<div class="container">

<div class="score" id="score">0</div>

<div class="grid" id="grid"></div>

<button class="btn" onclick="init()">Yeniden Başlat</button>

</div>

</div>

<div class="overlay" id="over">
<div>
<h3>Oyun Bitti</h3>
<p id="final"></p>
<button onclick="init()">Tekrar</button>
</div>
</div>

<script>

let grid=[],score=0,level=1;
let historyStack=[];

/* AUDIO START (MOBILE FIX) */
let audioStarted=false;
function startAudio(){
if(!audioStarted){
let a=document.getElementById("bgm");
a.volume=0.25;
a.play().catch(()=>{});
audioStarted=true;
}
}
document.addEventListener("touchstart",startAudio,{once:true});

/* INIT */
function init(){
grid=Array(4).fill().map(()=>Array(4).fill(0));
score=0;
level=1;
historyStack=[];
spawn();spawn();
draw();
document.getElementById("over").style.display="none";
}

/* SAVE STATE */
function saveState(){
historyStack.push({
grid: JSON.parse(JSON.stringify(grid)),
score: score
});
if(historyStack.length>20) historyStack.shift();
}

/* UNDO */
function undo(){
if(!historyStack.length) return;

let prev = historyStack.pop();
grid = prev.grid;
score = prev.score;
draw();
}

/* LEVEL */
function updateLevel(){
if(score>500 && level===1) level=2;
if(score>1500 && level===2) level=3;
document.getElementById("level").innerText="Seviye "+level;
}

/* SPAWN */
function spawn(){
let empty=[];
grid.forEach((r,i)=>r.forEach((c,j)=>{if(!c)empty.push([i,j])}));

if(!empty.length){gameOver();return;}

let [i,j]=empty[Math.floor(Math.random()*empty.length)];

if(level===2){
grid[i][j]=Math.random()<0.7?2:4;
}else if(level===3){
grid[i][j]=Math.random()<0.5?2:4;
}else{
grid[i][j]=Math.random()<0.9?2:4;
}
}

/* DRAW */
function draw(){
const g=document.getElementById("grid");
g.innerHTML="";

grid.forEach((r,i)=>{
r.forEach((c,j)=>{
let d=document.createElement("div");
d.className="tile "+(c?"t"+c:"");
d.textContent=c||"";

/* 🔥 ANİMASYON EFFECT */
d.style.transform="scale(1.05)";
setTimeout(()=>d.style.transform="scale(1)",100);

g.appendChild(d);
});
});

document.getElementById("score").innerText=score;
updateLevel();
}

/* MOVE */
function move(dir){

saveState();

let moved=false;

function slide(row){
let arr=row.filter(v=>v);

for(let i=0;i<arr.length-1;i++){
if(arr[i]===arr[i+1]){
arr[i]*=2;

let gain = arr[i];
if(level===3) gain*=1.2;

score+=Math.floor(gain);
arr[i+1]=0;
}
}

arr=arr.filter(v=>v);
while(arr.length<4)arr.push(0);
return arr;
}

function rotate(){
grid=grid[0].map((_,i)=>grid.map(r=>r[i]).reverse());
}

if(dir==="up")rotate();
if(dir==="right"){rotate();rotate();}
if(dir==="down"){rotate();rotate();rotate();}

for(let i=0;i<4;i++){
let newRow=slide(grid[i]);
if(JSON.stringify(grid[i])!==JSON.stringify(newRow))moved=true;
grid[i]=newRow;
}

if(dir==="up"){rotate();rotate();rotate();}
if(dir==="right"){rotate();rotate();}
if(dir==="down")rotate();

if(moved){
navigator.vibrate?.(10);
spawn();
draw();
}
}

/* GAME OVER */
function gameOver(){
document.getElementById("final").innerText="Skor: "+score;
document.getElementById("over").style.display="flex";
}

/* TOUCH */
let sx=0,sy=0,locked=false;

document.addEventListener("touchstart",e=>{
sx=e.touches[0].clientX;
sy=e.touches[0].clientY;
},{passive:true});

document.addEventListener("touchmove",e=>{
if(locked) return;

let dx=e.touches[0].clientX-sx;
let dy=e.touches[0].clientY-sy;

let t=30;

if(Math.abs(dx)>Math.abs(dy)){
if(dx>t){move("right");locked=true;}
if(dx<-t){move("left");locked=true;}
}else{
if(dy>t){move("down");locked=true;}
if(dy<-t){move("up");locked=true;}
}
},{passive:true});

document.addEventListener("touchend",()=>locked=false);

/* KEYBOARD */
document.addEventListener("keydown",e=>{
if(e.key==="ArrowUp")move("up");
if(e.key==="ArrowDown")move("down");
if(e.key==="ArrowLeft")move("left");
if(e.key==="ArrowRight")move("right");
});

/* BACK */
function goBack(){
if(confirm("Çıkmak istiyor musun?"))history.back();
}

init();

</script>

</body>
</html>
