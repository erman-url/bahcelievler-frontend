<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>2048 Oyna | Bahçelievler Forum</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* =========================
🔥 PREMIUM UI
========================= */

body{
margin:0;
font-family:system-ui;
background:radial-gradient(circle at top,#eef2ff,#ffffff);
}

/* HEADER */
.header{
background:#1e3a8a;
color:white;
padding:16px;
text-align:center;
font-weight:700;
}

/* WRAPPER */
.container{
max-width:420px;
margin:auto;
padding:16px;
}

/* SCORE */
.score-box{
display:flex;
justify-content:space-between;
margin-bottom:10px;
}

.score{
background:#2563eb;
color:white;
padding:10px 14px;
border-radius:12px;
font-weight:700;
}

/* GRID */
.grid{
background:#e5e7eb;
padding:10px;
border-radius:20px;
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px;
}

/* TILE */
.tile{
width:100%;
aspect-ratio:1;
display:flex;
align-items:center;
justify-content:center;
font-weight:800;
font-size:22px;
border-radius:14px;
background:#f3f4f6;
transition:.15s;
}

/* COLORS */
.t2{background:#fef3c7;}
.t4{background:#fde68a;}
.t8{background:#fbbf24;}
.t16{background:#f59e0b;color:#fff;}
.t32{background:#f97316;color:#fff;}
.t64{background:#ef4444;color:#fff;}
.t128{background:#60a5fa;color:#fff;}
.t256{background:#3b82f6;color:#fff;}
.t512{background:#2563eb;color:#fff;}
.t1024{background:#1d4ed8;color:#fff;}
.t2048{background:#111827;color:#fff;}

/* BUTTON */
.btn{
margin-top:15px;
width:100%;
padding:12px;
border:none;
border-radius:12px;
background:#2563eb;
color:white;
font-weight:700;
}

/* GAME OVER */
.overlay{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,.6);
display:none;
align-items:center;
justify-content:center;
}

.box{
background:white;
padding:20px;
border-radius:16px;
text-align:center;
}

</style>
</head>

<body>

<div class="header">2048 Oyun</div>

<div class="container">

<div class="score-box">
<div class="score" id="score">Skor: 0</div>
</div>

<div class="grid" id="grid"></div>

<button class="btn" onclick="init()">Yeniden Başlat</button>

</div>

<div class="overlay" id="over">
<div class="box">
<h3>Oyun Bitti</h3>
<p id="final"></p>
<button class="btn" onclick="init()">Tekrar Oyna</button>
</div>
</div>

<script>

let grid = [];
let score = 0;

/* INIT */
function init(){
grid = Array(4).fill().map(()=>Array(4).fill(0));
score = 0;
spawn(); spawn();
draw();
}

/* SPAWN */
function spawn(){
let empty=[];
grid.forEach((r,i)=>r.forEach((c,j)=>{if(!c) empty.push([i,j])}));

if(empty.length===0){gameOver();return;}

let [i,j]=empty[Math.floor(Math.random()*empty.length)];
grid[i][j]=Math.random()<0.9?2:4;
}

/* DRAW */
function draw(){
const g=document.getElementById("grid");
g.innerHTML="";

grid.forEach(r=>{
r.forEach(c=>{
let d=document.createElement("div");
d.className="tile "+(c?"t"+c:"");
d.textContent=c||"";
g.appendChild(d);
});
});

document.getElementById("score").innerText="Skor: "+score;
}

/* MOVE */
function move(dir){
let moved=false;

function slide(row){
let arr=row.filter(v=>v);

for(let i=0;i<arr.length-1;i++){
if(arr[i]===arr[i+1]){
arr[i]*=2;
score+=arr[i];
arr[i+1]=0;
}
}

arr=arr.filter(v=>v);
while(arr.length<4) arr.push(0);
return arr;
}

function rotate(){
grid=grid[0].map((_,i)=>grid.map(r=>r[i]).reverse());
}

if(dir==="up"){rotate();}
if(dir==="right"){rotate();rotate();}
if(dir==="down"){rotate();rotate();rotate();}

for(let i=0;i<4;i++){
let newRow=slide(grid[i]);
if(JSON.stringify(grid[i])!==JSON.stringify(newRow)) moved=true;
grid[i]=newRow;
}

if(dir==="up"){rotate();rotate();rotate();}
if(dir==="right"){rotate();rotate();}
if(dir==="down"){rotate();}

if(moved){
spawn();
draw();
}
}

/* GAME OVER */
function gameOver(){
document.getElementById("final").innerText="Skor: "+score;
document.getElementById("over").style.display="flex";
}

/* INPUT */
document.addEventListener("keydown",e=>{
if(e.key==="ArrowUp") move("up");
if(e.key==="ArrowDown") move("down");
if(e.key==="ArrowLeft") move("left");
if(e.key==="ArrowRight") move("right");
});

/* TOUCH */
let sx=0,sy=0;

document.addEventListener("touchstart",e=>{
sx=e.touches[0].clientX;
sy=e.touches[0].clientY;
});

document.addEventListener("touchend",e=>{
let dx=e.changedTouches[0].clientX-sx;
let dy=e.changedTouches[0].clientY-sy;

if(Math.abs(dx)>Math.abs(dy)){
if(dx>30) move("right");
if(dx<-30) move("left");
}else{
if(dy>30) move("down");
if(dy<-30) move("up");
}
});

/* START */
init();

</script>

</body>
</html>
