<style>

/* =========================
ROOT
========================= */
:root{
--bg:#0f172a;
--card:rgba(255,255,255,0.06);
--primary:#2563eb;
}

/* =========================
BASE
========================= */
*{box-sizing:border-box;}

body{
margin:0;
font-family:-apple-system,system-ui;
background:linear-gradient(180deg,#0f172a,#020617);
color:white;

/* 🔥 TAM ORTALAMA */
display:flex;
justify-content:center;
align-items:center;

height:100vh;
overflow:hidden;
}

/* =========================
APP WRAPPER (KRİTİK)
========================= */
.app{
width:100%;
max-width:420px;

/* 🔥 responsive height */
height:100vh;
max-height:820px;

display:flex;
flex-direction:column;
}

/* =========================
HEADER
========================= */
.header{
display:flex;
align-items:center;
justify-content:space-between;
padding:12px;
padding-top:calc(12px + env(safe-area-inset-top));
background:rgba(255,255,255,0.05);
backdrop-filter:blur(12px);
}

.back{
background:var(--card);
border:none;
color:white;
padding:8px 12px;
border-radius:10px;
}

/* =========================
CONTENT
========================= */
.container{
flex:1;
display:flex;
flex-direction:column;
padding:12px;
gap:10px;
}

/* =========================
SCORE
========================= */
.score{
background:var(--card);
padding:10px;
border-radius:12px;
text-align:center;
}

/* =========================
GRID (EN KRİTİK FIX)
========================= */
.grid{
width:100%;

/* 🔥 TAM ORAN KORUMA */
aspect-ratio:1;

display:grid;
grid-template-columns:repeat(4,1fr);
gap:8px;
padding:8px;

background:var(--card);
border-radius:16px;
}

/* =========================
TILE (responsive font)
========================= */
.tile{
display:flex;
align-items:center;
justify-content:center;

font-weight:800;

/* 🔥 FONT OTOMATİK */
font-size:clamp(16px,4vw,22px);

border-radius:10px;
background:rgba(255,255,255,0.08);
}

/* COLORS */
.t2{background:#fef3c7;color:#000;}
.t4{background:#fde68a;}
.t8{background:#fbbf24;}
.t16{background:#f59e0b;}
.t32{background:#f97316;}
.t64{background:#ef4444;}
.t128{background:#60a5fa;}
.t256{background:#3b82f6;}
.t512{background:#2563eb;}
.t1024{background:#1d4ed8;}
.t2048{background:#000;}

/* =========================
BUTTON
========================= */
.btn{
padding:12px;
border:none;
border-radius:12px;
background:linear-gradient(135deg,#2563eb,#1d4ed8);
color:white;
font-weight:700;
}

/* =========================
OVERLAY
========================= */
.overlay{
position:fixed;
inset:0;
display:none;
background:rgba(0,0,0,.7);
align-items:center;
justify-content:center;
}

.box{
background:#020617;
padding:20px;
border-radius:16px;
}

</style>
</head>

<body>

<div class="app">

<div class="header">
<button class="back" onclick="goBack()">←</button>
<div>2048</div>
<div></div>
</div>

<div class="container">

<div class="score" id="score">0</div>

<div class="grid" id="grid"></div>

<button class="btn" onclick="init()">Yeniden Başlat</button>

</div>

</div>

<div class="overlay" id="over">
<div class="box">
<h3>Oyun Bitti</h3>
<p id="final"></p>
<button class="btn" onclick="init()">Tekrar</button>
</div>
</div>

<script>

let grid=[],score=0;

/* INIT */
function init(){
grid=Array(4).fill().map(()=>Array(4).fill(0));
score=0;
spawn();spawn();
draw();
document.getElementById("over").style.display="none";
}

/* SPAWN */
function spawn(){
let empty=[];
grid.forEach((r,i)=>r.forEach((c,j)=>{if(!c)empty.push([i,j])}));

if(!empty.length){gameOver();return;}

let [i,j]=empty[Math.floor(Math.random()*empty.length)];
grid[i][j]=Math.random()<0.9?2:4;
}

/* DRAW */
function draw(){
const g=document.getElementById("grid");
g.innerHTML="";

grid.forEach(r=>{
r.forEach(c=>{
let d=document.createElement("div");
d.className="tile "+(c?"t"+c:"");
d.textContent=c||"";
g.appendChild(d);
});
});

document.getElementById("score").innerText=score;
}

/* MOVE */
function move(dir){

let moved=false;

function slide(row){
let arr=row.filter(v=>v);

for(let i=0;i<arr.length-1;i++){
if(arr[i]===arr[i+1]){
arr[i]*=2;
score+=arr[i];
arr[i+1]=0;
}
}

arr=arr.filter(v=>v);
while(arr.length<4)arr.push(0);
return arr;
}

function rotate(){
grid=grid[0].map((_,i)=>grid.map(r=>r[i]).reverse());
}

if(dir==="up")rotate();
if(dir==="right"){rotate();rotate();}
if(dir==="down"){rotate();rotate();rotate();}

for(let i=0;i<4;i++){
let newRow=slide(grid[i]);
if(JSON.stringify(grid[i])!==JSON.stringify(newRow))moved=true;
grid[i]=newRow;
}

if(dir==="up"){rotate();rotate();rotate();}
if(dir==="right"){rotate();rotate();}
if(dir==="down")rotate();

if(moved){
spawn();
draw();
}
}

/* GAME OVER */
function gameOver(){
document.getElementById("final").innerText="Skor: "+score;
document.getElementById("over").style.display="flex";
}

/* INPUT */
document.addEventListener("keydown",e=>{
if(e.key==="ArrowUp")move("up");
if(e.key==="ArrowDown")move("down");
if(e.key==="ArrowLeft")move("left");
if(e.key==="ArrowRight")move("right");
});

/* TOUCH (OPTİMUM) */
let sx=0,sy=0;

document.addEventListener("touchstart",e=>{
sx=e.touches[0].clientX;
sy=e.touches[0].clientY;
});

document.addEventListener("touchend",e=>{
let dx=e.changedTouches[0].clientX-sx;
let dy=e.changedTouches[0].clientY-sy;

let t=40;

if(Math.abs(dx)>Math.abs(dy)){
if(dx>t)move("right");
if(dx<-t)move("left");
}else{
if(dy>t)move("down");
if(dy<-t)move("up");
}
});

/* BACK */
function goBack(){
if(confirm("Çıkmak istiyor musun?"))history.back();
}

init();

</script>

</body>
</html>
