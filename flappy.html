<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Flappy Pro X</title>

<style>

/* =========================
GLOBAL
========================= */
body{
margin:0;
font-family:-apple-system,system-ui;
background:#0f172a;
color:white;
overflow:hidden;
}

/* =========================
HUD (GLASS)
========================= */
.hud{
position:fixed;
top:0;
left:0;
right:0;
display:flex;
justify-content:space-between;
padding:12px;
backdrop-filter:blur(12px);
background:rgba(255,255,255,0.05);
z-index:10;
font-weight:700;
}

/* =========================
BUTTONS
========================= */
.controls{
position:fixed;
bottom:0;
left:0;
right:0;
display:flex;
gap:10px;
padding:12px;
background:rgba(0,0,0,0.4);
backdrop-filter:blur(10px);
}

.btn{
flex:1;
padding:12px;
border:none;
border-radius:16px;
background:linear-gradient(135deg,#2563eb,#1d4ed8);
color:white;
font-weight:700;
box-shadow:0 6px 20px rgba(0,0,0,.4);
}

/* =========================
CANVAS
========================= */
canvas{
display:block;
margin:auto;
background:linear-gradient(#60a5fa,#dbeafe);
}

/* =========================
OVERLAY
========================= */
.overlay{
position:fixed;
inset:0;
display:none;
background:rgba(0,0,0,.7);
align-items:center;
justify-content:center;
}

.box{
background:linear-gradient(135deg,#1e293b,#020617);
padding:24px;
border-radius:20px;
text-align:center;
box-shadow:0 20px 60px rgba(0,0,0,.6);
}

</style>
</head>

<body>

<div class="hud">
<div id="score">0</div>
<div id="time">0s</div>
<div id="lives">❤️ 3</div>
</div>

<div class="controls">
<button class="btn" onclick="togglePause()" id="pauseBtn">⏸</button>
<button class="btn" onclick="goBack()">🔙</button>
</div>

<canvas id="game" width="360" height="520"></canvas>

<div class="overlay" id="over">
<div class="box">
<h2 id="result"></h2>
<p id="final"></p>
<button onclick="init()">Tekrar</button>
</div>
</div>

<script>

const c = document.getElementById("game");
const ctx = c.getContext("2d");

/* =========================
STATE
========================= */
let bird, pipes, score, lives, speed, gap, startTime, gameOver;
let paused=false, animationId;

/* =========================
INIT
========================= */
function init(){

bird = { y:250, vy:0, rot:0 };
pipes = [];

score=0;
lives=3;

speed=2;
gap=170;

startTime=Date.now();
gameOver=false;
paused=false;

document.getElementById("over").style.display="none";

spawn();

if(animationId) cancelAnimationFrame(animationId);
loop();
}

/* =========================
SPAWN
========================= */
function spawn(){
pipes.push({
x:360,
top:Math.random()*200+80,
passed:false
});
}

/* =========================
DRAW BIRD (PRO)
========================= */
function drawBird(){

ctx.save();
ctx.translate(80,bird.y);
ctx.rotate(bird.rot);

/* body */
ctx.fillStyle="#facc15";
ctx.beginPath();
ctx.arc(0,0,12,0,Math.PI*2);
ctx.fill();

/* eye */
ctx.fillStyle="#000";
ctx.beginPath();
ctx.arc(4,-3,2,0,Math.PI*2);
ctx.fill();

/* wing */
ctx.fillStyle="#f59e0b";
ctx.fillRect(-6,0,8,4);

ctx.restore();
}

/* =========================
DRAW
========================= */
function draw(){

ctx.clearRect(0,0,360,520);

/* pipes */
ctx.fillStyle="#16a34a";
pipes.forEach(p=>{
ctx.fillRect(p.x,0,40,p.top);
ctx.fillRect(p.x,p.top+gap,40,520);
});

/* bird */
drawBird();

}

/* =========================
UPDATE
========================= */
function update(){

bird.vy += 0.32;
bird.y += bird.vy;

/* rotation */
bird.rot = Math.min(Math.max(bird.vy*0.04,-0.4),0.6);

/* difficulty scaling */
let elapsed = (Date.now()-startTime)/1000;
speed = 1.4 + elapsed*0.035;

pipes.forEach((p,i)=>{
p.x -= speed;

/* collision */
if(p.x<95 && p.x>60 &&
(bird.y<p.top || bird.y>p.top+gap)){
hit();
}

/* score */
if(!p.passed && p.x<60){
p.passed=true;
score++;
}

/* recycle */
if(p.x<-40){
pipes.splice(i,1);
spawn();
}
});

}

/* =========================
HIT
========================= */
function hit(){

if(navigator.vibrate) navigator.vibrate(100);

lives--;

if(lives<=0){
end();
return;
}

bird.y=250;
bird.vy=0;
pipes=[];
spawn();
}

/* =========================
END
========================= */
function end(){

gameOver=true;

document.getElementById("over").style.display="flex";
document.getElementById("result").innerText="Game Over";
document.getElementById("final").innerText="Skor: "+score;

}

/* =========================
LOOP
========================= */
function loop(){

if(gameOver) return;

if(!paused){
update();
draw();

document.getElementById("score").innerText=score;
document.getElementById("lives").innerText="❤️ "+lives;
document.getElementById("time").innerText=Math.floor((Date.now()-startTime)/1000)+"s";
}

animationId=requestAnimationFrame(loop);
}

/* =========================
INPUT
========================= */
let lastFlap = 0;

function flap(){

if(paused || gameOver) return;

let now = Date.now();

/* spam engelle */
if(now - lastFlap < 120) return;
lastFlap = now;

/* kontrollü zıplama */
bird.vy = -6;

/* üst limite çarpınca yumuşat */
if(bird.y < 60){
bird.vy = -4;
}

}

c.addEventListener("click",flap);
c.addEventListener("touchstart",flap);
document.addEventListener("keydown",e=>{
if(e.code==="Space")flap();
});

/* =========================
PAUSE
========================= */
function togglePause(){
paused=!paused;
document.getElementById("pauseBtn").innerText = paused ? "▶️" : "⏸";
}

/* =========================
BACK
========================= */
function goBack(){
if(confirm("Çıkmak istiyor musun?")) history.back();
}

init();

</script>

</body>
</html>
