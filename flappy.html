<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Flappy Bird | Bahçelievler Forum</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* =========================
🔥 PREMIUM UI
========================= */

body{
margin:0;
font-family:system-ui;
background:radial-gradient(circle at top,#dbeafe,#ffffff);
overflow:hidden;
}

/* HEADER */
.header{
background:#1e3a8a;
color:white;
padding:14px;
text-align:center;
font-weight:700;
}

/* HUD */
.hud{
display:flex;
justify-content:space-between;
padding:10px 16px;
font-weight:700;
}

/* CANVAS */
canvas{
display:block;
margin:auto;
border-radius:20px;
background:linear-gradient(180deg,#dbeafe,#eff6ff);
box-shadow:0 20px 60px rgba(0,0,0,.2);
}

/* BUTTON */
.btn{
margin:10px auto;
display:block;
padding:12px 20px;
border:none;
border-radius:12px;
background:#2563eb;
color:white;
font-weight:700;
}

/* OVERLAY */
.overlay{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,.6);
display:none;
align-items:center;
justify-content:center;
}

.box{
background:white;
padding:24px;
border-radius:18px;
text-align:center;
width:260px;
}

.box h3{
color:#2563eb;
}

</style>
</head>

<body>

<div class="header">Flappy Bird</div>

<div class="hud">
<div id="score">Skor: 0</div>
<div id="time">Süre: 0s</div>
<div id="lives">❤️ 3</div>
</div>

<canvas id="game" width="360" height="520"></canvas>

<button class="btn" onclick="restart()">Yeniden Başlat</button>

<div class="overlay" id="overlay">
<div class="box">
<h3 id="result"></h3>
<p id="finalScore"></p>
<button class="btn" onclick="restart()">Tekrar Oyna</button>
</div>
</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

/* STATE */
let bird, pipes, score, lives, speed, gap, gameOverFlag, startTime;

/* INIT */
function init(){

bird = { y:250, vy:0 };

pipes = [];

score = 0;
lives = 3;

speed = 2.2;
gap = 150;

gameOverFlag = false;

startTime = Date.now();

spawnPipe();

updateHUD();

loop();
}

/* PIPE */
function spawnPipe(){

let min = 80;
let max = 300;

let top = Math.random()*(max-min)+min;

/* ADİLİK (asla kapalı olmaz) */
if(top < 100) top = 100;
if(top > 260) top = 260;

pipes.push({
x:360,
top:top,
passed:false
});
}

/* DRAW */
function draw(){

ctx.clearRect(0,0,360,520);

/* bird */
ctx.fillStyle="#2563eb";
ctx.beginPath();
ctx.arc(80,bird.y,14,0,Math.PI*2);
ctx.fill();

/* pipes */
ctx.fillStyle="#16a34a";

pipes.forEach(p=>{
ctx.fillRect(p.x,0,40,p.top);
ctx.fillRect(p.x,p.top+gap,40,520);
});

}

/* UPDATE */
function update(){

bird.vy += 0.5;
bird.y += bird.vy;

/* zemin */
if(bird.y > 500){
loseLife();
}

/* pipes */
for(let i=pipes.length-1;i>=0;i--){

let p = pipes[i];
p.x -= speed;

/* çarpışma */
if(
p.x < 95 && p.x > 60 &&
(bird.y < p.top || bird.y > p.top + gap)
){
loseLife();
}

/* skor */
if(!p.passed && p.x < 60){
p.passed = true;
score++;
increaseDifficulty();
}

/* yeni boru */
if(p.x < -40){
pipes.splice(i,1);
spawnPipe();
}
}

}

/* ZORLUK ARTIR */
function increaseDifficulty(){

if(score % 5 === 0){
speed += 0.3;
gap -= 5;
if(gap < 110) gap = 110;
}

}

/* CAN KAYBI */
function loseLife(){

if(gameOverFlag) return;

lives--;

if(lives <= 0){
endGame(false);
return;
}

/* reset */
bird.y = 250;
bird.vy = 0;
pipes = [];
spawnPipe();

}

/* KAZANMA */
function checkWin(){

if(score >= 20){
endGame(true);
}

}

/* END */
function endGame(win){

gameOverFlag = true;

document.getElementById("overlay").style.display="flex";

document.getElementById("result").innerText =
win ? "🎉 Kazandın!" : "💀 Oyun Bitti";

document.getElementById("finalScore").innerText =
"Skor: "+score;

}

/* LOOP */
function loop(){

if(gameOverFlag) return;

update();
draw();
updateHUD();
checkWin();

requestAnimationFrame(loop);
}

/* INPUT */
function flap(){
bird.vy = -8;
}

canvas.addEventListener("touchstart", flap);
canvas.addEventListener("click", flap);

document.addEventListener("keydown",e=>{
if(e.code==="Space") flap();
});

/* HUD */
function updateHUD(){
document.getElementById("score").innerText="Skor: "+score;
document.getElementById("lives").innerText="❤️ "+lives;

let t = Math.floor((Date.now()-startTime)/1000);
document.getElementById("time").innerText="Süre: "+t+"s";
}

/* RESTART */
function restart(){
document.getElementById("overlay").style.display="none";
init();
}

/* START */
init();

</script>

</body>
</html>
