<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Sky Glide PRO</title>

<style>
body{
margin:0;
font-family:-apple-system,system-ui;
background:#020617;
color:white;
overflow:hidden;
}

.hud{
position:fixed;
top:0;
left:0;
right:0;
display:flex;
justify-content:space-between;
padding:env(safe-area-inset-top,12px) 12px 12px;
backdrop-filter:blur(14px);
background:rgba(255,255,255,0.04);
z-index:10;
font-weight:700;
}

.controls{
position:fixed;
bottom:0;
left:0;
right:0;
display:flex;
gap:10px;
padding:12px;
padding-bottom:calc(env(safe-area-inset-bottom,0px)+12px);
background:rgba(0,0,0,0.35);
backdrop-filter:blur(10px);
}

.btn{
flex:1;
padding:14px;
border:none;
border-radius:18px;
background:linear-gradient(135deg,#2563eb,#1e40af);
color:white;
font-weight:700;
box-shadow:0 8px 24px rgba(0,0,0,.5);
}

canvas{
display:block;
margin:auto;
width:100vw;
height:100vh;
background:linear-gradient(#38bdf8,#e0f2fe);
}

.overlay{
position:fixed;
inset:0;
display:none;
background:rgba(0,0,0,.75);
align-items:center;
justify-content:center;
}

.box{
background:linear-gradient(135deg,#020617,#0f172a);
padding:28px;
border-radius:22px;
text-align:center;
box-shadow:0 30px 80px rgba(0,0,0,.7);
}
</style>
</head>

<body>

<div class="hud">
<div id="score">0</div>
<div id="time">0s</div>
<div id="lives">❤️ 3</div>
</div>

<div class="controls">
<button class="btn" onclick="togglePause()" id="pauseBtn">⏸</button>
<button class="btn" onclick="goBack()">🔙</button>
</div>

<canvas id="game"></canvas>

<div class="overlay" id="over">
<div class="box">
<h2 id="result"></h2>
<p id="final"></p>
<button onclick="init()">Tekrar</button>
</div>
</div>

<script>

const c = document.getElementById("game");
const ctx = c.getContext("2d");

/* RESPONSIVE */
function resize(){
c.width = window.innerWidth;
c.height = window.innerHeight;
}
window.addEventListener("resize", resize);
resize();

/* STATE */
let bird, pipes, score, lives, speed, gap, startTime, gameOver;
let paused=false, animationId;

/* WEATHER */
let weather="clear";
let weatherTimer=0;
let weatherDuration=0;
let particles=[];

/* INIT */
function init(){
bird = { y:c.height/2, vy:0, rot:0, wing:0 };
pipes = [];

score=0;
lives=3;

speed=2;
gap=180;

startTime=Date.now();
gameOver=false;
paused=false;

particles=[];
setWeather();

document.getElementById("over").style.display="none";

spawn();
cancelAnimationFrame(animationId);
loop();
}

/* WEATHER SYSTEM */
function setWeather(){

const types=["clear","rain","snow"];
weather = types[Math.floor(Math.random()*types.length)];

weatherDuration = 5000 + Math.random()*7000;
weatherTimer = Date.now();

particles=[];
}

/* SPAWN */
function spawn(){
pipes.push({
x:c.width,
top:Math.random()* (c.height*0.4) + 80,
passed:false
});
}

/* BIRD */
function drawBird(){

bird.wing += 0.2;

ctx.save();
ctx.translate(80,bird.y);
ctx.rotate(bird.rot);

ctx.fillStyle="#facc15";
ctx.beginPath();
ctx.ellipse(0,0,14,10,0,0,Math.PI*2);
ctx.fill();

ctx.fillStyle="#f59e0b";
ctx.beginPath();
ctx.ellipse(-4, Math.sin(bird.wing)*4, 8,4,0,0,Math.PI*2);
ctx.fill();

ctx.fillStyle="#000";
ctx.beginPath();
ctx.arc(5,-2,2,0,Math.PI*2);
ctx.fill();

ctx.fillStyle="#fb923c";
ctx.beginPath();
ctx.moveTo(12,0);
ctx.lineTo(18,2);
ctx.lineTo(12,4);
ctx.fill();

ctx.restore();
}

/* WEATHER DRAW */
function drawWeather(){

if(weather==="rain"){
ctx.strokeStyle="rgba(255,255,255,0.6)";
particles.push({
x:Math.random()*c.width,
y:0,
vy:6+Math.random()*4
});
}

if(weather==="snow"){
ctx.fillStyle="rgba(255,255,255,0.8)";
particles.push({
x:Math.random()*c.width,
y:0,
vy:1+Math.random()*2
});
}

particles.forEach((p,i)=>{

p.y += p.vy;

if(weather==="rain"){
ctx.beginPath();
ctx.moveTo(p.x,p.y);
ctx.lineTo(p.x,p.y+10);
ctx.stroke();
}else{
ctx.beginPath();
ctx.arc(p.x,p.y,2,0,Math.PI*2);
ctx.fill();
}

if(p.y > c.height) particles.splice(i,1);

});
}

/* DRAW */
function draw(){

ctx.clearRect(0,0,c.width,c.height);

ctx.fillStyle="#16a34a";
pipes.forEach(p=>{
ctx.fillRect(p.x,0,50,p.top);
ctx.fillRect(p.x,p.top+gap,50,c.height);
});

drawBird();
drawWeather();
}

/* UPDATE */
function update(){

bird.vy += 0.45;
bird.y += bird.vy;

bird.rot = Math.min(Math.max(bird.vy*0.05,-0.5),0.8);

/* SMOOTH DIFFICULTY */
let elapsed = (Date.now()-startTime)/1000;

if(elapsed < 30){
speed = 1.8;
}else{
let t = elapsed - 30;
speed = 1.8 + (1 - Math.exp(-t/20)) * 2; // smooth curve
}

/* WEATHER CHANGE */
if(Date.now() - weatherTimer > weatherDuration){
setWeather();
}

pipes.forEach((p,i)=>{

p.x -= speed;

if(p.x < 120 && p.x > 60 &&
(bird.y < p.top || bird.y > p.top+gap)){
hit();
}

if(!p.passed && p.x<60){
p.passed=true;
score++;
}

if(p.x < -60){
pipes.splice(i,1);
spawn();
}

});
}

/* HIT */
function hit(){

navigator.vibrate?.(80);

lives--;

if(lives<=0){
end();
return;
}

bird.y=c.height/2;
bird.vy=0;
pipes=[];
spawn();
}

/* END */
function end(){

gameOver=true;

document.getElementById("over").style.display="flex";
document.getElementById("result").innerText="Game Over";
document.getElementById("final").innerText="Skor: "+score;
}

/* LOOP */
function loop(){

if(gameOver) return;

if(!paused){
update();
draw();

document.getElementById("score").innerText=score;
document.getElementById("lives").innerText="❤️ "+lives;
document.getElementById("time").innerText=Math.floor((Date.now()-startTime)/1000)+"s";
}

animationId=requestAnimationFrame(loop);
}

/* INPUT */
let lastFlap=0;

function flap(){

if(paused || gameOver) return;

let now=Date.now();
if(now-lastFlap<110) return;
lastFlap=now;

bird.vy=-7;

if(bird.y<80){
bird.vy=-5;
}
}

c.addEventListener("click",flap);
c.addEventListener("touchstart",flap,{passive:true});

document.addEventListener("keydown",e=>{
if(e.code==="Space")flap();
});

/* PAUSE */
function togglePause(){
paused=!paused;
document.getElementById("pauseBtn").innerText = paused ? "▶️" : "⏸";
}

/* BACK */
function goBack(){
if(confirm("Çıkmak istiyor musun?")) history.back();
}

init();

</script>

</body>
</html>
