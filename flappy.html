<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Flappy Pro</title>

<style>
body{
margin:0;
background:linear-gradient(#dbeafe,#fff);
font-family:system-ui;
}

canvas{
display:block;
margin:auto;
background:linear-gradient(#dbeafe,#eff6ff);
border-radius:20px;
}

.hud{
display:flex;
justify-content:space-between;
padding:10px;
font-weight:700;
}

/* 🔥 KONTROL BUTONLARI */
.controls{
display:flex;
gap:10px;
padding:0 10px 10px;
}

.btn{
flex:1;
padding:10px;
border:none;
border-radius:12px;
background:#1e3a8a;
color:white;
font-weight:700;
}

.overlay{
position:fixed;
top:0;left:0;
width:100%;height:100%;
background:rgba(0,0,0,.6);
display:none;
align-items:center;
justify-content:center;
}

.box{
background:white;
padding:20px;
border-radius:16px;
text-align:center;
}
</style>
</head>

<body>

<div class="hud">
<div id="score">Skor: 0</div>
<div id="time">Süre: 0</div>
<div id="lives">❤️ 3</div>
</div>

<!-- 🔥 YENİ KONTROLLER -->
<div class="controls">
<button class="btn" onclick="togglePause()" id="pauseBtn">⏸ Duraklat</button>
<button class="btn" onclick="goBack()">🔙 Geri</button>
</div>

<canvas id="game" width="360" height="520"></canvas>

<div class="overlay" id="over">
<div class="box">
<h3 id="result"></h3>
<p id="final"></p>
<button onclick="init()">Tekrar</button>
</div>
</div>

<script>

const c = document.getElementById("game");
const ctx = c.getContext("2d");

/* AUDIO */
const flapSound = new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=");
const hitSound = new Audio("data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=");

/* STATE */
let bird, pipes, score, lives, speed, gap, startTime, safeTime, gameOver;

/* 🔥 PAUSE STATE */
let paused = false;
let animationId = null;

/* INIT */
function init(){

bird = { y:250, vy:0 };
pipes = [];

score = 0;
lives = 3;

speed = 2;
gap = 160;

startTime = Date.now();
safeTime = 10000;

gameOver = false;
paused = false;

document.getElementById("pauseBtn").innerText = "⏸ Duraklat";
document.getElementById("over").style.display="none";

spawn();

/* 🔥 LOOP RESET */
if(animationId) cancelAnimationFrame(animationId);
loop();
}

/* PIPE */
function spawn(){

let top = Math.random()*200 + 100;

pipes.push({
x:360,
top:top,
passed:false
});
}

/* DRAW */
function draw(){

ctx.clearRect(0,0,360,520);

/* bird */
ctx.fillStyle="#2563eb";
ctx.beginPath();
ctx.arc(80,bird.y,12,0,Math.PI*2);
ctx.fill();

/* kanat */
ctx.fillStyle="#1d4ed8";
ctx.fillRect(70,bird.y,8,4);

/* pipes */
ctx.fillStyle="#16a34a";

pipes.forEach(p=>{
ctx.fillRect(p.x,0,40,p.top);
ctx.fillRect(p.x,p.top+gap,40,520);
});

}

/* UPDATE */
function update(){

bird.vy += 0.4;
bird.y += bird.vy;

let elapsed = Date.now() - startTime;
let collisionActive = elapsed > safeTime;

for(let i=pipes.length-1;i>=0;i--){

let p = pipes[i];
p.x -= speed;

/* çarpışma */
if(
collisionActive &&
p.x < 95 && p.x > 60 &&
(bird.y < p.top || bird.y > p.top + gap)
){
hit();
}

/* skor */
if(!p.passed && p.x < 60){
p.passed = true;
score++;
}

/* yeni pipe */
if(p.x < -40){
pipes.splice(i,1);
spawn();
}
}

}

/* HIT */
function hit(){

hitSound.play();

lives--;

if(lives <= 0){
end(false);
return;
}

/* reset */
bird.y = 250;
bird.vy = 0;
pipes = [];
spawn();
}

/* END */
function end(win){

gameOver = true;

document.getElementById("over").style.display="flex";
document.getElementById("result").innerText = win ? "Kazandın" : "Oyun Bitti";
document.getElementById("final").innerText = "Skor: "+score;

}

/* LOOP */
function loop(){

if(gameOver) return;

if(!paused){
update();
draw();

document.getElementById("score").innerText="Skor: "+score;
document.getElementById("lives").innerText="❤️ "+lives;

let t = Math.floor((Date.now()-startTime)/1000);
document.getElementById("time").innerText="Süre: "+t;
}

animationId = requestAnimationFrame(loop);
}

/* INPUT */
function flap(){
if(paused || gameOver) return;
bird.vy = -7;
flapSound.play();
}

/* PAUSE */
function togglePause(){

paused = !paused;

document.getElementById("pauseBtn").innerText =
paused ? "▶️ Devam" : "⏸ Duraklat";

}

/* GERİ */
function goBack(){

if(confirm("Oyundan çıkmak istiyor musun?")){
window.history.back();
}

}

c.addEventListener("touchstart", flap);
c.addEventListener("click", flap);
document.addEventListener("keydown",e=>{
if(e.code==="Space") flap();
});

/* START */
init();

</script>

</body>
</html>
