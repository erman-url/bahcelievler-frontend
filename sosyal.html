<!DOCTYPE html>
<html lang="tr">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Sosyal | Bahçelievler Forum</title>

<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* PAGE WRAPPER */

.page-wrapper{
max-width:1000px;
margin:0 auto;
padding-bottom:120px;
}

/* PAGE TITLE */

.page-title{
font-size:20px;
font-weight:700;
margin:20px;
letter-spacing:0.3px;
}

/* GRID */

.social-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:16px;
padding:16px;
}

/* CARD */

.social-card{

background:linear-gradient(145deg,#ffffff,#f3f6fb);

border-radius:18px;

padding:18px;

display:flex;
align-items:center;
gap:14px;

box-shadow:
0 6px 18px rgba(0,0,0,0.06),
0 1px 0 rgba(255,255,255,0.6) inset;

transition:all .18s ease;

cursor:pointer;

position:relative;

}

/* TOUCH EFFECT */

.social-card:active{
transform:scale(.97);
box-shadow:0 4px 10px rgba(0,0,0,0.08);
}

/* ICON BADGE */

.social-icon{

width:46px;
height:46px;

border-radius:14px;

display:flex;
align-items:center;
justify-content:center;

font-size:18px;

color:white;

background:linear-gradient(135deg,#2563eb,#3b82f6);

flex-shrink:0;

}

/* TEXT AREA */

.social-text{
flex:1;
}

.social-title{
font-size:15px;
font-weight:700;
}

.social-desc{
font-size:12px;
color:#6b7280;
margin-top:3px;
}

/* RIGHT ARROW */

.social-arrow{
font-size:14px;
color:#9ca3af;
}

/* HOVER DESKTOP */

@media(min-width:900px){

.social-card:hover{

transform:translateY(-3px);

box-shadow:
0 10px 26px rgba(0,0,0,0.10);

}

}

/* MOBILE */

@media(max-width:600px){

.social-grid{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<div id="globalHeader"></div>

<div class="page-wrapper">

<h1 class="page-title">SOSYAL</h1>

<div class="social-grid">


<div class="social-card" onclick="location.href='duyurular.html'">

<div class="social-icon">
<i class="fa-solid fa-bullhorn"></i>
</div>

<div class="social-text">
<div class="social-title">Duyurular</div>
<div class="social-desc">Mahalle duyuruları ve bilgilendirmeler</div>
</div>

<div class="social-arrow">
<i class="fa-solid fa-chevron-right"></i>
</div>

</div>



<div class="social-card" onclick="location.href='firsatlar.html'">

<div class="social-icon">
<i class="fa-solid fa-tags"></i>
</div>

<div class="social-text">
<div class="social-title">Fırsat & İndirim</div>
<div class="social-desc">Yerel kampanya ve indirimler</div>
</div>

<div class="social-arrow">
<i class="fa-solid fa-chevron-right"></i>
</div>

</div>



<div class="social-card" onclick="location.href='fiyat-dedektifi.html'">

<div class="social-icon">
<i class="fa-solid fa-magnifying-glass-dollar"></i>
</div>

<div class="social-text">
<div class="social-title">Fiyat Dedektifi</div>
<div class="social-desc">Market fiyat karşılaştırmaları</div>
</div>

<div class="social-arrow">
<i class="fa-solid fa-chevron-right"></i>
</div>

</div>



<div class="social-card" onclick="location.href='tavsiye-sikayet.html'">

<div class="social-icon">
<i class="fa-solid fa-comments"></i>
</div>

<div class="social-text">
<div class="social-title">Tavsiye & Şikayet</div>
<div class="social-desc">Deneyim paylaşımı ve öneriler</div>
</div>

<div class="social-arrow">
<i class="fa-solid fa-chevron-right"></i>
</div>

</div>


</div>

</div>

<script src="assets/js/core.js" defer></script>

</body>
</html>
