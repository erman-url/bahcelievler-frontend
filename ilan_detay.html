<!DOCTYPE html>
<html lang="tr" class="no-js">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>İlan Detayı | Bahçelievler Forum</title>

<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

:root{
  --primary:#0e3b6f;
  --bg:#f4f7fb;
  --card:#ffffff;
  --border:#e6e6e6;
  --text:#222;
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);
  color:var(--text);
  padding-top: env(safe-area-inset-top);
}

.page-wrapper{
  max-width:720px;
  margin:0 auto;
  padding-bottom: calc(120px + env(safe-area-inset-bottom));
}

.slider{
  position:relative;
  overflow:hidden;
  background:#000;
}

.slider-track{
  display:flex;
  transition:transform .3s ease;
}

.slider img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  flex-shrink:0;
}

.slider-btn{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  background:rgba(0,0,0,.6);
  color:#fff;
  border:none;
  width:36px;
  height:36px;
  border-radius:50%;
  cursor:pointer;
}

.left{left:10px;}
.right{right:10px;}

.section{
  background:var(--card);
  padding:14px;
  border-bottom:1px solid var(--border);
}

.ad-id{
  font-size:12px;
  color:#777;
}

.ad-title{
  font-size:18px;
  font-weight:700;
  margin:6px 0;
}

.price{
  font-size:18px;
  font-weight:800;
  color:var(--primary);
  margin:6px 0;
}

.detail-row{
  display:flex;
  justify-content:space-between;
  font-size:14px;
  padding:4px 0;
}

.description{
  font-size:14px;
  line-height:1.6;
}

.location{
  font-size:14px;
  display:flex;
  align-items:center;
  gap:6px;
}

.action-buttons{
  padding:16px;
  display:grid;
  gap:10px;
}

.btn-primary{
  background:var(--primary);
  color:#fff;
  border:none;
  padding:14px;
  font-size:15px;
  border-radius:10px;
  font-weight:700;
}

.btn-secondary{
  background:#fff;
  border:1px solid var(--border);
  padding:12px;
  border-radius:10px;
  font-size:14px;
}

.comments{
  background:#fff;
  padding:14px;
}

.comments textarea{
  width:100%;
  min-height:80px;
  padding:10px;
  border-radius:8px;
  border:1px solid var(--border);
  resize:vertical;
}

.comments button{
  margin-top:8px;
  width:100%;
  padding:12px;
  border:none;
  background:#444;
  color:#fff;
  border-radius:8px;
}

#globalFooter{
  padding-bottom: env(safe-area-inset-bottom);
}

</style>


</head>

<body>

  
<div id="globalHeader"></div>

<div class="page-wrapper">

<div class="slider">
  <div class="slider-track" id="sliderTrack">
    <img src="https://picsum.photos/600/600?1">
    <img src="https://picsum.photos/600/600?2">
    <img src="https://picsum.photos/600/600?3">
  </div>
  <button class="slider-btn left" onclick="slide(-1)"><i class="fa fa-chevron-left"></i></button>
  <button class="slider-btn right" onclick="slide(1)"><i class="fa fa-chevron-right"></i></button>
</div>

<div class="section">
  <div class="ad-id">İlan No: BF-01544</div>
  <div class="ad-title">Satılık iPhone 15 Max</div>
  <div class="price">32.500 ₺</div>
  <div id="adDate" style="font-size:12px;color:#777;margin-top:4px;"></div>
</div>

<div class="section">
  <div class="detail-row"><span>Kategori</span><span>Elektronik</span></div>
  <div class="detail-row"><span>Durum</span><span>2. El - İyi</span></div>
  <div class="detail-row"><span>Mahalle</span><span>Yenibosna</span></div>
  <div class="detail-row"><span>Satıcı</span><span>@TechSelim</span></div>
</div>

<div class="section description">
  Ürün temiz kullanılmıştır. Herhangi bir arızası yoktur.
  Elden teslim tercih edilir.
</div>

<div class="section location">
  <i class="fa fa-location-dot"></i> Bahçelievler / İstanbul
</div>

<div class="action-buttons">
  <button class="btn-primary" id="contactBtn">Satıcı ile İletişime Geç</button>
  <button class="btn-secondary" id="shareBtn"><i class="fa fa-share"></i> Paylaş</button>
</div>

<div class="comments">

<!-- EKLENDİ -->
<input type="text" id="commentName" placeholder="Adınız / Nickname" style="width:100%;padding:10px;margin-bottom:8px;border-radius:8px;border:1px solid #ddd;">

<textarea placeholder="Yorum yaz..."></textarea>

<button id="sendCommentBtn">Yorum Gönder</button>

<!-- EKLENDİ -->
<div id="commentList"></div>

</div>

</div>

<script>

let index=0;

/* ===============================
SLIDER
=============================== */
function slide(dir){
  const track=document.getElementById("sliderTrack");
  if(!track || track.children.length === 0) return;

  const total=track.children.length;
  index=(index+dir+total)%total;

  track.style.transform=`translateX(-${index*100}%)`;
}

/* ===============================
DATE FORMAT
=============================== */
function formatDate(d){
  if(!d) return "-";
  return new Date(d).toLocaleString("tr-TR");
}

/* ===============================
CONTACT (FIXED)
=============================== */
function handleContact(contact){

  if(!contact){
    alert("İletişim bilgisi yok");
    return;
  }

  contact = String(contact).trim();

  if(contact.startsWith("@")){
    window.open("https://t.me/"+contact.replace("@",""),"_blank");
    return;
  }

  if(contact.startsWith("05")){
    window.location.href="tel:"+contact;
    return;
  }

  if(contact.startsWith("http")){
    window.open(contact,"_blank");
    return;
  }

  alert("Geçersiz iletişim bilgisi");
}

/* ===============================
SHARE (FIXED)
=============================== */
function shareAd(ad){

  const url = window.location.href;

  if(navigator.share){
    navigator.share({
      title: ad?.title || "İlan",
      text: (ad?.title || "") + " " + (ad?.price || "") + " TL",
      url
    });
  }else{
    navigator.clipboard.writeText(url);
    alert("Link kopyalandı");
  }
}

/* ===============================
GET ID (SAFE)
=============================== */
function getAdId(){
  const id = new URLSearchParams(location.search).get("id");
  if(!id){
    console.warn("ID bulunamadı");
    return null;
  }
  return id.trim();
}

/* ===============================
COMMENT SEND
=============================== */
async function sendComment(){

  const id = getAdId();
  if(!id) return alert("İlan bulunamadı");

  const nameInput = document.getElementById("commentName");
  const textarea = document.querySelector(".comments textarea");

  if(!nameInput || !textarea){
    console.warn("Form elemanları bulunamadı");
    return;
  }

  const name = nameInput.value.trim();
  const text = textarea.value.trim();

  if(!name) return alert("İsim giriniz");
  if(!text) return alert("Yorum boş olamaz");

  try{

    const res = await fetch("https://bahcelievler-api.erman-urel.workers.dev/api/comment-ekle",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body: JSON.stringify({
        ilan_id:id,
        nickname:name,
        comment:text
      })
    });

    if(!res.ok){
      throw new Error("HTTP hata: " + res.status);
    }

    const result = await res.json();

    if(!result || !result.ok){
      alert(result?.error || "Yorum gönderilemedi");
      return;
    }

    nameInput.value = "";
    textarea.value = "";

    loadComments();

  }catch(e){
    console.log("comment error", e);
    alert("Sunucu bağlantı hatası");
  }
}

/* ===============================
LOAD COMMENTS
=============================== */
async function loadComments(){

  const id = getAdId();
  if(!id) return;

  try{

    const res = await fetch(
      "https://bahcelievler-api.erman-urel.workers.dev/api/comments/" + id,
      { cache:"no-store" }
    );

    if(!res.ok){
      throw new Error("HTTP hata: " + res.status);
    }

    const data = await res.json();

    const box = document.getElementById("commentList");
    if(!box) return;

    if(!data || data.length === 0){
      box.innerHTML = "<div style='padding:10px;color:#777'>Henüz yorum yok</div>";
      return;
    }

    let html = "";

    for(const c of data){
      html += `
      <div style="padding:10px;border-bottom:1px solid #eee">
        <b>${c.nickname || "-"}</b>
        <div style="font-size:12px;color:#777">
          ${formatDate(c.created_at)}
        </div>
        <div>${c.comment || ""}</div>
      </div>`;
    }

    box.innerHTML = html;

  }catch(e){
    console.log("loadComments error", e);
  }
}

/* ===============================
LOAD DETAIL (CRITICAL FIX)
=============================== */
async function loadDetail(){

  const id = getAdId();
  if(!id) return;

  try{

    const res = await fetch(
      "https://bahcelievler-api.erman-urel.workers.dev/api/ilanlar",
      { cache:"no-store" }
    );

    if(!res.ok){
      throw new Error("HTTP hata: " + res.status);
    }

    const data = await res.json();

    // 🔥 TOLERANSLI MATCH (EN KRİTİK FIX)
    const ad = data.find(x =>
      String(x.id) === String(id) ||
      String(x.id).includes(id)
    );

    if(!ad){
      alert("İlan bulunamadı");
      return;
    }

    const titleEl = document.querySelector(".ad-title");
    const priceEl = document.querySelector(".price");
    const dateEl = document.getElementById("adDate");
    const metaEl = document.querySelector(".ad-id");
    const slider = document.getElementById("sliderTrack");

    if(titleEl) titleEl.innerText = ad.title || "-";
    if(priceEl) priceEl.innerText = (ad.price || 0) + " TL";

    // 🔥 İLAN NO + TARİH
    if(metaEl){
      metaEl.innerText =
        "İlan No: " + (ad.id || "-") +
        " • " +
        formatDate(ad.created_at);
    }

    if(dateEl){
      dateEl.innerText = "";
    }

    let images = [ad.image_url, ad.image_url_2, ad.image_url_3].filter(Boolean);
    if(images.length === 0) images = ["https://picsum.photos/600"];

    if(slider){
      slider.innerHTML = images.map(src => `<img src="${src}?v=${ad.id}">`).join("");
    }

    const contactBtn = document.getElementById("contactBtn");
    const shareBtn = document.getElementById("shareBtn");

    if(contactBtn){
      contactBtn.onclick = () => handleContact(ad.contact);
    }

    if(shareBtn){
      shareBtn.onclick = () => shareAd(ad);
    }

    loadComments();

  }catch(e){
    console.log("loadDetail error", e);
    alert("İlan yüklenemedi");
  }
}

/* ===============================
INIT
=============================== */
document.addEventListener("DOMContentLoaded",()=>{

  loadDetail();

  const btn = document.getElementById("sendCommentBtn");
  if(btn){
    btn.onclick = sendComment;
  }

});

</script>


<script src="./assets/js/layout.js"></script>
<script src="./assets/js/menu.js"></script>
<script src="./assets/js/core.js" defer></script>
<script src="./assets/js/footerNav.js"></script>
<script src="./assets/js/footerLegal.js"></script>

<div id="globalFooter"></div>

</body>
</html>
