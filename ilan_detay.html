<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>İlan Detayı | Bahçelievler Forum</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

:root{
  --primary:#0e3b6f;
  --bg:#f4f7fb;
  --card:#ffffff;
  --border:#e6e6e6;
  --text:#222;
}

*{box-sizing:border-box;}

body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  background:var(--bg);
  color:var(--text);
}

.page-wrapper{
  max-width:720px;
  margin:0 auto;
  padding-bottom:120px;
}

/* ===== SLIDER ===== */

.slider{
  position:relative;
  overflow:hidden;
  background:#000;
}

.slider-track{
  display:flex;
  transition:transform .3s ease;
}

.slider img{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  flex-shrink:0;
}

.slider-btn{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  background:rgba(0,0,0,.6);
  color:#fff;
  border:none;
  width:36px;
  height:36px;
  border-radius:50%;
  cursor:pointer;
}

.left{left:10px;}
.right{right:10px;}

/* ===== CARD SECTIONS ===== */

.section{
  background:var(--card);
  padding:14px;
  border-bottom:1px solid var(--border);
}

.ad-id{
  font-size:12px;
  color:#777;
}

.ad-title{
  font-size:18px;
  font-weight:700;
  margin:6px 0;
}

.price{
  font-size:18px;
  font-weight:800;
  color:var(--primary);
  margin:6px 0;
}

.detail-row{
  display:flex;
  justify-content:space-between;
  font-size:14px;
  padding:4px 0;
}

.description{
  font-size:14px;
  line-height:1.6;
}

.location{
  font-size:14px;
  display:flex;
  align-items:center;
  gap:6px;
}

/* ===== BUTTONS ===== */

.action-buttons{
  padding:16px;
  display:grid;
  gap:10px;
}

.btn-primary{
  background:var(--primary);
  color:#fff;
  border:none;
  padding:14px;
  font-size:15px;
  border-radius:10px;
  font-weight:700;
}

.btn-secondary{
  background:#fff;
  border:1px solid var(--border);
  padding:12px;
  border-radius:10px;
  font-size:14px;
}

/* ===== COMMENTS ===== */

.comments{
  background:#fff;
  padding:14px;
}

.comments textarea{
  width:100%;
  min-height:80px;
  padding:10px;
  border-radius:8px;
  border:1px solid var(--border);
  resize:vertical;
}

.comments button{
  margin-top:8px;
  width:100%;
  padding:12px;
  border:none;
  background:#444;
  color:#fff;
  border-radius:8px;
}

/* ===== MODERN FOOTER (INDEX İLE AYNI) ===== */

.app-footer-nav{
  position:fixed;
  bottom:15px;
  left:50%;
  transform:translateX(-50%);
  width:95%;
  max-width:520px;
  height:85px;
  background:linear-gradient(145deg,#1a2f4f,#0f1f38);
  border-radius:42px;
  display:grid;
  grid-template-columns:1fr 1fr 1.4fr 1fr 1fr;
  align-items:center;
  padding:0 10px;
  box-shadow:0 25px 60px rgba(0,0,0,.45);
  z-index:2000;
}

.nav-item-modern{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  font-size:.72rem;
  font-weight:700;
  color:rgba(255,255,255,0.7);
  text-decoration:none;
}

.icon-wrap{
  width:46px;
  height:46px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(255,255,255,0.08);
}

.nav-item-modern.active{
  color:#fff;
}

.nav-center-wrapper{
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  position:relative;
  top:-22px;
  text-decoration:none;
  color:#fff;
}

.nav-center{
  width:76px;
  height:76px;
  border-radius:50%;
  background:linear-gradient(135deg,#00c2ff,#0066ff);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 25px 60px rgba(0,0,0,.55);
}

.nav-center-label{
  margin-top:6px;
  font-size:.78rem;
  font-weight:700;
  color:#fff;
}

@media(min-width:1024px){
  .app-footer-nav{display:none;}
}


</style>
</head>

<body>

<div class="page-wrapper">

<!-- SLIDER -->
<div class="slider">
  <div class="slider-track" id="sliderTrack">
    <img src="https://picsum.photos/600/600?1">
    <img src="https://picsum.photos/600/600?2">
    <img src="https://picsum.photos/600/600?3">
  </div>
  <button class="slider-btn left" onclick="slide(-1)"><i class="fa fa-chevron-left"></i></button>
  <button class="slider-btn right" onclick="slide(1)"><i class="fa fa-chevron-right"></i></button>
</div>

<!-- HEADER -->
<div class="section">
  <div class="ad-id">İlan No: BF-01544</div>
  <div class="ad-title">Satılık iPhone 15 Max</div>
  <div class="price">32.500 ₺</div>
</div>

<!-- DETAILS -->
<div class="section">
  <div class="detail-row"><span>Kategori</span><span>Elektronik</span></div>
  <div class="detail-row"><span>Durum</span><span>2. El - İyi</span></div>
  <div class="detail-row"><span>Mahalle</span><span>Yenibosna</span></div>
  <div class="detail-row"><span>Satıcı</span><span>@TechSelim</span></div>
</div>

<!-- DESCRIPTION -->
<div class="section description">
  Ürün temiz kullanılmıştır. Herhangi bir arızası yoktur.
  Elden teslim tercih edilir.
</div>

<!-- LOCATION -->
<div class="section location">
  <i class="fa fa-location-dot"></i> Bahçelievler / İstanbul
</div>

<!-- ACTION -->
<div class="action-buttons">
  <button class="btn-primary">Satıcı ile İletişime Geç</button>
  <button class="btn-secondary"><i class="fa fa-share"></i> Paylaş</button>
</div>

<!-- COMMENTS -->
<div class="comments">
  <textarea placeholder="Yorum yaz..."></textarea>
  <button>Yorum Gönder</button>
</div>

</div>

<!-- FOOTER NAV -->



<script>
let index=0;
function slide(dir){
  const track=document.getElementById("sliderTrack");
  const total=track.children.length;
  index=(index+dir+total)%total;
  track.style.transform=`translateX(-${index*100}%)`;
}
</script>
<nav class="app-footer-nav">

<a href="/" class="nav-item-modern">
<div class="icon-wrap"><i class="fa-solid fa-house"></i></div>
Ana
</a>

<a href="/sosyal.html" class="nav-item-modern">
<div class="icon-wrap"><i class="fa-solid fa-globe"></i></div>
Sosyal
</a>

<a href="/ilanlar.html" class="nav-center-wrapper active">
<div class="nav-center"><i class="fa-solid fa-bars"></i></div>
<div class="nav-center-label">İlanlar</div>
</a>

<a href="/hizmetler.html" class="nav-item-modern">
<div class="icon-wrap"><i class="fa-solid fa-layer-group"></i></div>
Hizmetler
</a>

<a href="/iletisim.html" class="nav-item-modern">
<div class="icon-wrap"><i class="fa-solid fa-envelope"></i></div>
İletişim
</a>

</nav>
</body>
</html>
