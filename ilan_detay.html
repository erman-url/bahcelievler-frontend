<!DOCTYPE html>

<html lang="tr" class="no-js">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>İlan Detayı | Bahçelievler Forum</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/ilandetay.css">

<meta name="description" content="Bahçelievler Forum ilan detay sayfası">
</head>
<body>
<div id="globalHeader"></div>

<div class="page-wrapper">
<div class="slider">

  <div class="slider-track" id="sliderTrack"></div>

  <button class="slider-btn left" onclick="slide(-1)">
  <i class="fa fa-chevron-left"></i>
</button>

<button class="slider-btn right" onclick="slide(1)">
  <i class="fa fa-chevron-right"></i>
</button>

</div>

<div class="section">
<div class="ad-id"></div>
<div class="ad-title"></div>
<div class="price"></div>
  <div id="adDate" style="font-size:12px;color:#777;margin-top:4px;"></div>
</div>

<div class="section">
  <div class="detail-row"><span>Kategori</span><span id="adCategory">Elektronik</span></div>
  <div class="detail-row"><span>Durum</span><span id="adCondition">2. El - İyi</span></div>
  <div class="detail-row"><span>Mahalle</span><span id="adDistrict">Yenibosna</span></div>
  <div class="detail-row"><span>Satıcı</span><span id="adSeller">@TechSelim</span></div>
</div>

<div class="section description" id="adDescription">
  Ürün temiz kullanılmıştır. Herhangi bir arızası yoktur.
  Elden teslim tercih edilir.
</div>

<div class="section location" id="adLocation">
  <i class="fa fa-location-dot"></i> Bahçelievler / İstanbul
</div>

<div class="action-buttons">
  <button class="btn-primary" id="contactBtn">Satıcı ile İletişime Geç</button>
  <button class="btn-secondary" id="shareBtn"><i class="fa fa-share"></i> Paylaş</button>
</div>

<div class="action-buttons">
  <button class="btn-danger" id="deleteAdBtn">İlanı Sil</button>
  <button class="btn-secondary" id="editAdBtn">Düzenle</button>
</div>

<div class="action-buttons">

<input type="password" id="deletePassword" class="input-field">

<button id="confirmDeleteBtn" class="btn-danger confirm-btn">
Silmeyi Onayla
</button>

</div>

</div>

<script>

let index=0;

function slide(dir){
  const track=document.getElementById("sliderTrack");
  if(!track || track.children.length === 0) return;

  const total=track.children.length;
  index=(index+dir+total)%total;
  track.style.transform=`translateX(-${index*100}%)`;
}

function formatDate(d){
  if(!d) return "-";
  return new Date(d).toLocaleString("tr-TR");
}

function handleContact(contact){
  if(!contact) return alert("İletişim bilgisi yok");

  contact = String(contact).trim();

  if(contact.startsWith("@")){
    window.open("https://t.me/"+contact.replace("@",""),"_blank");
    return;
  }

  if(contact.startsWith("05")){
    window.location.href="tel:"+contact;
    return;
  }

  if(contact.startsWith("http")){
    window.open(contact,"_blank");
    return;
  }

  alert("Geçersiz iletişim bilgisi");
}

function shareAd(ad){
  const url = window.location.href;

  if(navigator.share){
    navigator.share({
      title: ad?.title || "İlan",
      text: (ad?.title || "") + " " + (ad?.price || "") + " TL",
      url
    });
  }else{
    navigator.clipboard.writeText(url);
    alert("Link kopyalandı");
  }
}

function getAdId(){
  const id = new URLSearchParams(location.search).get("id");
  return id ? id.trim() : null;
}

async function loadDetail(){

  const id = getAdId();
  if(!id) return;

  try{

    const res = await fetch(
      "https://bahcelievler-api.erman-urel.workers.dev/api/ilanlar",
      { cache:"force-cache" }
    );

    if(!res.ok) throw new Error();

    const data = await res.json();

    const ad = data.find(x => String(x.id) === String(id));

    if(!ad){
      alert("İlan bulunamadı");
      return;
    }

    document.title = ad.title + " | Bahçelievler Forum";

    const titleEl = document.querySelector(".ad-title");
    const priceEl = document.querySelector(".price");
    const metaEl = document.querySelector(".ad-id");

    if(titleEl) titleEl.innerText = ad.title || "-";
    if(priceEl) priceEl.innerText = (ad.price || 0) + " TL";

    if(metaEl){
      metaEl.innerText =
        "İlan No: " + (ad.id || "-") +
        " • " +
        formatDate(ad.created_at);
    }

    let images = [ad.image_url, ad.image_url_2, ad.image_url_3].filter(Boolean);

if(images.length === 0) return;

    const slider = document.getElementById("sliderTrack");

    if(slider){
      slider.innerHTML = "";

      images.forEach(src => {

        let safe = String(src).trim().replace(/"/g,"");

        if(!safe.startsWith("http")) safe = "https://picsum.photos/600";

        const img = document.createElement("img");
        img.src = safe + "?v=" + ad.id;
        img.loading = "lazy";

        img.onerror = () => {
          img.src = "https://picsum.photos/600";
        };

        slider.appendChild(img);
      });
    }

    const contactBtn = document.getElementById("contactBtn");
    const shareBtn = document.getElementById("shareBtn");

    if(contactBtn && ad.contact){
      contactBtn.onclick = () => window.handleContact(ad.contact);
    }

    if(shareBtn){
      shareBtn.onclick = () => shareAd(ad);
    }

  }catch(e){
    alert("İlan yüklenemedi");
  }
}

async function confirmDelete(){

  const id = getAdId();
  const passEl = document.getElementById("deletePassword");

  if(!passEl) return alert("Şifre alanı yok");

  const password = passEl.value;

  if(!password || password.length < 3){
    return alert("Geçerli şifre gir");
  }

  try{

    const res = await fetch(
      "https://bahcelievler-api.erman-urel.workers.dev/api/ilan-sil",
      {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({
          id,
          delete_token: password
        })
      }
    );

    let result = null;

    try{
      result = await res.json();
    }catch(e){
      alert("Sunucu geçersiz cevap verdi");
      return;
    }

    if(!res.ok){
      alert("Silme işlemi başarısız (API)");
      return;
    }

    if(!result || typeof result.ok === "undefined"){
      alert("Geçersiz sunucu cevabı");
      return;
    }

    if(result.ok){

      if(passEl) passEl.value = "";

      alert("İlan silindi");

      setTimeout(()=>{
        window.location.href = "ilanlar.html";
      }, 300);

    }else{
      alert(result.error || "Şifre yanlış");
    }

  }catch(e){
    alert("Sunucu hatası");
  }
}

document.addEventListener("DOMContentLoaded",()=>{

const deleteBtn = document.getElementById("deleteAdBtn");
const confirmBtn = document.getElementById("confirmDeleteBtn");

if(deleteBtn){
  deleteBtn.onclick = () => {
    const pass = document.getElementById("deletePassword");
    if(pass){
      pass.scrollIntoView({behavior:"smooth"});
      pass.focus();
    }
  };
}

if(confirmBtn){
  confirmBtn.onclick = confirmDelete;
}

loadDetail();

});

/* ===============================
GELİŞMİŞ CONTACT OVERRIDE
=============================== */
window.handleContact = function(contact){

  if(!contact) return alert("İletişim yok");

  contact = String(contact).trim();

  if(contact.startsWith("@")){
    window.open("https://t.me/"+contact.replace("@",""),"_blank");
    return;
  }

  if(contact.startsWith("05")){
    window.location.href="tel:"+contact;
    return;
  }

  if(contact.startsWith("5") && contact.length===10){
    window.open("https://wa.me/90"+contact,"_blank");
    return;
  }

  if(contact.includes("wa.me")){
    window.open(contact,"_blank");
    return;
  }

  if(contact.startsWith("http")){
    window.open(contact,"_blank");
    return;
  }

  alert("Geçersiz iletişim");
};

</script>

<script src="assets/js/core.js" defer></script>

<script src="assets/js/dashboard.js" defer></script>

<script src="assets/js/news.js" defer></script>

<script src="assets/js/countdown.js" defer></script>

<script src="assets/js/footerLegal.js" defer></script>

<div id="globalFooter"></div>

<!-- ===========================
İLAN VERME MODAL + GELİŞMİŞ SİSTEM
=========================== -->

<div id="adModal" style="position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:9999;align-items:center;justify-content:center;">
  <div style="background:#fff;width:95%;max-width:500px;padding:16px;border-radius:16px;">

<h3>İlan Ver</h3>

<input id="adTitle" placeholder="Başlık" class="input-field">
<input id="adPrice" type="number" placeholder="Fiyat" class="input-field">
<textarea id="adDesc" placeholder="Açıklama" class="input-field"></textarea>

<input id="adContact" placeholder="Telefon / WhatsApp / Telegram" class="input-field">

<input type="file" id="adImages" multiple>

<input id="deleteCode" type="password" placeholder="Silme Şifresi" class="input-field">

<button id="submitAdBtn" class="btn-primary">Yayınla</button> <button onclick="closeModal()" class="btn-secondary">Kapat</button>

  </div>
</div>

<script>

function openModal(){
  document.getElementById("adModal").style.display="flex";
}
function closeModal(){
  document.getElementById("adModal").style.display="none";
}

let lastSubmit=0;

document.addEventListener("DOMContentLoaded",()=>{

  const btn=document.getElementById("submitAdBtn");
  if(!btn) return;

  btn.onclick=async()=>{

    const now=Date.now();
    if(now-lastSubmit<10000){
      return alert("10 sn bekle");
    }

    const title=document.getElementById("adTitle").value.trim();
    const price=document.getElementById("adPrice").value;
    const content=document.getElementById("adDesc").value.trim();
    const contact=document.getElementById("adContact").value.trim();
    const delete_token=document.getElementById("deleteCode").value;

    if(title.length<5) return alert("Başlık kısa");
    if(price<=0) return alert("Fiyat gir");
    if(content.length<10) return alert("Açıklama kısa");
    if(delete_token.length<3) return alert("Şifre kısa");
    if(contact.length>100) return alert("Geçersiz iletişim");

    const files=document.getElementById("adImages").files;

   const toBase64=(file)=>new Promise((res)=>{
  if(file.size > 2 * 1024 * 1024){
    alert("Max 2MB");
    return res(""); 
  }
      const reader=new FileReader();
      reader.onload=()=>res(reader.result);
      reader.readAsDataURL(file);
    });

    let image_url="",image_url_2="",image_url_3="";

    if(files[0]) image_url=await toBase64(files[0]);
    if(files[1]) image_url_2=await toBase64(files[1]);
    if(files[2]) image_url_3=await toBase64(files[2]);

    const res = await fetch("https://bahcelievler-api.erman-urel.workers.dev/api/ilan-ekle",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        title,
        price:Number(price),
        content,
        contact,
        delete_token,
        image_url,
        image_url_2,
        image_url_3
      })
    });

    if(!res.ok){
      return alert("İlan eklenemedi");
    }

    lastSubmit=Date.now();

    alert("İlan eklendi");
    location.reload();

  };

});
</script>

</body>
</html>
