<!DOCTYPE html>

<html lang="tr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>İndirim & Fırsatlar | Bahçelievler Forum</title>

<meta name="description" content="Online alışveriş ve Bahçelievler esnaf fırsatlarını keşfet. İnsanların paylaştığı indirimleri takip et.">

<meta name="robots" content="index,follow">
<meta name="theme-color" content="#1e3a8a">

<link rel="canonical" href="https://bahcelievlerforum.com.tr/firsatlar">

<!-- Open Graph -->

<meta property="og:title" content="İndirim & Fırsatlar | Bahçelievler Forum">
<meta property="og:description" content="Online alışveriş ve yerel esnaf fırsatlarını keşfet.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://bahcelievlerforum.com.tr/firsatlar">

<!-- 🔥 EKSTRA SEO -->
<meta property="og:image" content="https://bahcelievlerforum.com.tr/assets/default.jpg">
<meta name="twitter:card" content="summary_large_image">

<script type="application/ld+json">
{
 "@context":"https://schema.org",
 "@type":"WebPage",
 "name":"İndirim & Fırsatlar",
 "url":"https://bahcelievlerforum.com.tr/firsatlar"
}
</script>

<!-- CSS -->

<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* PREMIUM FAB */
.deal-add-btn{
  position:fixed;
  bottom:90px;
  right:20px;
  width:58px;
  height:58px;
  border-radius:50%;
  background:linear-gradient(135deg,#2563eb,#1e40af);
  box-shadow:0 10px 25px rgba(0,0,0,0.25);
  z-index:50;
}

/* TYPE MODAL */
.deal-type-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.5);
  display:none;
  z-index:999;
}

.deal-type-modal.active{
  display:flex;
  align-items:center;
  justify-content:center;
}

.deal-type-box{
  background:#fff;
  padding:20px;
  border-radius:16px;
  width:90%;
  max-width:320px;
}

.deal-type-grid{
  display:flex;
  gap:12px;
  margin-top:15px;
}

.deal-type-card{
  flex:1;
  padding:20px;
  border-radius:12px;
  background:#f1f5f9;
  text-align:center;
  cursor:pointer;
  font-weight:600;
}

/* SKELETON */
.skeleton-card{
  height:100px;
  border-radius:12px;
  background:linear-gradient(90deg,#eee,#f5f5f5,#eee);
  animation:loading 1.2s infinite;
  margin-top:10px;
}

@keyframes loading{
  0%{background-position:-200px}
  100%{background-position:200px}
}

</style>

</head>

<body>

<!-- GLOBAL HEADER -->

<div id="globalHeader"></div>

<main class="page-wrapper">

<h1 class="page-title">🔥 İndirim & Fırsatlar</h1>

<p class="page-subtitle">
Online alışveriş ve yerel esnaf kampanyalarını keşfet.
</p>

<!-- FILTER -->

<div class="deal-filters">

<button class="filter-btn active" onclick="filterDeals('all')" aria-label="Tüm fırsatları göster">
Tümü
</button>

<button class="filter-btn" onclick="filterDeals('online')" aria-label="Online fırsatları göster">
Online
</button>

<button class="filter-btn" onclick="filterDeals('store')" aria-label="Mağaza fırsatlarını göster">
Mağaza
</button>

</div>

<!-- ACTION CARDS -->

<div class="action-grid">

<div class="action-card" onclick="openDealForm('online')">
<div class="action-icon tavsiye">
<i class="fa-solid fa-bolt"></i>
</div>
<div class="action-title">Online Fırsat Paylaş</div>
<div class="action-desc">E-ticaret indirimini paylaş</div>
</div>

<div class="action-card" onclick="openDealForm('store')">
<div class="action-icon sikayet">
<i class="fa-solid fa-store"></i>
</div>
<div class="action-title">Mağaza / Esnaf Fırsatı</div>
<div class="action-desc">Yerel kampanyayı paylaş</div>
</div>

</div>

<!-- DEAL FEED -->

<section id="dealList" class="deal-list">

<div class="empty-box">
Fırsatlar yükleniyor...
</div>

<!-- 🔥 EKSTRA UX -->
<div class="skeleton-card"></div>
<div class="skeleton-card"></div>

</section>

</main>

<!-- FLOATING ADD BUTTON -->

<button class="deal-add-btn" onclick="openDealSelector()" aria-label="Fırsat ekle">
<i class="fa-solid fa-plus"></i>
</button>

<!-- 🔥 TYPE MODAL -->

<div class="deal-type-modal" id="dealTypeModal">
  <div class="deal-type-box">
    <div class="deal-type-title">Fırsat Türünü Seç</div>
    <div class="deal-type-grid">
      <div class="deal-type-card" onclick="selectDealType('online')">
        <i class="fa-solid fa-bolt"></i><br>Online
      </div>
      <div class="deal-type-card" onclick="selectDealType('store')">
        <i class="fa-solid fa-store"></i><br>Mağaza
      </div>
    </div>
  </div>
</div>

<!-- ADD DEAL MODAL (AYNI) -->

<div class="modal" id="dealModal">
<div class="modal-box">

<button class="modal-close" onclick="closeDealForm()" aria-label="Kapat">
<i class="fa-solid fa-xmark"></i>
</button>

<h3 id="dealFormTitle">Fırsat Paylaş</h3>

<div class="form-group">
<label>Nickname</label>
<input type="text" id="nickname" maxlength="10" placeholder="örn: erman">
</div>

<div class="form-group">
<label>Başlık</label>
<input type="text" id="dealTitle" maxlength="80">
</div>

<div class="form-group" id="storeBox">
<label>Mağaza / Site</label>
<input type="text" id="storeName">
</div>

<div class="form-group" id="linkBox">
<label>Ürün Linki</label>
<input type="url" id="dealLink">
</div>

<div class="form-group" id="districtBox">
<label>Mahalle</label>
<select id="district">
<option value="">Seçiniz</option>
<option>Zafer Mahallesi</option>
<option>Kocasinan Mahallesi</option>
</select>
</div>

<div class="form-group">
<label>Açıklama</label>
<textarea id="dealContent" maxlength="500"></textarea>
</div>

<div class="form-group">
<label>Fotoğraf</label>
<input type="file" id="dealImage">
</div>

<button class="submit-btn" onclick="submitDeal()">Fırsatı Paylaş</button>

</div>
</div>

<!-- JS -->

<script src="assets/js/core.js" defer></script>
<script src="assets/js/slider.js" defer></script>
<script src="assets/js/countdown.js" defer></script>
<script src="assets/js/footerLegal.js" defer></script>

<script>

/* =========================
FILTER
========================= */
function filterDeals(type){
  const cards=document.querySelectorAll(".deal-card")
  cards.forEach(card=>{
    card.style.display=(type==="all"||card.dataset.type===type)?"block":"none"
  })
}

/* =========================
TYPE MODAL
========================= */
function openDealSelector(){
  document.getElementById("dealTypeModal").classList.add("active")
}

function selectDealType(type){
  document.getElementById("dealTypeModal").classList.remove("active")
  openDealForm(type)
}

/* =========================
SECURITY
========================= */
function sanitize(text){
  if(!text) return ""
  return text.replace(/[<>]/g,"")
}

/* =========================
DEAL MODAL
========================= */
window.openDealForm = function(type){

  console.log("openDealForm:", type)

  const modal = document.getElementById("dealModal")

  if(!modal){
    console.warn("dealModal yok")
    return
  }

  modal.classList.add("active")

  const linkBox = document.getElementById("linkBox")
  const districtBox = document.getElementById("districtBox")

  if(type === "online"){
    linkBox.style.display = "block"
    districtBox.style.display = "none"
  }else{
    linkBox.style.display = "none"
    districtBox.style.display = "block"
  }

}

/* 🔥 EKLENDİ */
window.closeDealForm = function(){
  document.getElementById("dealModal").classList.remove("active")
}

document.addEventListener("click", function(e){

  const typeModal = document.getElementById("dealTypeModal")
  const dealModal = document.getElementById("dealModal")

  if(e.target === typeModal){
    typeModal.classList.remove("active")
  }

  if(e.target === dealModal){
    closeDealForm()
  }

})

/* =========================
SUBMIT (DEMO SAFE)
========================= */
window.submitDeal = function(){

  const title = sanitize(document.getElementById("dealTitle").value)
  const content = sanitize(document.getElementById("dealContent").value)

  if(!title || !content){
    alert("Başlık ve açıklama zorunlu")
    return
  }

  console.log("DEAL SUBMIT:", {
    title,
    content
  })

  alert("Fırsat gönderildi (demo)")

  closeDealForm()
}

/* =========================
FAKE DATA (TEST İÇİN)
========================= */
function renderFakeDeals(){

  const container = document.getElementById("dealList")

  if(!container) return

  container.innerHTML = ""

  const data = [
    {title:"Trendyol %50 İndirim", type:"online"},
    {title:"A101 Haftalık Fırsat", type:"store"},
    {title:"Gratis 1 Alana 1 Bedava", type:"store"}
  ]

  data.forEach(d=>{
    const div = document.createElement("div")
    div.className = "deal-card"
    div.dataset.type = d.type
    div.innerText = d.title

    container.appendChild(div)
  })
}

/* =========================
INIT
========================= */
document.addEventListener("DOMContentLoaded", renderFakeDeals)

</script>

<div id="globalFooter"></div>
</body>
</html>
