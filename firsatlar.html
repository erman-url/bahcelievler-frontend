<style>

/* PREMIUM FAB */
.deal-add-btn{
  position:fixed;
  bottom:90px;
  right:20px;
  width:58px;
  height:58px;
  border-radius:50%;
  background:linear-gradient(135deg,#2563eb,#1e40af);
  box-shadow:0 10px 25px rgba(0,0,0,0.25);
  z-index:50;
}

/* TYPE MODAL */
.deal-type-modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.5);
  display:none;
  z-index:999;
}

.deal-type-modal.active{
  display:flex;
  align-items:center;
  justify-content:center;
}

.deal-type-box{
  background:#fff;
  padding:20px;
  border-radius:16px;
  width:90%;
  max-width:320px;
}

.deal-type-grid{
  display:flex;
  gap:12px;
  margin-top:15px;
}

.deal-type-card{
  flex:1;
  padding:20px;
  border-radius:12px;
  background:#f1f5f9;
  text-align:center;
  cursor:pointer;
  font-weight:600;
}

/* SKELETON */
.skeleton-card{
  height:100px;
  border-radius:12px;
  background:linear-gradient(90deg,#eee,#f5f5f5,#eee);
  animation:loading 1.2s infinite;
  margin-top:10px;
}

@keyframes loading{
  0%{background-position:-200px}
  100%{background-position:200px}
}

/* ===============================
PREMIUM HEADER (GLOBAL)
=============================== */

.premium-header{
margin:16px;
padding:20px;
border-radius:22px;

background:
linear-gradient(135deg,#2b7be4,#0e4fa8),
radial-gradient(circle at top right, rgba(255,255,255,.15), transparent);

box-shadow:
0 14px 35px rgba(0,0,0,.18),
inset 0 1px 0 rgba(255,255,255,.25);

color:#fff;
}

.header-content{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
}

.header-text .title{
font-size:24px;
font-weight:900;
text-shadow:0 3px 10px rgba(0,0,0,.3);
}

.header-text .sub{
font-size:14px;
opacity:.9;
margin-top:6px;
line-height:1.4;
}

.header-icon{
width:52px;
height:52px;
display:flex;
align-items:center;
justify-content:center;
border-radius:16px;
background:rgba(255,255,255,.2);
font-size:22px;
box-shadow:
0 6px 18px rgba(0,0,0,.25),
inset 0 1px 0 rgba(255,255,255,.3);
}

/* DEAL MODAL FIX */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.6);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
}

.modal.active{
  display:flex;
}

.modal-box{
  background:#fff;
  width:90%;
  max-width:420px;
  border-radius:16px;
  padding:20px;
  position:relative;
  animation:fadeIn .2s ease;
}

@keyframes fadeIn{
  from{opacity:0; transform:scale(.95)}
  to{opacity:1; transform:scale(1)}
}

.modal-close{
  position:absolute;
  top:10px;
  right:10px;
  background:none;
  border:none;
  font-size:18px;
  cursor:pointer;
}

</style>

</head>
<body>

<!-- GLOBAL HEADER -->

<div id="globalHeader"></div>

<main class="page-wrapper">


<div class="premium-header">

  <div class="header-content">

    <div class="header-text">
    <div class="title">🔥 Kaçırılmayacak Fırsatlar</div>

      <div class="sub">Online ve yerel indirimleri ilk sen yakala</div>
    </div>

    <div class="header-icon">
      <i class="fa-solid fa-bolt"></i>
    </div>

  </div>

</div>


<!-- FILTER -->

<div class="deal-filters">

<button class="filter-btn active" onclick="filterDeals('all')">Tümü</button>
<button class="filter-btn" onclick="filterDeals('online')">Online</button>
<button class="filter-btn" onclick="filterDeals('store')">Mağaza</button>

</div>

<!-- ACTION CARDS -->

<div class="action-grid">

<div class="action-card" onclick="openDealForm('online')">
<div class="action-icon tavsiye">
<i class="fa-solid fa-bolt"></i>
</div>
<div class="action-title">Online Fırsat Paylaş</div>
<div class="action-desc">E-ticaret indirimini paylaş</div>
</div>

<div class="action-card" onclick="openDealForm('store')">
<div class="action-icon sikayet">
<i class="fa-solid fa-store"></i>
</div>
<div class="action-title">Mağaza / Esnaf Fırsatı</div>
<div class="action-desc">Yerel kampanyayı paylaş</div>
</div>

</div>

<!-- DEAL FEED -->

<section id="dealList" class="deal-list">

<div class="empty-box">
Fırsatlar yükleniyor...
</div>

<div class="skeleton-card"></div>
<div class="skeleton-card"></div>

</section>

</main>

<!-- FLOATING ADD BUTTON -->

<button class="deal-add-btn" onclick="openDealSelector()">
<i class="fa-solid fa-plus"></i>
</button>

<!-- TYPE MODAL -->

<div class="deal-type-modal" id="dealTypeModal">
  <div class="deal-type-box">
    <div class="deal-type-title">Fırsat Türünü Seç</div>
    <div class="deal-type-grid">
      <div class="deal-type-card" onclick="selectDealType('online')">
        <i class="fa-solid fa-bolt"></i><br>Online
      </div>
      <div class="deal-type-card" onclick="selectDealType('store')">
        <i class="fa-solid fa-store"></i><br>Mağaza
      </div>
    </div>
  </div>
</div>

<!-- ADD DEAL MODAL -->

<div class="modal" id="dealModal">
<div class="modal-box">

<button class="modal-close" onclick="closeDealForm()">
<i class="fa-solid fa-xmark"></i>
</button>

<h3 id="dealFormTitle">Fırsat Paylaş</h3>

<!-- NICK -->
<div class="form-group">
<label>Nickname *</label>
<input type="text" id="nickname" maxlength="10" placeholder="örn: firsatsever">
</div>

<!-- STORE -->
<div class="form-group" id="storeBox">
<label>Site / Mağaza *</label>
<input type="text" id="storeName" placeholder="örn: Trendyol">
</div>

<!-- LINK -->
<div class="form-group" id="linkBox">
<label>Ürün Linki *</label>
<input type="url" id="dealLink" placeholder="https://...">
</div>

<!-- DISTRICT (SADECE MAĞAZA) -->
<div class="form-group" id="districtBox">
<label>Mahalle *</label>
<select id="district">
<option value="">Seçiniz</option>
<option>Zafer Mahallesi</option>
<option>Kocasinan Mahallesi</option>
</select>
</div>

<!-- CONTENT -->
<div class="form-group">
<label>Açıklama (opsiyonel)</label>
<textarea id="dealContent" maxlength="300"></textarea>
</div>

<!-- IMAGE -->
<div class="form-group">
<label>Fotoğraf (opsiyonel)</label>
<input type="file" id="dealImage">
</div>

<button class="submit-btn" onclick="submitDeal()">Fırsatı Paylaş</button>

</div>
</div>




<script>

/* =========================
FILTER
========================= */
function filterDeals(type){
  const cards = document.querySelectorAll(".deal-card")
  cards.forEach(card=>{
    card.style.display = (type==="all" || card.dataset.type===type) ? "block" : "none"
  })
}

/* =========================
TYPE MODAL
========================= */
function openDealSelector(){
  const modal = document.getElementById("dealTypeModal")
  if(modal) modal.classList.add("active")
}

function selectDealType(type){
  const modal = document.getElementById("dealTypeModal")
  if(modal) modal.classList.remove("active")
  openDealForm(type)
}

/* =========================
SECURITY
========================= */
function sanitize(text){
  if(!text) return ""
  return text.replace(/[<>]/g,"").trim()
}

/* =========================
DEAL MODAL
========================= */
window.openDealForm = function(type){

  console.log("openDealForm:", type)

  const modal = document.getElementById("dealModal")
  if(!modal){
    console.warn("dealModal yok")
    return
  }

  modal.classList.add("active")

  const linkBox = document.getElementById("linkBox")
  const districtBox = document.getElementById("districtBox")

  if(type === "online"){
    if(linkBox) linkBox.style.display = "block"
    if(districtBox) districtBox.style.display = "none"
  }else{
    if(linkBox) linkBox.style.display = "none"
    if(districtBox) districtBox.style.display = "block"
  }

}

/* =========================
CLOSE MODAL
========================= */
window.closeDealForm = function(){
  const modal = document.getElementById("dealModal")
  if(modal) modal.classList.remove("active")
}

/* =========================
OUTSIDE CLICK CLOSE
========================= */
document.addEventListener("click", function(e){

  const typeModal = document.getElementById("dealTypeModal")
  const dealModal = document.getElementById("dealModal")

  if(typeModal && e.target === typeModal){
    typeModal.classList.remove("active")
  }

  if(dealModal && e.target === dealModal){
    closeDealForm()
  }

})

/* =========================
SUBMIT DEAL (FULL FIX)
========================= */
window.submitDeal = async function(){

  const nickname = sanitize(document.getElementById("nickname")?.value)
  const store = sanitize(document.getElementById("storeName")?.value)
  const link = sanitize(document.getElementById("dealLink")?.value)
  const content = sanitize(document.getElementById("dealContent")?.value)
  const district = document.getElementById("district")?.value || ""

  const linkBox = document.getElementById("linkBox")
  const isOnline = linkBox && window.getComputedStyle(linkBox).display !== "none"

  const type = isOnline ? "online" : "store"

  // 🔥 backend için title üret
  const title = store || "Fırsat"

  console.log("SUBMIT DATA:", {nickname,title,content,store,link,district,type})

  /* =========================
  VALIDATION
  ========================= */

  if(!nickname || nickname.length < 3){
    alert("Nickname gerekli (min 3 karakter)")
    return
  }

  if(!store || store.length < 2){
    alert("Site / Mağaza zorunlu")
    return
  }

  if(type === "online" && (!link || link.length < 5)){
    alert("Link zorunlu")
    return
  }

  if(type === "store" && !district){
    alert("Mahalle seçiniz")
    return
  }

  /* =========================
  API REQUEST
  ========================= */

  try{

    const res = await fetch("https://bahcelievler-api.erman-urel.workers.dev/api/firsatlar",{
      method:"POST",
      headers:{
        "Content-Type":"application/json"
      },
      body:JSON.stringify({
        nickname,
        title,              // 🔥 backend uyum
        content,
        store_name: store,
        link,
        district,
        type
      })
    })

    const text = await res.text()

    if(!text){
      alert("Sunucu boş cevap verdi")
      return
    }

    let data
    try{
      data = JSON.parse(text)
    }catch{
      console.error("JSON PARSE ERROR:", text)
      alert("Sunucu hatalı cevap verdi")
      return
    }

    console.log("API RESPONSE:", data)

    if(!res.ok){
      alert("HTTP Hata: " + res.status)
      return
    }

    if(!data.ok){
      alert(data.error || "Backend hata verdi")
      return
    }

    /* =========================
    SUCCESS
    ========================= */

    alert("✅ Fırsat başarıyla eklendi")

    closeDealForm()

    setTimeout(()=>{
      fetchDeals()
    },500)

  }catch(e){
    alert("Sunucu hatası")
    console.error("FETCH ERROR:", e)
  }

}

/* =========================
FETCH REAL DEALS
========================= */
async function fetchDeals(){

  const container = document.getElementById("dealList")
  if(!container) return

  container.innerHTML = "Yükleniyor..."

  try{

    const res = await fetch("https://bahcelievler-api.erman-urel.workers.dev/api/firsatlar")

    const text = await res.text()

let data
try{
  data = JSON.parse(text)
}catch{
  console.error("JSON ERROR:", text)
  container.innerHTML = "Veri hatalı geldi"
  return
}

    if(!data.ok){
      container.innerHTML = "Veri alınamadı"
      return
    }

    renderDeals(data.data)

  }catch(e){
    console.error(e)
    container.innerHTML = "Sunucu hatası"
  }

}


/* =========================
RENDER DEALS
========================= */
function renderDeals(list){

  const container = document.getElementById("dealList")
  if(!container) return

  container.innerHTML = ""

  if(!list.length){
    container.innerHTML = "<div class='empty-box'>Henüz fırsat yok</div>"
    return
  }

  list.forEach(item=>{

    const div = document.createElement("div")
    div.className = "deal-card"
    div.dataset.type = item.type

    div.innerHTML = `
      <div class="deal-title">${item.title}</div>
      <div class="deal-content">${item.content}</div>
      ${item.store_name ? `<div class="deal-store">${item.store_name}</div>` : ""}
      ${item.link ? `<a href="${item.link}" target="_blank">Fırsata Git</a>` : ""}
      ${item.district ? `<div class="deal-district">${item.district}</div>` : ""}
    `

    container.appendChild(div)

  })

}


/* =========================
INIT
========================= */
document.addEventListener("DOMContentLoaded", fetchDeals)

</script>

<script src="assets/js/core.js" defer></script>
<script src="assets/js/footerLegal.js" defer></script>

<div id="globalFooter"></div>

</body>
