<!DOCTYPE html>
<html lang="tr" class="no-js">
<head>

<meta charset="UTF-8">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>İletişim | Bahçelievler Forum</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">

<style>

/* SAFE AREA */

body{
padding-top: env(safe-area-inset-top);
padding-bottom: calc(120px + env(safe-area-inset-bottom));
background:#f3f5f9;
}

/* WRAPPER */

.page-wrapper{
max-width:900px;
margin:0 auto;
padding:20px 14px;
}

/* TITLE */

.contact-title{
text-align:center;
font-weight:800;
font-size:20px;
margin-bottom:20px;
color:#0f3d6e;
}

/* MENU CARD */

.contact-link-card{

display:flex;
align-items:center;
gap:14px;

background:#e9edf2;
padding:18px;
border-radius:18px;

margin-bottom:14px;

text-decoration:none;
color:#1a2b44;
font-weight:600;

box-shadow:
inset 0 0 0 1px rgba(255,255,255,0.5),
0 6px 18px rgba(0,0,0,0.05);

transition:.25s;
}

.contact-link-card:hover{
transform:translateY(-2px);
box-shadow:0 10px 28px rgba(0,0,0,0.08);
}

/* ICON */

.contact-link-card i{

width:42px;
height:42px;

display:flex;
align-items:center;
justify-content:center;

background:#d8e1ea;
border-radius:12px;

color:#0f4e8c;
font-size:18px;

}

/* CONTENT BOX */

.contact-description-box{

margin-top:22px;

background:#f6f7f9;

padding:24px;
border-radius:20px;

box-shadow:0 8px 28px rgba(0,0,0,0.05);

line-height:1.7;
font-size:15px;

}

.contact-description-box h3{

text-align:center;
font-weight:800;
margin-bottom:18px;
font-size:16px;

}

.contact-description-box hr{

border:none;
border-top:1px solid #e2e6ea;
margin:14px 0;

}

.contact-link-card.active{
background:#dfe7f0;
transform:scale(1.02);
box-shadow:0 10px 26px rgba(0,0,0,0.08);
}

</style>

</head>

<body id="contactPage">

<div id="globalHeader"></div>

<div class="page-wrapper">

<div class="contact-title">
Kurumsal Bilgiler & İletişim Merkezi
</div>

<a href="#" class="contact-link-card" onclick="showLegal('about');return false;">
<i class="fa-solid fa-circle-info"></i>
<span>Hakkımızda</span>
</a>

<a href="#" class="contact-link-card" onclick="showLegal('disclaimer');return false;">
<i class="fa-solid fa-scale-balanced"></i>
<span>Yasal Uyarı</span>
</a>

<a href="#" class="contact-link-card" onclick="showLegal('kvkk');return false;">
<i class="fa-solid fa-shield-halved"></i>
<span>KVKK & Gizlilik</span>
</a>

<a href="#" class="contact-link-card" onclick="showLegal('sss');return false;">
<i class="fa-solid fa-circle-question"></i>
<span>Sıkça Sorulan Sorular</span>
</a>

<a href="#" class="contact-link-card" onclick="showLegal('contact-info');return false;">
<i class="fa-solid fa-envelope"></i>
<span>Bize Yazın</span>
</a>

<div id="legal-content-area" class="contact-description-box">

Platformumuz hakkında yasal bilgiler, gizlilik politikaları ve
iletişim kanallarına buradan ulaşabilirsiniz.

</div>

</div>

<div id="globalFooter"></div>

<script src="assets/js/layout.js"></script>
<script src="assets/js/menu.js"></script>
<script src="assets/js/core.js" defer></script>
<script src="assets/js/footerNav.js"></script>

<script src="assets/js/modules/contact.js"></script>

</body>
</html>
