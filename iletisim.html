<!DOCTYPE html>
<html lang="tr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Kurumsal Bilgiler & İletişim | Bahçelievler Forum</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

body{
margin:0;
font-family:system-ui;
background:#eef2f6;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

/* TITLE */

.page-title{
text-align:center;
font-weight:700;
font-size:22px;
margin-bottom:20px;
color:#0f2c4d;
}

/* MENU CARDS */

.menu-card{

display:flex;
align-items:center;

background:#f1f4f7;

padding:18px;

border-radius:18px;

margin-bottom:14px;

cursor:pointer;

transition:.2s;

border:1px solid #e2e6ea;

}

.menu-card:hover{
background:white;
}

.menu-icon{

width:44px;
height:44px;

display:flex;
align-items:center;
justify-content:center;

border-radius:12px;

background:#e7edf4;

margin-right:14px;

font-size:18px;
color:#1f4f82;

}

.menu-title{

font-weight:600;
font-size:15px;

}

/* INFO */

.info-box{

margin-top:18px;

background:white;

border-radius:20px;

padding:24px;

box-shadow:0 8px 18px rgba(0,0,0,0.08);

display:none;

}

.info-box h2{
text-align:center;
margin-bottom:14px;
}

.info-box hr{
margin:12px 0 18px;
border:none;
border-top:1px solid #eee;
}

.info-box p{
line-height:1.6;
font-size:14px;
margin-bottom:14px;
}

.info-box li{
margin-bottom:10px;
}

.footer-note{

margin-top:20px;

background:white;

padding:16px;

border-radius:18px;

text-align:center;

font-size:13px;

color:#555;

box-shadow:0 6px 14px rgba(0,0,0,0.06);

}

</style>

</head>

<body>

<div class="container">

<div class="page-title">
Kurumsal Bilgiler & İletişim Merkezi
</div>


<div class="menu-card" onclick="openSection('hakkimizda')">
<div class="menu-icon"><i class="fa-solid fa-circle-info"></i></div>
<div class="menu-title">Hakkımızda</div>
</div>

<div class="menu-card" onclick="openSection('yasal')">
<div class="menu-icon"><i class="fa-solid fa-scale-balanced"></i></div>
<div class="menu-title">Yasal Uyarı</div>
</div>

<div class="menu-card" onclick="openSection('kvkk')">
<div class="menu-icon"><i class="fa-solid fa-shield-halved"></i></div>
<div class="menu-title">KVKK & Gizlilik</div>
</div>

<div class="menu-card" onclick="openSection('sss')">
<div class="menu-icon"><i class="fa-solid fa-circle-question"></i></div>
<div class="menu-title">Sıkça Sorulan Sorular</div>
</div>

<div class="menu-card" onclick="openSection('iletisim')">
<div class="menu-icon"><i class="fa-solid fa-envelope"></i></div>
<div class="menu-title">Bize Yazın</div>
</div>


<!-- DETAY ALANI -->

<div id="contentArea"></div>

<div class="footer-note">
Platformumuz hakkında yasal bilgiler, gizlilik politikaları ve iletişim kanallarına buradan ulaşabilirsiniz.
</div>

</div>

<script>

function openSection(type){

let content="";

if(type==="hakkimizda"){

content=`
<div class="info-box" style="display:block">
<h2>HAKKIMIZDA</h2>
<hr>

<p>Bahçelievler Forum, ilçemizin dijitalleşme sürecinde yerel kültürü koruyarak geleceğe taşıma hedefiyle kurulmuş bağımsız bir mahalle platformudur. Geleneksel komşuluk anlayışını modern teknolojiyle birleştirerek, semt içi iletişimi daha hızlı, güvenli ve sürdürülebilir hale getirmeyi amaçlar.</p>

<p>Amacımız; Bahçelievler sakinlerinin ilan, duyuru ve hizmet ihtiyaçlarını tek merkezde buluşturmak, yerel esnafın dijital görünürlüğünü artırmak ve mahalle ekonomisini güçlendirmektir. Platformumuz; ikinci el ilanlardan emlak taleplerine, fiyat radarından mahalle duyurularına, tavsiye paylaşımlarından hizmet tanıtımlarına kadar geniş kapsamlı bir yerel bilgi ağı sunar.</p>

<p><strong>Vizyonumuz:</strong> Bahçelievler’in en güvenilir dijital rehberi ve yerel ekonomi merkezi olmak. Sürekli gelişen altyapımız ve veri odaklı yaklaşımımızla, semt içi etkileşimi artıran ve sürdürülebilir bir mahalle ekosistemi oluşturan öncü bir platform olmayı hedefliyoruz.</p>

<p>Bahçelievler Forum, yerel değerleri teknolojiyle buluşturan ve mahalle ruhunu dijital dünyada yaşatan güçlü bir girişimdir.</p>

</div>
`;
}

if(type==="yasal"){

content=`
<div class="info-box" style="display:block">
<h2>YASAL UYARI</h2>
<hr>

<p><strong>⚖️ KULLANIM KOŞULLARI VE SORUMLULUK REDDİ BEYANI</strong></p>

<p><strong>1. HİZMET TANIMI VE HUKUKİ STATÜ:</strong> Bahçelievler Forum, 5651 sayılı Kanun kapsamında yer sağlayıcı niteliğinde faaliyet gösteren dijital bir platformdur.</p>

<p><strong>2. İÇERİK SORUMLULUĞU:</strong> Platformda yer alan tüm içeriklerin hukuki ve cezai sorumluluğu içeriği paylaşan kullanıcıya aittir.</p>

<p><strong>3. TİCARİ İŞLEMLER:</strong> Platform üzerinden gerçekleşen işlemlerde Bahçelievler Forum taraf değildir.</p>

<p><strong>4. FİYAT RADARI:</strong> Kullanıcı beyanına dayanır.</p>

<p><strong>5. HİZMET SAĞLAYICILAR:</strong> Platform yalnızca iletişim kurulmasına aracılık eder.</p>

<p><strong>6. TELİF HAKLARI:</strong> İçerik hakları kullanıcıya aittir.</p>

<p><strong>7. TEKNİK SÜREKLİLİK:</strong> Platform teknik sorunlardan sorumlu değildir.</p>

<p><strong>8. DIŞ BAĞLANTILAR:</strong> Harici siteler platformdan bağımsızdır.</p>

<p><strong>9. İÇERİK KALDIRMA:</strong> Mevzuata aykırı içerikler kaldırılabilir.</p>

</div>
`;
}

if(type==="kvkk"){

content=`
<div class="info-box" style="display:block">
<h2>KVKK & GİZLİLİK</h2>
<hr>

<p><strong>1. VERİ SORUMLUSU:</strong> Bahçelievler Forum veri sorumlusudur.</p>

<p><strong>2. İŞLENEN VERİLER:</strong> E-posta, IP adresi, log kayıtları ve görseller.</p>

<p><strong>3. VERİ AMAÇLARI:</strong> Platform güvenliği ve ilan yönetimi.</p>

<p><strong>4. SAKLAMA:</strong> Veriler Supabase altyapısında tutulur.</p>

<p><strong>5. SİLME HAKKI:</strong> Kullanıcılar içeriklerini kaldırabilir.</p>

<p><strong>6. HAKLAR:</strong> KVKK madde 11 kapsamında haklar kullanılabilir.</p>

</div>
`;
}

if(type==="sss"){

content=`
<div class="info-box" style="display:block">
<h2>SIKÇA SORULAN SORULAR</h2>
<hr>

<ul>
<li>Paylaşımlar silme şifresi ile kaldırılabilir.</li>
<li>Şifre unutulursa iletişim üzerinden destek alınabilir.</li>
<li>Fiyat Dedektifi kullanıcıların paylaştığı fiyat verilerine dayanır.</li>
<li>Bahçelievler Forum bağımsız bir mahalle platformudur.</li>
</ul>

</div>
`;
}

if(type==="iletisim"){

content=`
<div class="info-box" style="display:block">
<h2>BİZE YAZIN</h2>
<hr>

<p>Öneri, teknik sorun veya içerik kaldırma taleplerinizi bize iletebilirsiniz.</p>

<p>Email: iletisim@bahcelievlerforum.com</p>

</div>
`;
}

document.getElementById("contentArea").innerHTML=content;

window.scrollTo({
top:document.getElementById("contentArea").offsetTop-40,
behavior:"smooth"
});

}

</script>

</body>
</html>
