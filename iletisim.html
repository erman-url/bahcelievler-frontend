<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Kurumsal Bilgiler & İletişim Merkezi | Bahçelievler Forum</title>
<meta name="description" content="Bahçelievler Forum hakkında kurumsal bilgiler, kullanım koşulları, KVKK aydınlatma metni ve sıkça sorulan sorular. İletişim formu üzerinden bize ulaşabilirsiniz.">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#2563eb">

<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
:root{
  --bg:#eef2f6;
  --card:#ffffff;
  --soft:#f3f5f8;
  --border:#e4e8ec;
  --primary:#1f4f82;
  --shadow:0 10px 24px rgba(0,0,0,.08),0 2px 6px rgba(0,0,0,.05);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu;
  background:var(--bg);
  color:#1f2937;
}
.container{
  max-width:980px;
  margin:auto;
  padding:18px;
}
.title{
  text-align:center;
  font-weight:800;
  font-size:22px;
  margin:6px 0 20px;
  color:#163d66;
}

/* MENU CARDS */
.menu-card{
  display:flex;
  align-items:center;
  background:var(--soft);
  padding:16px;
  border-radius:18px;
  margin-bottom:12px;
  cursor:pointer;
  border:1px solid var(--border);
  transition:.18s ease;
}
.menu-card:hover{ background:#fff; box-shadow:var(--shadow); }
.icon{
  width:42px;height:42px;min-width:42px;
  display:flex;align-items:center;justify-content:center;
  border-radius:12px;background:#e8edf3;color:var(--primary);
  margin-right:12px;font-size:18px;
}
.menu-title{ font-weight:700; }

/* CONTENT AREA */
.content{ margin-top:16px; }
.info-box{
  background:var(--card);
  border-radius:20px;
  padding:22px;
  box-shadow:var(--shadow);
  margin-bottom:16px;
}
.info-box h2{
  text-align:center;
  margin:0 0 6px;
}
.info-box hr{
  border:none;border-top:1px solid #eee;margin:10px 0 16px;
}

/* LONG TEXT – NO OVERFLOW */
.longtext{
  max-height:420px;           /* taşmayı engeller */
  overflow:auto;              /* içeride kaydırma */
  padding-right:6px;
}
.longtext p{ line-height:1.7; font-size:14px; margin:0 0 12px; }
.longtext li{ margin:0 0 10px; line-height:1.7; font-size:14px; }

/* CONTACT FORM */
.contact-box{
  background:var(--card);
  border-radius:20px;
  padding:20px;
  box-shadow:var(--shadow);
}
.form-group{ margin-bottom:12px; }
input,textarea{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #ddd;
  font-size:14px;
}
textarea{ min-height:120px; resize:vertical; }
button{
  width:100%;
  border:none;
  background:#2563eb;
  color:#fff;
  padding:14px;
  border-radius:12px;
  font-weight:700;
  cursor:pointer;
}
.footer-note{
  margin-top:14px;
  background:#fff;
  border-radius:16px;
  padding:12px;
  text-align:center;
  font-size:13px;
  color:#6b7280;
}
</style>
</head>

<body>
<div class="container">

<h1 class="title">Kurumsal Bilgiler & İletişim Merkezi</h1>

<!-- MENÜ -->
<div class="menu-card" onclick="openSection('about')">
  <div class="icon"><i class="fa-solid fa-circle-info"></i></div>
  <div class="menu-title">Hakkımızda</div>
</div>

<div class="menu-card" onclick="openSection('legal')">
  <div class="icon"><i class="fa-solid fa-scale-balanced"></i></div>
  <div class="menu-title">Yasal Uyarı</div>
</div>

<div class="menu-card" onclick="openSection('kvkk')">
  <div class="icon"><i class="fa-solid fa-shield-halved"></i></div>
  <div class="menu-title">KVKK & Gizlilik</div>
</div>

<div class="menu-card" onclick="openSection('faq')">
  <div class="icon"><i class="fa-solid fa-circle-question"></i></div>
  <div class="menu-title">Sıkça Sorulan Sorular</div>
</div>

<div class="menu-card" onclick="openSection('contact')">
  <div class="icon"><i class="fa-solid fa-envelope"></i></div>
  <div class="menu-title">Bize Yazın</div>
</div>

<div id="content" class="content"></div>

<div class="footer-note">
Platformumuz hakkında yasal bilgiler, gizlilik politikaları ve iletişim kanallarına buradan ulaşabilirsiniz.
</div>

</div>

<script>
function openSection(type){
  const c=document.getElementById("content");

  if(type==="about"){
    c.innerHTML=`
    <section class="info-box">
      <h2>HAKKIMIZDA</h2><hr>
      <div class="longtext">
        <p>Bahçelievler Forum, ilçemizin dijitalleşme sürecinde yerel kültürü koruyarak geleceğe taşıma hedefiyle kurulmuş bağımsız bir mahalle platformudur. Geleneksel komşuluk anlayışını modern teknolojiyle birleştirerek, semt içi iletişimi daha hızlı, güvenli ve sürdürülebilir hale getirmeyi amaçlar.</p>

        <p>Amacımız; Bahçelievler sakinlerinin ilan, duyuru ve hizmet ihtiyaçlarını tek merkezde buluşturmak, yerel esnafın dijital görünürlüğünü artırmak ve mahalle ekonomisini güçlendirmektir. Platformumuz; ikinci el ilanlardan emlak taleplerine, fiyat radarından mahalle duyurularına, tavsiye paylaşımlarından hizmet tanıtımlarına kadar geniş kapsamlı bir yerel bilgi ağı sunar.</p>

        <p><strong>Vizyonumuz:</strong> Bahçelievler’in en güvenilir dijital rehberi ve yerel ekonomi merkezi olmak. Sürekli gelişen altyapımız ve veri odaklı yaklaşımımızla, semt içi etkileşimi artıran ve sürdürülebilir bir mahalle ekosistemi oluşturan öncü bir platform olmayı hedefliyoruz.</p>

        <p>Bahçelievler Forum, yerel değerleri teknolojiyle buluşturan ve mahalle ruhunu dijital dünyada yaşatan güçlü bir girişimdir.</p>
      </div>
    </section>`;
  }

  if(type==="legal"){
    c.innerHTML=`
   <section class="info-box">
  <h2>⚖️ Kullanım Koşulları ve Sorumluluk Reddi</h2><hr>
  <div class="longtext">

  <p><strong>1. HİZMET TANIMI VE HUKUKİ STATÜ:</strong> Bahçelievler Forum, 5651 sayılı Kanun kapsamında yer sağlayıcı niteliğinde faaliyet gösteren dijital bir platformdur. Platform; kullanıcılar tarafından oluşturulan içerikleri barındırır ve yayınlar. Yayınlanan içerikler önceden hukuki veya editoryal incelemeye tabi tutulmaz.</p>

  <p><strong>2. İÇERİK SORUMLULUĞU:</strong> Platformda yer alan ilan, yorum, tavsiye, şikayet, fiyat bilgisi, görsel ve diğer tüm içeriklerin hukuki ve cezai sorumluluğu tamamen içeriği paylaşan kullanıcıya aittir. Bahçelievler Forum, içeriklerin doğruluğunu, güncelliğini, güvenilirliğini veya hukuka uygunluğunu garanti etmez. Üçüncü kişilik haklarını ihlal eden, gerçeğe aykırı, yanıltıcı veya mevzuata aykırı içeriklerden doğabilecek tüm sonuçlar ilgili kullanıcıya aittir.</p>

  <p><strong>3. TİCARİ İŞLEMLER VE SÖZLEŞME İLİŞKİSİ:</strong> Platform üzerinden gerçekleşen alım-satım, hizmet temini, teklif, pazarlık ve iletişim süreçlerinde Bahçelievler Forum taraf değildir. Kullanıcılar arasındaki işlemler tamamen bağımsızdır. Bu kapsamda oluşabilecek maddi zarar, ayıplı mal, eksik hizmet, dolandırıcılık, sözleşme ihlali veya sair ihtilaflardan platform sorumlu tutulamaz.</p>

  <p><strong>4. FİYAT RADARI VE BİLGİ AMAÇLI İÇERİK:</strong> “Fiyat Dedektifi” ve benzeri bölümlerde yer alan fiyat ve ürün bilgileri kullanıcı beyanına dayanır. Bu bilgiler ticari teklif veya taahhüt niteliği taşımaz. İşletmelerin anlık fiyat değişikliği yapma hakkı saklıdır. Fiyat farklılıklarından platform sorumlu değildir.</p>

  <p><strong>5. HİZMET SAĞLAYICILAR VE TEKLİF SİSTEMİ:</strong> “Teklif Al” veya benzeri yönlendirme sistemleri yalnızca iletişim kurulmasına aracılık eder. Hizmet kalitesi, ücretlendirme, ifa süresi ve sözleşme şartları taraflar arasında belirlenir. Platform herhangi bir garanti, taahhüt veya kefalet sunmaz.</p>

  <p><strong>6. TELİF HAKLARI VE FİKRİ MÜLKİYET:</strong> Kullanıcılar yükledikleri içeriklerin kendilerine ait olduğunu veya kullanım hakkına sahip olduklarını beyan ve taahhüt eder. Telif hakkı ihlali durumunda doğabilecek hukuki sorumluluk ilgili kullanıcıya aittir. Hak sahiplerinden gelen usulüne uygun başvurular halinde içerik yayından kaldırılabilir.</p>

  <p><strong>7. TEKNİK SÜREKLİLİK VE VERİ SORUMLULUĞU:</strong> Platform; bakım çalışmaları, teknik arızalar, siber saldırılar, mücbir sebepler veya üçüncü taraf servis kesintileri nedeniyle oluşabilecek erişim sorunları ve veri kayıplarından sorumlu değildir. Kullanıcılar paylaştıkları içeriklerin yedeğini almakla yükümlüdür.</p>

  <p><strong>8. DIŞ BAĞLANTILAR:</strong> Platformda yer alan üçüncü taraf bağlantılar (harici web siteleri, servis sağlayıcılar vb.) bağımsız yapılardır. Bu sitelerin içerik, güvenlik ve veri politikalarından platform sorumlu değildir.</p>

  <p><strong>9. İÇERİK KALDIRMA VE ERİŞİM ENGELLEME:</strong> Mevzuata aykırı olduğu değerlendirilen veya yetkili makamlarca bildirilen içerikler, platform yönetimi tarafından kaldırılabilir. Platform, topluluk kurallarına aykırı içerikleri önceden bildirim olmaksızın yayından kaldırma hakkını saklı tutar.</p>

  <p><strong>10. KABUL BEYANI:</strong> Platformu kullanan tüm ziyaretçiler yukarıdaki kullanım koşullarını okumuş ve kabul etmiş sayılır. Bahçelievler Forum, kullanım koşullarını mevzuat değişiklikleri doğrultusunda güncelleme hakkını saklı tutar.</p>

  </div>
</section>`;
  }

  if(type==="kvkk"){
    c.innerHTML=`
    <section class="info-box">
      <h2>🛡️ KVKK Aydınlatma Metni</h2><hr>
      <div class="longtext">
      <p><strong>1. VERİ SORUMLUSU:</strong> 6698 sayılı KVKK kapsamında Bahçelievler Forum veri sorumlusudur.</p>

      <p><strong>2. İŞLENEN VERİLER:</strong> E-posta adresi, IP bilgisi, silme şifresi ve görseller.</p>

      <p><strong>3. AMAÇ:</strong> Platform güvenliği, ilan yönetimi ve kullanıcı talepleri.</p>

      <p><strong>4. SAKLAMA:</strong> Veriler Supabase altyapısında saklanır.</p>

      <p><strong>5. SİLME HAKKI:</strong> Kullanıcı içeriklerini kaldırabilir.</p>

      <p><strong>6. HAKLAR:</strong> KVKK madde 11 kapsamında haklar kullanılabilir.</p>
      </div>
    </section>`;
  }

  if(type==="faq"){
    c.innerHTML=`
    <section class="info-box">
      <h2>❓ Sıkça Sorulan Sorular</h2><hr>
      <div class="longtext">
        <p><strong>1.</strong> Paylaşımlar silme şifresi ile kaldırılabilir.</p>
        <p><strong>2.</strong> Şifre unutulursa iletişim üzerinden destek alınabilir.</p>
        <p><strong>3.</strong> Fiyat Dedektifi kullanıcı verilerine dayanır.</p>
        <p><strong>4.</strong> Platform bağımsız bir mahalle platformudur.</p>
      </div>
    </section>`;
  }

  if(type==="contact"){
    c.innerHTML=`
    <section class="contact-box">
      <h2 style="text-align:center">Bize Yazın</h2>
      <div class="form-group"><input placeholder="Ad Soyad"></div>
      <div class="form-group"><input placeholder="E-posta"></div>
      <div class="form-group"><textarea placeholder="Mesajınızı yazabilirsiniz..."></textarea></div>
      <button>Mesaj Gönder</button>
    </section>`;
  }

  window.scrollTo({top:c.offsetTop-30,behavior:"smooth"});
}
</script>
</body>
</html>
