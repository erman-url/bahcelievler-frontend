<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Mühürlü Geçit Oyunu | Bahçelievler Forum</title>

<meta name="description" content="Mühürlü Geçit oyununu oyna, doğru kodu çöz ve ödülü kazan. Bahçelievler Forum mobil oyun.">
<meta name="keywords" content="ödüllü oyun, şifre oyunu, mobil oyun, bahçelievler forum oyun">

<meta name="robots" content="index,follow">
<link rel="canonical" href="https://bahcelievlerforum.com/odullu-oyun.html">

<meta name="theme-color" content="#070a12">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>

/* RESET */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#070a12;
font-family:system-ui;
}

/* BACK BUTTON */
.back-btn{
position:fixed;
top:12px;
left:12px;
z-index:99999;
color:#fff;
font-size:20px;
background:rgba(0,0,0,0.5);
padding:10px 14px;
border-radius:10px;
cursor:pointer;
}

/* FULLSCREEN */
.scene{
position:fixed;
inset:0;
width:100%;
height:100%;
overflow:hidden;
}

/* DOOR */
.door{
position:absolute;
inset:0;
}

.door img{
width:100%;
height:100%;
object-fit:cover;
}

/* LOCK */
.lock{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:clamp(180px,28vw,260px);
aspect-ratio:1/1;
z-index:5;
}

.lock img{
width:100%;
}

/* CODE */
.code-ring{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:65%;
height:65%;
border-radius:50%;
background:radial-gradient(circle,#000,#111);
display:flex;
align-items:center;
justify-content:center;
gap:10px;
color:#e8c36a;
}

.digit{
width:25%;
text-align:center;
font-size:22px;
cursor:pointer;
}

/* PARTICLES */
canvas{
position:absolute;
inset:0;
pointer-events:none;
}

</style>
</head>

<body>

<div class="back-btn" onclick="goBack()">←</div>

<div class="scene">

<canvas id="orbs"></canvas>

<div class="door" id="door">
<img src="assets/images/door.jpg">

<div class="lock" id="lock">
<img src="assets/images/lock.png">

<div class="code-ring">
<div class="digit">0</div>
<div class="digit">0</div>
<div class="digit">0</div>
<div class="digit">0</div>
</div>

</div>
</div>

</div>

<script>

/* BACK */
function goBack(){
location.href="online-oyunlar.html";
}

/* VH FIX */
function setVH(){
let vh=window.innerHeight*0.01;
document.documentElement.style.setProperty('--vh',vh+"px");
}
setVH();
window.addEventListener("resize",setVH);

/* AUDIO */
let mainSound=new Audio("assets/audio/main_sound.mp3");
let basSound=new Audio("assets/audio/bas_sound.mp3");
let wrongSound=new Audio("assets/audio/wrongsound.mp3");

mainSound.loop=true;
mainSound.volume=0.6;

let audioStarted=false;
function initAudio(){
if(audioStarted) return;
mainSound.play();
audioStarted=true;
}
document.addEventListener("click",initAudio);
document.addEventListener("touchstart",initAudio);

/* CODE SYSTEM */
let code=[0,0,0,0];
const correctCode="4729";

function render(){
document.querySelectorAll(".digit").forEach((el,i)=>{
el.textContent=code[i];
});
}
render();

function check(){
if(code.join("")===correctCode){
alert("🎉 Açıldı!");
}else{
wrongSound.currentTime=0;
wrongSound.play();
}
}

/* INPUT */
const isMobile='ontouchstart' in window;

document.querySelectorAll(".digit").forEach((el,index)=>{

let startY=0;
let moved=false;

if(isMobile){

el.addEventListener("touchstart",(e)=>{
startY=e.touches[0].clientY;
moved=false;
},{passive:true});

el.addEventListener("touchmove",(e)=>{
let diff=e.touches[0].clientY-startY;

if(Math.abs(diff)>25){
e.preventDefault();
moved=true;

if(diff<0) code[index]=(code[index]+1)%10;
else code[index]=(code[index]-1+10)%10;

basSound.currentTime=0;
basSound.play();
render();

startY=e.touches[0].clientY;
}
},{passive:false});

el.addEventListener("touchend",()=>{
if(!moved){
code[index]=(code[index]+1)%10;
basSound.play();
render();
}
});

}else{

el.addEventListener("wheel",(e)=>{
e.preventDefault();

if(e.deltaY>0) code[index]=(code[index]+1)%10;
else code[index]=(code[index]-1+10)%10;

render();
});

}

});

/* LOCK CLICK */
let isDragging=false;

document.querySelectorAll(".digit").forEach(el=>{
el.addEventListener("touchmove",()=>isDragging=true);
el.addEventListener("touchend",()=>setTimeout(()=>isDragging=false,50));
});

document.getElementById("lock").addEventListener("click",()=>{
if(!isDragging) check();
});

/* PARTICLES */
const canvas=document.getElementById("orbs");
const ctx=canvas.getContext("2d");

function resizeCanvas(){
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
}
resizeCanvas();
window.addEventListener("resize",resizeCanvas);

let particles=[];
for(let i=0;i<30;i++){
particles.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
r:Math.random()*6+2,
dx:(Math.random()-.5)*0.3,
dy:(Math.random()-.5)*0.3
});
}

function animate(){
ctx.clearRect(0,0,canvas.width,canvas.height);
particles.forEach(p=>{
ctx.beginPath();
ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
ctx.fillStyle="rgba(255,220,120,.15)";
ctx.fill();

p.x+=p.dx;
p.y+=p.dy;

if(p.x<0||p.x>canvas.width)p.dx*=-1;
if(p.y<0||p.y>canvas.height)p.dy*=-1;
});
requestAnimationFrame(animate);
}
animate();

</script>

</body>
</html>
