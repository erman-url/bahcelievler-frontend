<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Mühürlü Geçit Oyunu | Bahçelievler Forum</title>

<meta name="theme-color" content="#070a12">

<style>

/* RESET */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}

html,body{
width:100%;
height:100%;
overflow:hidden;
background:#070a12;
font-family:system-ui;
}

/* BACK */
.back-btn{
position:fixed;
top:12px;
left:12px;
z-index:99999;
color:#fff;
font-size:20px;
background:rgba(0,0,0,0.5);
padding:10px 14px;
border-radius:10px;
cursor:pointer;
}

/* SCENE */
.scene{
position:fixed;
inset:0;
}

/* DOOR */
.door{
position:absolute;
inset:0;
}

.door img{
width:100%;
height:100%;
object-fit:cover;
}

/* 🔥 YAKINDA BANNER */
.coming-banner{
position:absolute;
top:18%;
left:50%;
transform:translateX(-50%);
width:70%;
padding:14px;
text-align:center;
font-size:22px;
font-weight:900;
letter-spacing:2px;
color:#fff;
border-radius:14px;

background:rgba(255,255,255,0.08);
backdrop-filter:blur(8px);

border:1px solid rgba(255,255,255,0.15);

box-shadow:
0 0 25px rgba(255,200,100,0.25),
inset 0 0 10px rgba(255,255,255,0.15);

z-index:6;
}

.coming-banner span{
background:linear-gradient(90deg,#facc15,#fff,#facc15);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
animation:shine 3s linear infinite;
}

@keyframes shine{
0%{background-position:-200px;}
100%{background-position:200px;}
}

/* LOCK */
.lock{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:clamp(180px,28vw,260px);
z-index:5;
}

.lock img{
width:100%;
}

/* CODE */
.code-ring{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:65%;
height:65%;
border-radius:50%;
background:radial-gradient(circle,#000,#111);
display:flex;
align-items:center;
justify-content:center;
gap:10px;
color:#e8c36a;
}

.digit{
width:25%;
text-align:center;
font-size:22px;
}

/* PARTICLES */
canvas{
position:absolute;
inset:0;
pointer-events:none;
}

/* 🦔 KİRPİ */
#kirpiWrap{
position:absolute;
bottom:5px;
right:-200px;
display:flex;
flex-direction:column-reverse;
align-items:center;
z-index:7;
pointer-events:none;
will-change:transform,left,right;
}

/* 🔥 BALON FULL FIX */
#kirpiBubble{
position:relative;
margin-top:8px;

padding:10px 14px;
font-size:13px;
font-weight:800;

color:#111;
background:rgba(255,255,255,0.95); /* FIX */

border-radius:14px;

box-shadow:
0 10px 25px rgba(0,0,0,.35),
0 0 0 1px rgba(0,0,0,.08);

opacity:0;
transform:translateY(10px);
transition:.3s ease;

white-space:nowrap;
}

/* 🔥 TEK OK (duplicate silindi, override edildi) */
#kirpiBubble:after{
content:"";
position:absolute;
top:-6px;
left:50%;
transform:translateX(-50%);
border-width:6px;
border-style:solid;
border-color:transparent transparent white transparent;
}

</style>
</head>

<body>

<div class="back-btn" onclick="location.href='online-oyunlar.html'">←</div>

<div class="scene">

<canvas id="orbs"></canvas>

<div class="door">

<img src="assets/images/door.jpg">

<!-- 🔥 YAKINDA -->
<div class="coming-banner">
<span>YAKINDA</span>
</div>

<!-- 🦔 KİRPİ -->
<div id="kirpiWrap">
  <img src="assets/images/kirpix.png" id="kirpi">
  <div id="kirpiBubble">Şifreyi Çöz Ödülü Kazan</div>
</div>

<div class="lock" id="lock">
<img src="assets/images/lock.png">

<div class="code-ring">
<div class="digit">•</div>
<div class="digit">•</div>
<div class="digit">•</div>
<div class="digit">•</div>
</div>

</div>

</div>

</div>

<script>

/* AUDIO */
let mainSound=new Audio("assets/audio/main_sound.mp3");
mainSound.loop=true;

document.addEventListener("click",()=>{
mainSound.play();
},{once:true});

/* ŞİFRE */
function getSecret(){
const encoded = "OTI3NA==";
const decoded = atob(encoded);
return decoded.split("").reverse().join("");
}

/* LOCK */
document.getElementById("lock").addEventListener("click",()=>{
alert("🔒 Oyun çok yakında aktif olacak");
});

/* PARTICLES */
const canvas=document.getElementById("orbs");
const ctx=canvas.getContext("2d");

function resizeCanvas(){
canvas.width=window.innerWidth;
canvas.height=window.innerHeight;
}
resizeCanvas();
window.addEventListener("resize",resizeCanvas);

let particles=[];
for(let i=0;i<30;i++){
particles.push({
x:Math.random()*canvas.width,
y:Math.random()*canvas.height,
r:Math.random()*6+2,
dx:(Math.random()-.5)*0.3,
dy:(Math.random()-.5)*0.3
});
}

function animate(){
ctx.clearRect(0,0,canvas.width,canvas.height);
particles.forEach(p=>{
ctx.beginPath();
ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
ctx.fillStyle="rgba(255,220,120,.15)";
ctx.fill();

p.x+=p.dx;
p.y+=p.dy;

if(p.x<0||p.x>canvas.width)p.dx*=-1;
if(p.y<0||p.y>canvas.height)p.dy*=-1;
});
requestAnimationFrame(animate);
}
animate();

/* 🦔 KİRPİ */
let kirpiPlayed = false;

function startKirpi(){

if(kirpiPlayed) return;
kirpiPlayed = true;

const wrap = document.getElementById("kirpiWrap");
const bubble = document.getElementById("kirpiBubble");

if(!wrap) return;

const delay = Math.random() * 4000 + 2000;

setTimeout(()=>{

/* 🔥 ORTA FIX */
wrap.style.left = "50%";
wrap.style.right = "auto";
wrap.style.transform = "translateX(-50%)";

setTimeout(()=>{

bubble.style.opacity = "1";
bubble.style.transform = "translateY(0)";

setTimeout(()=>{

bubble.style.opacity = "0";

setTimeout(()=>{

/* 🔥 TAM ÇIKIŞ FIX */
wrap.style.transform = "translateX(-150vw)";

/* 🔥 TEMİZLE */
setTimeout(()=>{
wrap.style.display="none";
},1600);

},300);

},5000);

},1200);

},delay);

}

document.addEventListener("DOMContentLoaded", startKirpi);

</script>

</body>
</html>
