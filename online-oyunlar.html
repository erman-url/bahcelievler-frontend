<script>

/* 🔒 ORİJİNAL JS TAMAMEN KORUNDU */

let canvas=document.getElementById("gameCanvas")
let ctx=canvas.getContext("2d")

let currentGame=null
let score=0

function openGame(){
document.getElementById("menu").style.display="none"
document.getElementById("gameArea").style.display="block"
}

function goMenu(){
location.reload()
}

function gameOver(text){
document.getElementById("finalScore").innerText=text
document.getElementById("gameOver").style.display="flex"
}

function restartGame(){
document.getElementById("gameOver").style.display="none"

if(currentGame==="2048") start2048()
if(currentGame==="flappy") startFlappy()
}

/* (DEVAMI SENİN KODUN — AYNI) */

</script>

========================= -->




<script>

/* =========================
🔥 GERÇEK 2048 ENGINE (MOBİL + KLAVYE)
========================= */

let grid = [];
let size = 4;
let tileSize = 90;
let gap = 10;

function start2048(){
currentGame = "2048";
openGame();
init2048();
}

/* INIT */
function init2048(){
grid = Array(size).fill().map(()=>Array(size).fill(0));
score = 0;

spawn();
spawn();
draw2048();

document.getElementById("scoreText").innerText = "Skor: 0";
}

/* SPAWN */
function spawn(){
let empty = [];

for(let i=0;i<size;i++){
for(let j=0;j<size;j++){
if(grid[i][j] === 0){
empty.push({i,j});
}
}
}

if(empty.length === 0){
checkGameOver();
return;
}

let r = empty[Math.floor(Math.random()*empty.length)];
grid[r.i][r.j] = Math.random() < 0.9 ? 2 : 4;
}

/* DRAW */
function draw2048(){
ctx.clearRect(0,0,canvas.width,canvas.height);

for(let i=0;i<size;i++){
for(let j=0;j<size;j++){

let x = j*(tileSize+gap)+gap;
let y = i*(tileSize+gap)+gap;

ctx.fillStyle = "#e5e7eb";
ctx.fillRect(x,y,tileSize,tileSize);

let val = grid[i][j];
if(val !== 0){
ctx.fillStyle = getColor(val);
ctx.fillRect(x,y,tileSize,tileSize);

ctx.fillStyle = val > 4 ? "#fff" : "#000";
ctx.font = "bold 24px Arial";
ctx.textAlign = "center";
ctx.textBaseline = "middle";
ctx.fillText(val, x+tileSize/2, y+tileSize/2);
}
}
}
}

/* COLOR */
function getColor(v){
const map = {
2:"#fef3c7",
4:"#fde68a",
8:"#fbbf24",
16:"#f59e0b",
32:"#f97316",
64:"#ef4444",
128:"#60a5fa",
256:"#3b82f6",
512:"#2563eb",
1024:"#1d4ed8",
2048:"#111827"
};
return map[v] || "#000";
}

/* MOVE */
function move(dir){
let moved = false;

let rotate = (grid)=>{
let res = Array(size).fill().map(()=>Array(size).fill(0));
for(let i=0;i<size;i++){
for(let j=0;j<size;j++){
res[j][size-1-i] = grid[i][j];
}
}
return res;
};

let slide = (row)=>{
let arr = row.filter(v=>v);
for(let i=0;i<arr.length-1;i++){
if(arr[i] === arr[i+1]){
arr[i]*=2;
score += arr[i];
arr[i+1]=0;
}
}
arr = arr.filter(v=>v);
while(arr.length < size) arr.push(0);
return arr;
};

let rotated = false;

if(dir==="up"){ grid = rotate(grid); rotated=true; }
if(dir==="down"){ grid = rotate(rotate(rotate(grid))); rotated=true; }
if(dir==="right"){ grid = rotate(rotate(grid)); rotated=true; }

for(let i=0;i<size;i++){
let row = grid[i];
let newRow = slide(row);
if(JSON.stringify(row)!==JSON.stringify(newRow)){
moved = true;
}
grid[i] = newRow;
}

if(rotated){
if(dir==="up"){ grid = rotate(rotate(rotate(grid))); }
if(dir==="down"){ grid = rotate(grid); }
if(dir==="right"){ grid = rotate(rotate(grid)); }
}

if(moved){
spawn();
draw2048();
document.getElementById("scoreText").innerText = "Skor: "+score;
checkGameOver();
}
}

/* GAME OVER */
function checkGameOver(){
for(let i=0;i<size;i++){
for(let j=0;j<size;j++){
if(grid[i][j]===0) return;
if(j<3 && grid[i][j]===grid[i][j+1]) return;
if(i<3 && grid[i][j]===grid[i+1][j]) return;
}
}
gameOver("Skor: "+score);
}

/* TOUCH (MOBİL) */
let startX=0,startY=0;

canvas.addEventListener("touchstart",e=>{
startX = e.touches[0].clientX;
startY = e.touches[0].clientY;
});

canvas.addEventListener("touchend",e=>{
let dx = e.changedTouches[0].clientX - startX;
let dy = e.changedTouches[0].clientY - startY;

if(Math.abs(dx) > Math.abs(dy)){
if(dx > 30) move("right");
if(dx < -30) move("left");
}else{
if(dy > 30) move("down");
if(dy < -30) move("up");
}
});

/* KEYBOARD */
document.addEventListener("keydown",e=>{
if(currentGame!=="2048") return;

if(e.key==="ArrowUp") move("up");
if(e.key==="ArrowDown") move("down");
if(e.key==="ArrowLeft") move("left");
if(e.key==="ArrowRight") move("right");
});

</script>
