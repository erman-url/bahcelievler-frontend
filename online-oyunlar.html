<!DOCTYPE html>
<html lang="tr" class="no-js">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Online Oyunlar | Bahçelievler Forum</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">

<style>

/* SAFE AREA */

body{
padding-top:env(safe-area-inset-top);
background:#f5f7fb;
}

/* PAGE */

.page-wrapper{
max-width:900px;
margin:auto;
padding-bottom:calc(140px + env(safe-area-inset-bottom));
}

/* TITLE */

.page-title{
font-size:22px;
font-weight:700;
padding:20px;
}

/* GAME GRID */

.game-grid{
display:grid;
gap:14px;
padding:16px;
}

/* CARD */

.game-card{

background:white;
border-radius:16px;

padding:18px;

box-shadow:0 6px 16px rgba(0,0,0,.06);

display:flex;
align-items:center;

cursor:pointer;

transition:.2s;

}

.game-card:hover{
transform:translateY(-3px);
}

.game-icon{
font-size:24px;
color:#2563eb;
}

.game-info{
flex:1;
margin-left:12px;
}

.game-title{
font-weight:700;
}

.game-desc{
font-size:13px;
color:#666;
margin-top:4px;
}

/* GAME AREA */

.game-area{
display:none;
padding:20px;
padding-bottom:160px;
}

/* BACK */

.back-btn{
margin-bottom:15px;
cursor:pointer;
color:#2563eb;
font-weight:600;
}

/* ===== WORD GAME ===== */

.letters{
display:flex;
flex-wrap:wrap;
gap:8px;
margin-bottom:10px;
}

.letter{
background:#111;
color:white;
padding:10px 14px;
border-radius:8px;
font-weight:700;
}

#wordInput{
padding:10px;
width:100%;
border-radius:8px;
border:1px solid #ccc;
margin-bottom:10px;
}

.word-list{
font-size:14px;
margin-top:10px;
}

/* ===== REFLEX ===== */

#reflexBox{

height:180px;

border-radius:16px;

background:#ddd;

display:flex;
align-items:center;
justify-content:center;

font-size:20px;
font-weight:700;

cursor:pointer;

}

/* ===== MEMORY ===== */

.memory-grid{

display:grid;

grid-template-columns:repeat(4,1fr);

gap:8px;

margin-top:10px;

}

.memory-card{

background:#2563eb;

height:70px;

border-radius:10px;

display:flex;

align-items:center;

justify-content:center;

font-size:22px;

color:white;

cursor:pointer;

}

.memory-card.open{
background:white;
color:black;
}

</style>
</head>

<body>

<div id="globalHeader"></div>

<div class="page-wrapper">

<div class="page-title">🎮 Online Oyunlar</div>

<div id="menu" class="game-grid">

<div class="game-card" onclick="openGame('word')">

<div class="game-icon">
<i class="fa-solid fa-keyboard"></i>
</div>

<div class="game-info">
<div class="game-title">Kelime Makinesi</div>
<div class="game-desc">Harflerden kaç kelime çıkarabilirsin?</div>
</div>

</div>

<div class="game-card" onclick="openGame('reflex')">

<div class="game-icon">
<i class="fa-solid fa-bolt"></i>
</div>

<div class="game-info">
<div class="game-title">Refleks Testi</div>
<div class="game-desc">Işık yanınca en hızlı sen bas</div>
</div>

</div>

<div class="game-card" onclick="openGame('memory')">

<div class="game-icon">
<i class="fa-solid fa-brain"></i>
</div>

<div class="game-info">
<div class="game-title">Hafıza Kartları</div>
<div class="game-desc">Aynı kartları eşleştir</div>
</div>

</div>

</div>


<!-- WORD GAME -->

<div id="wordGame" class="game-area">

<div class="back-btn" onclick="goBack()">← Oyunlara dön</div>

<h3>Kelime Makinesi</h3>

<div class="letters" id="letters"></div>

<input id="wordInput" placeholder="Kelime yaz">

<button onclick="submitWord()">Ekle</button>

<div class="word-list" id="wordList"></div>

</div>


<!-- REFLEX GAME -->

<div id="reflexGame" class="game-area">

<div class="back-btn" onclick="goBack()">← Oyunlara dön</div>

<h3>Refleks Testi</h3>

<div id="reflexBox">Bekle...</div>

</div>


<!-- MEMORY GAME -->

<div id="memoryGame" class="game-area">

<div class="back-btn" onclick="goBack()">← Oyunlara dön</div>

<h3>Hafıza Oyunu</h3>

<div class="memory-grid" id="memoryGrid"></div>

</div>

</div>


<script>

/* OYUN GEÇİŞ */

function openGame(name){

document.getElementById("menu").style.display="none"

document.querySelectorAll(".game-area").forEach(el=>el.style.display="none")

document.getElementById(name+"Game").style.display="block"

}

function goBack(){

document.getElementById("menu").style.display="grid"

document.querySelectorAll(".game-area").forEach(el=>el.style.display="none")

}


/* WORD GAME */

const letters=["A","E","K","L","M","T","R","S"]

const lettersDiv=document.getElementById("letters")

letters.forEach(l=>{

const div=document.createElement("div")

div.className="letter"

div.textContent=l

lettersDiv.appendChild(div)

})

let words=[]

function submitWord(){

const input=document.getElementById("wordInput")

const w=input.value.toUpperCase()

if(w.length<2) return

words.push(w)

document.getElementById("wordList").innerHTML=words.join(", ")

input.value=""

}


/* REFLEX GAME */

let startTime

const box=document.getElementById("reflexBox")

setTimeout(()=>{

box.style.background="green"

box.textContent="BAS!"

startTime=Date.now()

},2000+Math.random()*2000)

box.onclick=function(){

if(box.style.background==="green"){

let time=Date.now()-startTime

box.textContent=time+" ms"

box.style.background="#2563eb"

}

}


/* MEMORY GAME */

const symbols=["🍎","🍎","🚗","🚗","🐱","🐱","⚽","⚽"]

symbols.sort(()=>Math.random()-0.5)

let open=[]

symbols.forEach(s=>{

const card=document.createElement("div")

card.className="memory-card"

card.dataset.symbol=s

card.onclick=function(){

card.classList.add("open")

card.textContent=s

open.push(card)

if(open.length==2){

if(open[0].dataset.symbol!==open[1].dataset.symbol){

setTimeout(()=>{

open.forEach(c=>{

c.classList.remove("open")

c.textContent=""

})

open=[]

},700)

}else{

open=[]

}

}

}

document.getElementById("memoryGrid").appendChild(card)

})

</script>


<!-- MERKEZİ SİSTEMLER -->

<script src="assets/js/layout.js"></script>
<script src="assets/js/menu.js"></script>
<script src="assets/js/core.js"></script>
<script src="assets/js/footerNav.js"></script>
<script src="assets/js/footerLegal.js"></script>

<div id="globalFooter"></div>

</body>
</html>
