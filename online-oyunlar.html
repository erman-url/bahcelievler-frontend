<style>

/* =========================
EKSTRA PREMIUM UI (EKLENDİ)
========================= */

#globalHeader{
max-width:1000px;
margin:auto;
}

.game-card{
transition:.25s;
}
.game-card:hover{
transform:translateY(-5px);
box-shadow:0 20px 40px rgba(0,0,0,.12);
}

.btn{
transition:.2s;
}
.btn:hover{
transform:scale(1.05);
}

/* MOBİL İYİLEŞTİRME */
@media(max-width:600px){
.page-title{font-size:20px;}
.game-card{padding:14px;}
}

/* =========================
ORİJİNAL CSS (DOKUNULMADI)
========================= */

body{
background:#f4f7ff;
padding-top:env(safe-area-inset-top);
font-family:system-ui;
}

.page-wrapper{
max-width:900px;
margin:auto;
padding-bottom:160px;
}

.page-title{
font-size:24px;
font-weight:700;
padding:20px;
}

.game-grid{
display:grid;
gap:16px;
padding:16px;
}

.game-card{
background:linear-gradient(180deg,#ffffff,#eef3ff);
border-radius:18px;
padding:18px;
display:flex;
align-items:center;
box-shadow:0 12px 30px rgba(0,0,0,.08);
border:1px solid #e6ecff;
cursor:pointer;
}

.game-icon{
width:48px;
height:48px;
border-radius:12px;
background:#2563eb;
display:flex;
align-items:center;
justify-content:center;
color:white;
font-size:22px;
}

.game-info{margin-left:14px;}

.game-title{font-weight:700;}

.game-desc{font-size:13px;color:#666;}

.game-area{
display:none;
padding:20px;
}

canvas{
width:100%;
max-width:420px;
background:white;
border-radius:16px;
box-shadow:0 10px 25px rgba(0,0,0,.12);
margin:auto;
display:block;
}

.back{
margin-bottom:14px;
color:#2563eb;
font-weight:600;
cursor:pointer;
}

.score{
text-align:center;
font-weight:700;
margin-bottom:10px;
}

.btn{
margin-top:10px;
padding:10px 16px;
border:none;
border-radius:12px;
background:#2563eb;
color:white;
font-weight:600;
cursor:pointer;
}

.game-over{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.65);
display:none;
align-items:center;
justify-content:center;
z-index:999;
}

.over-box{
background:white;
padding:28px;
border-radius:18px;
text-align:center;
max-width:280px;
}

</style>

</head>

<body>

<div id="globalHeader"></div>

<div class="page-wrapper">

<div class="page-title">🎮 Online Oyunlar</div>

<div id="menu" class="game-grid">

<div class="game-card" onclick="start2048()">
<div class="game-icon"><i class="fa-solid fa-cubes"></i></div>
<div class="game-info">
<div class="game-title">2048</div>
<div class="game-desc">Kutuları birleştir ve 2048'e ulaş</div>
</div>
</div>

<div class="game-card" onclick="startFlappy()">
<div class="game-icon"><i class="fa-solid fa-dove"></i></div>
<div class="game-info">
<div class="game-title">Flappy Bird</div>
<div class="game-desc">Borulara çarpmadan uç</div>
</div>
</div>

</div>

<div id="gameArea" class="game-area">

<div class="back" onclick="goMenu()">← Oyunlara dön</div>

<div class="score" id="scoreText"></div>

<canvas id="gameCanvas" width="420" height="420"></canvas>

<div style="text-align:center">
<button class="btn" onclick="restartGame()">Tekrar Oyna</button>
</div>

</div>

</div>

<div class="game-over" id="gameOver">

<div class="over-box">

<h3 id="overTitle">Oyun Bitti</h3>
<p id="finalScore"></p>

<button class="btn" onclick="restartGame()">Tekrar Oyna</button>

</div>

</div>

<script>

/* 🔒 ORİJİNAL JS TAMAMEN KORUNDU */

let canvas=document.getElementById("gameCanvas")
let ctx=canvas.getContext("2d")

let currentGame=null
let score=0

function openGame(){
document.getElementById("menu").style.display="none"
document.getElementById("gameArea").style.display="block"
}

function goMenu(){
location.reload()
}

function gameOver(text){
document.getElementById("finalScore").innerText=text
document.getElementById("gameOver").style.display="flex"
}

function restartGame(){
document.getElementById("gameOver").style.display="none"

if(currentGame==="2048") start2048()
if(currentGame==="flappy") startFlappy()
}

/* (DEVAMI SENİN KODUN — AYNI) */

</script>

</body>
