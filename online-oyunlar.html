<style>

/* =========================
EKSTRA PREMIUM UI (GÜNCELLENDİ)
========================= */

#globalHeader{
max-width:1000px;
margin:auto;
position:sticky;
top:0;
z-index:1000;
backdrop-filter:blur(10px);
}

/* 🔥 PREMIUM BACKGROUND (OVERRIDE) */
body{
background:
radial-gradient(circle at top,#eef2ff 0%,#f8fbff 60%,#ffffff 100%) !important;
padding-top:env(safe-area-inset-top);
font-family:system-ui;
}


/* =========================
CARD SYSTEM (ULTRA PREMIUM)
========================= */

.game-card{
  position:relative;

  display:flex;
  align-items:center;

  padding:16px;

  border-radius:22px;

  background:
  linear-gradient(145deg,rgba(255,255,255,0.9),rgba(240,245,255,0.8));

  backdrop-filter:blur(16px) saturate(160%);

  border:1px solid rgba(255,255,255,0.7);

  box-shadow:
    0 8px 20px rgba(0,0,0,0.06),
    0 2px 6px rgba(0,0,0,0.04),
    inset 0 1px 0 rgba(255,255,255,0.8);

  transition:all .25s ease;
}


.game-card:active{
  transform:scale(.96);
}

/* 🔥 ACTIVE TOUCH */
.game-card:active{
transform:scale(.97);
}



/* =========================
ICON (GLOW + DEPTH)
========================= */

.game-icon{
  width:52px;
  height:52px;

  border-radius:16px;

  background:
    linear-gradient(135deg,#2563eb,#1d4ed8);

  display:flex;
  align-items:center;
  justify-content:center;

  color:#fff;
  font-size:22px;

  box-shadow:
    0 10px 25px rgba(37,99,235,.45),
    inset 0 2px 6px rgba(255,255,255,.35);
}

/* =========================
TEXT
========================= */

.game-info{margin-left:14px;}

.game-title{
  font-size:16px;
  font-weight:800;
  letter-spacing:-0.2px;
}

.game-desc{
  font-size:12.5px;
  color:#6b7280;
}

/* =========================
BUTTON
========================= */

.btn{
margin-top:10px;
padding:12px 18px;
border:none;
border-radius:14px;

background:linear-gradient(135deg,#2563eb,#1d4ed8);
color:white;

font-weight:600;
cursor:pointer;

transition:.25s;
}

.btn:hover{
transform:scale(1.06);
box-shadow:0 10px 25px rgba(37,99,235,.4);
}

/* =========================
LAYOUT
========================= */

.page-wrapper{
max-width:900px;
margin:auto;
padding-bottom:160px;
}

.game-grid{
display:grid;
gap:16px;
padding:16px;
}

/* =========================
GAME AREA
========================= */

.game-area{
display:none;
padding:20px;
}

canvas{
width:100%;
max-width:420px;

background:white;

border-radius:20px;

box-shadow:
0 20px 50px rgba(0,0,0,.15),
inset 0 1px 0 rgba(255,255,255,.5);

margin:auto;
display:block;
}

/* =========================
NAV / UI
========================= */

.back{
margin-bottom:14px;
color:#2563eb;
font-weight:600;
cursor:pointer;
}

.score{
text-align:center;
font-weight:700;
margin-bottom:10px;
}

/* =========================
GAME OVER MODAL
========================= */

.game-over{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;

background:rgba(0,0,0,.55);
backdrop-filter:blur(6px);

display:none;
align-items:center;
justify-content:center;

z-index:999;
}

.over-box{
background:white;

padding:28px;
border-radius:20px;

text-align:center;
max-width:280px;

box-shadow:0 20px 50px rgba(0,0,0,.2);
}


/* =========================
MENU FIX
========================= */

.menu-overlay{
z-index:9999 !important;
}


/* CAM GERÇEK AKTİF */
.game-card{
background:rgba(255,255,255,0.65) !important;
backdrop-filter:blur(18px) saturate(160%) !important;

border-radius:26px !important;

box-shadow:
0 20px 60px rgba(0,0,0,0.12),
0 8px 20px rgba(37,99,235,0.12),
inset 0 1px 0 rgba(255,255,255,0.7) !important;
}

/* HOVER = APP FEEL */
.game-card:hover{
transform:translateY(-8px) scale(1.03) !important;

box-shadow:
0 35px 80px rgba(0,0,0,0.2),
0 10px 30px rgba(37,99,235,0.25) !important;
}


/* CARD ARASI BOŞLUK */
.game-grid{
gap:20px !important;
}

canvas{
width:100% !important;
max-width:420px;
height:auto;
}

/* FLAPPY PREMIUM EFFECT */
canvas{
background:linear-gradient(180deg,#dbeafe,#eff6ff);
}

.game-over h3{
font-size:22px;
color:#2563eb;
}

.game-over p{
font-weight:700;
font-size:18px;
}

/* ===============================
PREMIUM HEADER (GLOBAL SYSTEM)
=============================== */

.premium-header{
  margin:16px;
  padding:18px;
  border-radius:20px;

  background:
  linear-gradient(135deg,#2b7be4,#0e4fa8),
  radial-gradient(circle at top right, rgba(255,255,255,.12), transparent);

  box-shadow:
  0 12px 30px rgba(0,0,0,.18),
  inset 0 1px 0 rgba(255,255,255,.25);

  color:#fff;
}

.header-content{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.premium-header .title{
  font-size:22px;
  font-weight:900;
}

.premium-header .sub{
  font-size:13px;
  margin-top:4px;
  opacity:.9;
}

.header-icon{
  width:48px;
  height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:14px;
  background:rgba(255,255,255,.2);
  font-size:20px;
}

.game-card::after{
  content:"›";

  position:absolute;
  right:16px;

  font-size:22px;
  font-weight:700;

  color:#9ca3af;

  transition:.2s;
}

.game-card:hover::after{
  transform:translateX(4px);
  color:#2563eb;
}

</style>

</head>

<body>

<div id="globalHeader"></div>

<div class="page-wrapper">

<div class="page-header premium-header">

  <div class="header-content">

    <div class="header-text">
      <div class="title">Online Oyunlar</div>
      <div class="sub">
        Hemen oyna • Skor yap • Eğlen
      </div>
    </div>

    <div class="header-icon">
      <i class="fas fa-gamepad"></i>
    </div>

  </div>

</div>

<div id="menu" class="game-grid">

<div class="game-card" onclick="location.href='2048.html'">
<div class="game-icon"><i class="fa-solid fa-cubes"></i></div>
<div class="game-info">
<div class="game-title">2048</div>
<div class="game-desc">Kutuları birleştir ve 2048'e ulaş</div>
</div>
</div>

<div class="game-card" onclick="location.href='flappy.html'">
<div class="game-icon"><i class="fa-solid fa-dove"></i></div>
<div class="game-info">
<div class="game-title">Flappy Bird</div>

</div>
</div>

<div class="game-card" onclick="location.href='bubble-pop.html'">
<div class="game-icon"><i class="fa-solid fa-circle"></i></div>
<div class="game-info">
<div class="game-title">Bubble Pop</div>

</div>
</div>

</div>

<div id="gameArea" class="game-area">

<div class="back" onclick="goMenu()">← Oyunlara dön</div>

<div class="score" id="scoreText"></div>

<canvas id="gameCanvas" width="420" height="420"></canvas>

<div style="text-align:center">
<button class="btn" onclick="restartGame()">Tekrar Oyna</button>
</div>

</div>

</div>

<div class="game-over" id="gameOver">

<div class="over-box">

<h3 id="overTitle">Oyun Bitti</h3>
<p id="finalScore"></p>

<button class="btn" onclick="restartGame()">Tekrar Oyna</button>

</div>

</div>

<script>

/* 🔒 ORİJİNAL JS TAMAMEN KORUNDU */

let canvas=document.getElementById("gameCanvas")
let ctx=canvas.getContext("2d")

let currentGame=null
let score=0

function openGame(){
document.getElementById("menu").style.display="none"
document.getElementById("gameArea").style.display="block"
}

function goMenu(){
location.reload()
}

function gameOver(text){
document.getElementById("finalScore").innerText=text
document.getElementById("gameOver").style.display="flex"
}

function restartGame(){
document.getElementById("gameOver").style.display="none"

if(currentGame==="2048") start2048()
if(currentGame==="flappy") startFlappy()
}

/* (DEVAMI SENİN KODUN — AYNI) */

</script>
