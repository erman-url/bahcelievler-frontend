<style>

/* =========================
EKSTRA PREMIUM UI (FINAL)
========================= */

#globalHeader{
  max-width:1000px;
  margin:auto;
  position:sticky;
  top:0;
  z-index:1000;
  backdrop-filter:blur(10px);
}

/* 🔥 PREMIUM BACKGROUND */
body{
  background:
  radial-gradient(circle at top,#eef2ff 0%,#f8fbff 60%,#ffffff 100%) !important;
  padding-top:env(safe-area-inset-top);
  font-family:system-ui;
}

/* =========================
CARD SYSTEM (APP LEVEL)
========================= */

.game-card{
  position:relative;
  overflow:hidden;

  display:flex;
  align-items:center;

  padding:16px;

  border-radius:22px;

  background:
  linear-gradient(145deg,rgba(255,255,255,0.95),rgba(240,245,255,0.85));

  backdrop-filter:blur(18px) saturate(160%);

  border:1px solid rgba(255,255,255,0.7);

  box-shadow:
    0 10px 25px rgba(0,0,0,0.06),
    0 4px 10px rgba(0,0,0,0.04),
    inset 0 1px 0 rgba(255,255,255,0.9);

  transition:all .25s ease;
}

/* ✨ LIGHT EFFECT */
.game-card::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    120deg,
    rgba(255,255,255,0.7),
    transparent 40%
  );
  opacity:.35;
  pointer-events:none;
}

/* 👉 APP HOVER */
.game-card:hover{
  transform:translateY(-4px);
  box-shadow:
    0 20px 50px rgba(0,0,0,0.12),
    0 8px 20px rgba(37,99,235,0.15);
}

/* 👉 TOUCH FEEDBACK */
.game-card:active{
  transform:scale(.96);
}

/* 👉 RIGHT ARROW UX */
.game-card::after{
  content:"›";
  position:absolute;
  right:16px;
  font-size:20px;
  font-weight:700;
  color:#9ca3af;
  opacity:.6;
  transition:.2s;
}

.game-card:hover::after{
  transform:translateX(6px);
  color:#2563eb;
  opacity:1;
}

/* =========================
ICON (APP STYLE)
========================= */

.game-icon{
  position:relative;

  width:52px;
  height:52px;

  border-radius:16px;

  background:
    linear-gradient(135deg,#2563eb,#1d4ed8);

  display:flex;
  align-items:center;
  justify-content:center;

  color:#fff;
  font-size:22px;

  box-shadow:
    0 12px 30px rgba(37,99,235,.45),
    inset 0 2px 6px rgba(255,255,255,.35);
}

/* ✨ ICON GLOW */
.game-icon::after{
  content:"";
  position:absolute;
  inset:-6px;
  border-radius:20px;
  background:radial-gradient(
    circle,
    rgba(37,99,235,.25),
    transparent 70%
  );
  z-index:-1;
}

/* =========================
TEXT
========================= */

.game-info{
  margin-left:14px;
}

.game-title{
  font-size:16px;
  font-weight:800;
  letter-spacing:-0.2px;
}

.game-desc{
  font-size:12.5px;
  color:#6b7280;
}

/* =========================
BUTTON
========================= */

.btn{
  margin-top:10px;
  padding:12px 18px;
  border:none;
  border-radius:14px;

  background:linear-gradient(135deg,#2563eb,#1d4ed8);
  color:white;

  font-weight:600;
  cursor:pointer;

  transition:.25s;
}

.btn:hover{
  transform:scale(1.06);
  box-shadow:0 10px 25px rgba(37,99,235,.4);
}

/* =========================
LAYOUT
========================= */

.page-wrapper{
  max-width:900px;
  margin:auto;
  padding-bottom:160px;
}

.game-grid{
  display:grid;
  gap:20px;
  padding:18px;
}

/* =========================
GAME AREA
========================= */

.game-area{
  display:none;
  padding:20px;
}

canvas{
  width:100% !important;
  max-width:420px;
  height:auto;

  background:linear-gradient(180deg,#dbeafe,#eff6ff);

  border-radius:20px;

  box-shadow:
    0 20px 50px rgba(0,0,0,.15),
    inset 0 1px 0 rgba(255,255,255,.5);

  margin:auto;
  display:block;
}

/* =========================
NAV / UI
========================= */

.back{
  margin-bottom:14px;
  color:#2563eb;
  font-weight:600;
  cursor:pointer;
}

.score{
  text-align:center;
  font-weight:700;
  margin-bottom:10px;
}

/* =========================
GAME OVER MODAL
========================= */

.game-over{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;

  background:rgba(0,0,0,.55);
  backdrop-filter:blur(6px);

  display:none;
  align-items:center;
  justify-content:center;

  z-index:999;
}

.over-box{
  background:white;

  padding:28px;
  border-radius:20px;

  text-align:center;
  max-width:280px;

  box-shadow:0 20px 50px rgba(0,0,0,.2);
}

.game-over h3{
  font-size:22px;
  color:#2563eb;
}

.game-over p{
  font-weight:700;
  font-size:18px;
}

/* =========================
MENU FIX
========================= */

.menu-overlay{
  z-index:9999 !important;
}

/* ===============================
PREMIUM HEADER (GLOBAL)
=============================== */

.premium-header{
  margin:16px;
  padding:18px;
  border-radius:20px;

  background:
  linear-gradient(135deg,#2b7be4,#0e4fa8),
  radial-gradient(circle at top right, rgba(255,255,255,.12), transparent);

  box-shadow:
  0 12px 30px rgba(0,0,0,.18),
  inset 0 1px 0 rgba(255,255,255,.25);

  color:#fff;
}

.header-content{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.premium-header .title{
  font-size:22px;
  font-weight:900;
}

.premium-header .sub{
  font-size:13px;
  margin-top:4px;
  opacity:.9;
}

.header-icon{
  width:48px;
  height:48px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:14px;
  background:rgba(255,255,255,.2);
  font-size:20px;
}


.game-card:nth-child(4) .game-icon{
  background:linear-gradient(135deg,#7c3aed,#4f46e5);
  box-shadow:0 12px 30px rgba(124,58,237,.4);
}


.game-card::before{
content:"YENİ";
position:absolute;
top:8px;
left:8px;
font-size:10px;
background:#22c55e;
color:#fff;
padding:2px 6px;
border-radius:6px;
}

</style>

</head>

<script>

/* 🔒 ORİJİNAL JS TAMAMEN KORUNDU */

}

}

}

function restartGame(){
document.getElementById("gameOver").style.display="none"

if(currentGame==="2048") start2048()
if(currentGame==="flappy") startFlappy()
}
