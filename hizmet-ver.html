<script>

/* ===============================
MODAL SYSTEM (DUAL - FULL FIX)
=============================== */
document.addEventListener("click", function(e){

const formModal = document.getElementById("hizmetModal");
const detayModal = document.getElementById("detayModal");

/* ===============================
FORM MODAL OPEN
=============================== */
if(e.target.closest("#openModalBtn")){
formModal.classList.add("active");
document.body.style.overflow = "hidden";
return;
}
/* DETAY MODAL OPEN (CARD) */
const card = e.target.closest(".hizmet-card");

if(card && !e.target.closest(".hizmet-actions")){

document.getElementById("detayTitle").innerText = card.dataset.firma;

document.getElementById("detayMeta").innerText =
card.dataset.kategori + " • " + card.dataset.mahalle;

document.getElementById("detayText").innerText =
card.dataset.detay || "Detay bilgisi girilmemiş";

document.getElementById("detayPhone").innerText =
"📞 " + card.dataset.telefon;

document.getElementById("detayImg").src = card.dataset.img;

/* 🔥 BURAYA EKLENECEK */
document.getElementById("detayCall").href =
"tel:" + card.dataset.telefon.replace(/\D/g,'');

document.getElementById("detayWp").href =
"https://wa.me/90" + card.dataset.telefon.replace(/^0/,'');

detayModal.classList.add("active");
document.body.style.overflow = "hidden";

return;
}

/* ===============================
FORM CLOSE
=============================== */
if(e.target.closest("#closeModal")){
formModal.classList.remove("active");
document.body.style.overflow = "";
return;
}

/* ===============================
DETAY CLOSE
=============================== */
if(e.target.closest("#closeDetayModal")){
detayModal.classList.remove("active");
document.body.style.overflow = "";
return;
}

/* ===============================
BACKDROP
=============================== */
if(e.target.id === "hizmetModal" || e.target.id === "detayModal"){
e.target.classList.remove("active");
document.body.style.overflow = "";
return;
}

});


/* ===============================
UTILS (XSS)
=============================== */
function escapeHTML(str){
return String(str || "").replace(/[&<>"']/g, function(m){
return ({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#039;"
})[m];
});
}


/* ===============================
CHAR COUNT
=============================== */
const textarea = document.querySelector('[name="detay"]');
const charCount = document.getElementById('charCount');

if(textarea){
textarea.addEventListener('input', ()=>{
charCount.textContent = textarea.value.length + " / 750";
});
}


/* ===============================
FILE VALIDATION
=============================== */
const fileInput = document.querySelector('[name="gorsel"]');

if(fileInput){
fileInput.addEventListener('change', ()=>{

if(fileInput.files.length > 2){
alert("En fazla 2 görsel yükleyebilirsiniz.");
fileInput.value="";
return;
}

for(let file of fileInput.files){
if(file.size > 2 * 1024 * 1024){
alert("Görsel boyutu 2MB'ı geçemez.");
fileInput.value="";
return;
}
}

});
}


/* ===============================
FORM SUBMIT
=============================== */
const form = document.getElementById("hizmetForm");
const btn = document.querySelector(".submit-btn");

if(form){
form.addEventListener("submit", async function(e){

e.preventDefault();

if(btn.classList.contains("loading")) return;

btn.classList.add("loading");
btn.innerText = "Gönderiliyor...";

const formData = new FormData(this);

try{

const res = await fetch("https://bahcelievler-api.erman-urel.workers.dev/api/hizmet-ekle", {
method:"POST",
body:formData
});

if(!res) throw new Error("Bağlantı hatası");

const data = await res.json();

if(!res.ok){
throw new Error(data.error || "Sunucu hatası");
}

alert("Hizmet başarıyla gönderildi ✔");

this.reset();

if(charCount) charCount.textContent = "0 / 750";

if(typeof loadHizmetler === "function"){
loadHizmetler();
}

}catch(err){

alert("Hata: " + (err.message || "Bilinmeyen hata"));

}finally{

btn.classList.remove("loading");
btn.innerText = "HİZMETİ YAYINLA";

}

});
}


/* ===============================
LOAD HİZMETLER (DETAY DATA EKLİ)
=============================== */
async function loadHizmetler(){

const list = document.getElementById("hizmetList");
list.innerHTML = `<div class="note">Yükleniyor...</div>`;

try{

const res = await fetch("https://bahcelievler-api.erman-urel.workers.dev/api/hizmetler");

if(!res.ok) throw new Error("Liste alınamadı");

const data = await res.json();

if(!Array.isArray(data) || data.length === 0){
list.innerHTML = `<div class="note">Henüz hizmet yok</div>`;
return;
}

const filteredData = data.filter(item => item.gorsel && item.gorsel.trim() !== "");

if(filteredData.length === 0){
list.innerHTML = `<div class="note">Henüz görselli hizmet yok</div>`;
return;
}

list.innerHTML = filteredData.map(item=>{

const img = item.gorsel;

const phone = item.telefon.replace(/\D/g,'');

return `
<div class="hizmet-card"
data-firma="${escapeHTML(item.firma)}"
data-kategori="${escapeHTML(item.kategori)}"
data-mahalle="${escapeHTML(item.mahalle)}"
data-telefon="${escapeHTML(item.telefon)}"
data-detay="${escapeHTML(item.detay && item.detay.trim() ? item.detay : '')}"
data-img="${img}"
>

<img src="${img}" class="hizmet-img" loading="lazy"
onerror="this.src='assets/img/no-image.jpg'">

<div class="hizmet-body">

<div class="hizmet-title">${escapeHTML(item.firma)}</div>

<div class="hizmet-meta">
${escapeHTML(item.kategori)} • ${escapeHTML(item.mahalle)}
</div>

<div class="hizmet-phone">
📞 ${escapeHTML(item.telefon)}
</div>

<div class="hizmet-actions">

<a href="tel:${phone}" class="call-btn">Ara</a>

<a href="https://wa.me/90${phone.replace(/^0/,'')}" 
class="whatsapp-btn" target="_blank" rel="noopener">
WhatsApp
</a>

</div>

</div>
</div>
`;

}).join("");

}catch(e){

console.error("Liste yüklenemedi:", e);
list.innerHTML = `<div class="note">Liste yüklenemedi</div>`;

}

}

loadHizmetler();

</script>
